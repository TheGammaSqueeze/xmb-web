 D=await fetch('globe_assets/c3000_surface.json').then(r=>r.json());
 black=blackTex();
 sharedTex.tex4=texF32('globe_assets/c3000_tex/t04_f32.bin',256,128);
 sharedTex.tex5=texF32('globe_assets/c3000_tex/t05_f32.bin',256,1);
 sharedTex.tex6=texF32('globe_assets/c3000_tex/t06_f32.bin',64,64);
 sharedTex.tex14=texPNG('globe_assets/c3000_tex/t14.png');
 sharedTex.tex15=texPNG('globe_assets/c3000_tex/t15.png');
 for(let i=0;i<D.patches.length;i++){const d=D.patches[i].idx; patchTex.push({
   t0:texPNG('globe_assets/c3000_tex/p%s_t00.png'.replace('%s',String(d).padStart(3,'0'))),
   t1:texPNG('globe_assets/c3000_tex/p%s_t01.png'.replace('%s',String(d).padStart(3,'0'))),
   t2:texPNG('globe_assets/c3000_tex/p%s_t02.png'.replace('%s',String(d).padStart(3,'0'))),
   t3:texPNG('globe_assets/c3000_tex/p%s_t03.png'.replace('%s',String(d).padStart(3,'0')))});}
 const pos=new Float32Array(await fetch('globe_assets/mesh/live_surf0_pos.bin').then(r=>r.arrayBuffer()));
 const xyz=[];for(let i=0;i<289;i++)xyz.push(pos[i*4],pos[i*4+1],pos[i*4+2],pos[i*4+3]);
 const idx=[];const N=17;for(let i=0;i<N-1;i++)for(let j=0;j<N-1;j++){const a=i*N+j,b=a+N;idx.push(a,b,a+1,b,b+1,a+1);}
 const pb=gl.createBuffer();gl.bindBuffer(34962,pb);gl.bufferData(34962,new Float32Array(xyz),35044);
 const ib=gl.createBuffer();gl.bindBuffer(34963,ib);gl.bufferData(34963,new Uint16Array(idx),35044);
 eMesh={pb,ib,n:idx.length};
 // verbatim atmosphere shell: mesh c0 (pos.w + tc0.zw drive the shell), scatter LUT, captured fc_atmo
 if(f('atmo',0)){
   const [apb,atb,aib]=await Promise.all([
     fetch('globe_assets/mesh/c0_pos.bin').then(r=>r.arrayBuffer()),
     fetch('globe_assets/mesh/c0_tc0.bin').then(r=>r.arrayBuffer()),
     fetch('globe_assets/mesh/c0_idx.bin').then(r=>r.arrayBuffer())]);
   const apbuf=gl.createBuffer();gl.bindBuffer(34962,apbuf);gl.bufferData(34962,new Float32Array(apb),35044);
   const atbuf=gl.createBuffer();gl.bindBuffer(34962,atbuf);gl.bufferData(34962,new Float32Array(atb),35044);
   const aibuf=gl.createBuffer();gl.bindBuffer(34963,aibuf);gl.bufferData(34963,new Uint32Array(aib),35044);
   aMesh={pbuf:apbuf,tbuf:atbuf,ibuf:aibuf,n:new Uint32Array(aib).length};
   scatterTex=texF32('globe_assets/win_tex/t04_f32.bin',256,128);
   const AC=await fetch('globe_assets/c3000_consts.json').then(r=>r.json());
   fcAtmo=new Float32Array(17*4);for(let i=0;i<17;i++){const v=(AC.fc_atmo&&AC.fc_atmo[i])||[0,0,0,0];fcAtmo[i*4]=v[0];fcAtmo[i*4+1]=v[1];fcAtmo[i*4+2]=v[2];fcAtmo[i*4+3]=v[3];}
 }
 PATHS=await fetch('globe_assets/camera_paths.json').then(r=>r.json());
 preset=PATHS[P.get('preset')||'preset_7'];
 animT=f('t0',0);
 const sf=P.get('scenefile'); if(sf){ try{ SCENE=await fetch('globe_assets/'+sf).then(r=>r.json()); animT=0; }catch(e){window.__e=(window.__e||'')+'scene:'+e;} }
 if(f('scenes',0)){ try{ const idx=await fetch('globe_assets/scenes_index.json').then(r=>r.json());
   SCENES_LIST=await Promise.all(idx.map(s=>fetch('globe_assets/'+s.file).then(r=>r.json())));
   curScene=0; SCENE=SCENES_LIST[0]; animT=0; }catch(e){window.__e=(window.__e||'')+'scenes:'+e;} }
 requestAnimationFrame(frame);
}
function buildVC(corners){const s=D.shared;const vc=new Float32Array(104);const set=(i,a)=>{vc[i*4]=a[0];vc[i*4+1]=a[1];vc[i*4+2]=a[2];vc[i*4+3]=a[3];};
 set(0,corners[0]);set(1,corners[1]);set(2,corners[2]);
 const map={3:260,4:261,5:262,6:263,7:264,8:265,9:268,10:269,11:270,12:454,13:455,14:456,15:457,16:458,17:459,18:460,19:461,20:462,21:463,22:464,23:465,24:466,25:467};
 for(const k in map){const v=s[map[k]];if(v)set(+k,v);}return vc;}
function bindT(unit,name,tex){gl.activeTexture(33984+unit);gl.bindTexture(3553,tex);gl.uniform1i(gl.getUniformLocation(prog,name),unit);}
// VERBATIM atmosphere pass (limb-shell = the "type B" 3f6eeb47 draw, derived from frame-locked
// autodump consts). Basis: c5(c464)=c461, c7(c466)=c462, c6(c465)=cross(c5,c7), c8(c467)=eye=c460.
// MVP (c256-259) is the type-B MVP: same fovy as surface but a firmware-internal view rotation that
// does NOT decompose to a plain lookAt of c461/c462 -- so for a STATIC captured camera we use the
// captured c256-259 (D.shared['256'..'259'] if present); the ANIMATED type-B MVP construction is
// still being reverse-engineered (do not enable atmo on a moving camera until that lands).
function drawAtmo(){
 if(!aMesh||!scatterTex||got<want)return; const s=D.shared; if(!s['460']||!s['461']||!s['462'])return;
 const c5=s['461'].slice(0,3), c7=s['462'].slice(0,3), c6=_cross(c5,c7), c8=s['460'].slice(0,3);
 const m0=s['256']||s['260'],m1=s['257']||s['261'],m2=s['258']||s['262'],m3=s['259']||s['263'];
 gl.useProgram(aprog); const U=n=>gl.getUniformLocation(aprog,n);
 gl.uniform4fv(U('mvp0'),m0);gl.uniform4fv(U('mvp1'),m1);gl.uniform4fv(U('mvp2'),m2);gl.uniform4fv(U('mvp3'),m3);
 gl.uniform1f(U('uFlipY'),f('flipy',1));
 gl.uniform3fv(U('c5'),c5);gl.uniform3fv(U('c6'),c6);gl.uniform3fv(U('c7'),c7);gl.uniform3fv(U('c8'),c8);
 gl.uniform4fv(U('fc'),fcAtmo);
 gl.activeTexture(33984);gl.bindTexture(3553,scatterTex);gl.uniform1i(U('tex0'),0);gl.uniform1f(U('uMode'),0);
 gl.disable(2884); gl.depthMask(false); gl.enable(3042); gl.blendFunc(1,1);  // ONE,ONE additive
 let pl=gl.getAttribLocation(aprog,'in_pos');gl.bindBuffer(34962,aMesh.pbuf);gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,4,5126,false,0,0);
 let tl=gl.getAttribLocation(aprog,'in_tc0');gl.bindBuffer(34962,aMesh.tbuf);gl.enableVertexAttribArray(tl);gl.vertexAttribPointer(tl,4,5126,false,0,0);
 gl.bindBuffer(34963,aMesh.ibuf);gl.drawElements(5,aMesh.n,5125,0);
 gl.disable(3042); gl.depthMask(true);
}
// per-patch object-space winding: cross(B-A,D-A) . centroid. The single grid mesh is reused for all
// 24 patches, so cube faces on opposite hemispheres get opposite screen winding. Sign tells us which
// frontFace makes a patch's OUTWARD face the GL front face so a single cullFace(BACK) culls only the
// true back faces (per-triangle, so the limb is handled correctly). Verified vs real surf3000.
function windSign(c){const A=[c[0][0],c[1][0],c[2][0]],B=[c[0][1],c[1][1],c[2][1]],
  C=[c[0][2],c[1][2],c[2][2]],D=[c[0][3],c[1][3],c[2][3]];
  const u=[B[0]-A[0],B[1]-A[1],B[2]-A[2]],v=[D[0]-A[0],D[1]-A[1],D[2]-A[2]];
  const n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];
  const cen=[(A[0]+B[0]+C[0]+D[0])/4,(A[1]+B[1]+C[1]+D[1])/4,(A[2]+B[2]+C[2]+D[2])/4];
  return n[0]*cen[0]+n[1]*cen[1]+n[2]*cen[2];}
function draw(){
 if(!D||!eMesh||got<want)return;
 gl.viewport(0,0,1920,1080);gl.clearColor(0,0,0,1);gl.clear(16640);gl.enable(2929);gl.depthFunc(515);
 const CULL=f('cull',0); if(CULL){gl.enable(2884);gl.cullFace(1029);}else{gl.disable(2884);}
 gl.useProgram(prog);const U=n=>gl.getUniformLocation(prog,n);
 gl.uniform1f(U('uFlipY'),f('flipy',1));
 gl.uniform1f(U('uMode'),f('enc',1));
 const fc=new Float32Array(23*4); for(let i=0;i<23;i++){const v=D.fc[i];fc[i*4]=v[0];fc[i*4+1]=v[1];fc[i*4+2]=v[2];fc[i*4+3]=v[3];}
 gl.uniform4fv(U('fc'),fc);
 bindT(4,'tex4',sharedTex.tex4);bindT(5,'tex5',sharedTex.tex5);bindT(6,'tex6',sharedTex.tex6);
 bindT(7,'tex14',sharedTex.tex14);bindT(8,'tex15',sharedTex.tex15);bindT(9,'tex13',black);
 const pl=gl.getAttribLocation(prog,'in_pos');gl.bindBuffer(34962,eMesh.pb);gl.enableVertexAttribArray(pl);gl.vertexAttribPointer(pl,4,5126,false,0,0);
 gl.bindBuffer(34963,eMesh.ib);
 const fw=f('fw',0);
 for(let i=0;i<D.patches.length;i++){const pt=patchTex[i];
   bindT(0,'tex0',pt.t0);bindT(1,'tex1',pt.t1);bindT(2,'tex2',pt.t2);bindT(3,'tex3',pt.t3);
   if(CULL){let cw=windSign(D.patches[i].corners)<0; if(fw)cw=!cw; gl.frontFace(cw?2304:2305);}
   gl.uniform4fv(U('vc'),buildVC(D.patches[i].corners));gl.drawElements(4,eMesh.n,5123,0);}
 if(f('atmo',0))drawAtmo();
 window.__rendered=true;
}
// ---- VERBATIM camera animation from firmware camera.path ----
let PATHS=null, animT=0, preset=null, SCENE=null, SCENES_LIST=null, curScene=0;
// SCENE replay: play a captured per-frame consts time-series (camera + firmware lighting basis
// c461-467) -> exact per-scene lighting (fixes highlight clipping; the firmware lighting basis is
// per-frame and not derivable, so we replay the real captured values). Keys are const indices.
const SCENE_KEYS=['260','261','262','263','264','265','268','269','270','454','455','456','457','458','459','460','461','462','463','464','465','466','467'];
function sceneAt(t){ // linear interp of all consts at normalized t in [0,1]
  const F=SCENE; if(t<=F[0].t)return F[0]; if(t>=F[F.length-1].t)return F[F.length-1];
  for(let i=0;i<F.length-1;i++){const a=F[i],b=F[i+1]; if(t>=a.t&&t<=b.t){const w=(t-a.t)/((b.t-a.t)||1);
    const o={}; for(const k of SCENE_KEYS){const va=a[k],vb=b[k]; o[k]=va&&vb?va.map((x,j)=>x+(vb[j]-x)*w):va;} return o;}}
  return F[F.length-1];
}
const _sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];
const _cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const _norm=(a)=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l];};
const _dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
// firmware MVP: persp(fovy,16/9) x lookAt(eye,center,up); rows c260=(fy/asp)right, c261=fy*u, c262=c263=(fwd,-fwd.eye)
function lookAtMVP(eye,center,up,fovy){
  const fwd=_norm(_sub(center,eye)), right=_norm(_cross(fwd,up)), u=_cross(right,fwd);
  const asp=16/9, fy=1/Math.tan(fovy*Math.PI/360);
  return {c260:[(fy/asp)*right[0],(fy/asp)*right[1],(fy/asp)*right[2],-(fy/asp)*_dot(right,eye)],
          c261:[fy*u[0],fy*u[1],fy*u[2],-fy*_dot(u,eye)],
          cw:[fwd[0],fwd[1],fwd[2],-_dot(fwd,eye)], eye:[eye[0],eye[1],eye[2],1]};
}
function interp(kfs,t){
  // Catmull-Rom spline (clamped endpoints) -- VALIDATED vs real captured camera: residual 0.0028
  // (linear 0.0354, slerp 0.0102). This IS the firmware's camera-path interpolation.
  if(t<=kfs[0].t)return kfs[0]; const last=kfs[kfs.length-1]; if(t>=last.t)return last;
  for(let i=0;i<kfs.length-1;i++){const a=kfs[i],b=kfs[i+1]; if(t>=a.t&&t<=b.t){
    const w=(t-a.t)/(b.t-a.t), w2=w*w, w3=w2*w;
    const p0=kfs[Math.max(0,i-1)], p1=a, p2=b, p3=kfs[Math.min(kfs.length-1,i+2)];
    const cr=(c0,c1,c2,c3)=>0.5*((2*c1)+(-c0+c2)*w+(2*c0-5*c1+4*c2-c3)*w2+(-c0+3*c1-3*c2+c3)*w3);
    const V=k=>p1[k].map((_,j)=>cr(p0[k][j],p1[k][j],p2[k][j],p3[k][j]));
    return {eye:V('eye'),center:V('center'),up:V('up'),fovy:cr(p0.fovy,p1.fovy,p2.fovy,p3.fovy)};}}
  return last;
}
function frame(){
  if(SCENE&&D&&eMesh&&got>=want){
    const s=sceneAt(animT); for(const k of SCENE_KEYS){ if(s[k]) D.shared[k]=s[k]; }   // replay captured per-frame consts (camera + lighting)
    draw();
    const span=((SCENE[SCENE.length-1].fr||0)-(SCENE[0].fr||0))||300;
    animT += f('speed', 1/span);   // match the captured scene's real wall-clock duration
    if(animT>1){ animT=0; if(SCENES_LIST){ curScene=(curScene+1)%SCENES_LIST.length; SCENE=SCENES_LIST[curScene]; } }  // cycle scenes
  } else if(PATHS&&D&&eMesh&&got>=want&&preset){
    const kfs=preset.kf, tmax=kfs[kfs.length-1].t, cf=interp(kfs,animT), m=lookAtMVP(cf.eye,cf.center,cf.up,cf.fovy);
    D.shared['260']=m.c260; D.shared['261']=m.c261; D.shared['262']=m.cw; D.shared['263']=m.cw; D.shared['460']=m.eye;
    draw();
    animT += f('speed',0.242);        // playback rate = measured t/frame from real capture (0.2417)
    if(animT>tmax) animT = preset.loop? 0 : (f('loop',1)? 0 : tmax);
  }
  requestAnimationFrame(frame);
}
init();
