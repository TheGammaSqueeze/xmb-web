<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}#mp{display:block}</style></head>
<body><canvas id="mp" width="1280" height="720"></canvas>
<script src="globe_mp.js"></script>
<script>
const cv=document.getElementById('mp');
if(new URLSearchParams(location.search).get('coh'))MPGlobe.coherent=true;
if(new URLSearchParams(location.search).get('atmo'))MPGlobe.atmo=true;
MPGlobe.start(cv);
function loop(){ MPGlobe.tick(); requestAnimationFrame(loop); } loop();
setTimeout(()=>{window.__err=MPGlobe.error||'OK'; window.__ready=MPGlobe.ready();},2500);
</script></body></html>
