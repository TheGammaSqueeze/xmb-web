<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PlayStation 3</title>
<style>
@font-face{font-family:'PS3';src:url('ps3-rodin-regular.ttf') format('truetype');font-weight:normal}
@font-face{font-family:'PS3';src:url('ps3-rodin-bold.ttf') format('truetype');font-weight:bold}
@font-face{font-family:'PS3';src:url('ps3-rodin-light.ttf') format('truetype');font-weight:300}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'PS3',sans-serif;color:#fff;user-select:none}
#wrap{display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#000}
#scr{position:relative;overflow:hidden;background:#000;flex-shrink:0}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
/* Integer-scaled resolution simulation: nearest-neighbour so each native pixel
   maps to a clean NxN block (no blurry fractional browser resample). */
#scr.pixelated canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#bg{z-index:0}
#wave{z-index:1}
#xmb{z-index:2}
</style>
</head>
<body>
<div id="wrap"><div id="scr">
<canvas id="bg"></canvas>
<canvas id="wave"></canvas>
<canvas id="xmb"></canvas>
</div></div>
<!-- Force the browser to load the PS3 Rodin fonts before canvas renders text -->
<div style="position:absolute;left:-9999px;top:-9999px;visibility:hidden;">
  <span style="font-family:'PS3';font-weight:normal">PS3RodinPreload</span>
  <span style="font-family:'PS3';font-weight:bold">PS3RodinPreload</span>
  <span style="font-family:'PS3';font-weight:300">PS3RodinPreload</span>
</div>

<script src="particle_cloud.js"></script>
<script>
"use strict";

// ============================================================================
// xmb-web -- a browser recreation of the PlayStation 3 XMB. See README.md for
// the user-facing guide. This header is the developer map of THIS file.
//
// WHAT THIS FILE IS
//   The entire application: markup + CSS (above) and all logic + GLSL shaders
//   (below). No build step, no dependencies. Assets load from the folders next
//   to it (icons/, normalmaps/, boot/, backgrounds/, month_bg_*.png, fonts...).
//
// PROVENANCE
//   Visuals are reconstructed from decrypted PS3 firmware and an instrumented
//   RPCS3 build, NOT eyeballed from video. Constants tagged with a `vaddr 0x..`
//   are ported from the firmware PRX at that address; constants tagged
//   "measured" are read off a 1080p RPCS3 capture (the firmware uses dynamic PAF
//   widget transforms, so absolute pixel coords are not literals in the binary).
//
// THE THREE RENDER LAYERS (stacked canvases inside the centred #scr box)
//   #bg   (z0, WebGL) -- per-month "Original" gradient + HDR tonemap.
//   #wave (z1, WebGL) -- the wave: firmware-captured clip-space cloth geometry
//                        (wave_geo.bin / wave_seq*.bin) + ported lines.qrc silk
//                        shaders, run through an HDR scene-FBO glare/bloom chain.
//   #xmb  (z2, 2D)    -- category bar, item lists, clock, dialogs, side panels,
//                        landing cards.
//   bootCanvas (z3, 2D) -- cold-boot logo/footer + epilepsy warning (intro only).
//
// THE FRAME LOOP  (frame() near the very bottom)
//   1. drawBootIntro() -- firmware cold-boot sequence; gates the XMB UI in/out,
//      then becomes a no-op once boot is done.
//   2. drawBG()        -- gradient + wave WebGL pipeline, driven by time-of-day,
//      calendar month, and a spring-physics impulse that reacts to navigation.
//   3. drawXMB()       -- the 2D UI for the current state (menu / dialog / card).
//
// THE COORDINATE / RESPONSIVE MODEL  (the key to reading the draw code)
//   All UI is authored in a fixed VIRTUAL space V.W=1920 x V.H=1080. resize()
//   maps it to the real device and publishes a few globals that the draw code
//   reads so individual draws never touch device specifics:
//     scale            virtual -> CSS px (uniform, never anamorphic).
//     dpr              canvas backing multiplier (devicePixelRatio or ?dpr).
//     LAYOUT_FIT       frame width / V.W; XCF(x) maps right-anchored/centred x.
//     LAYOUT_XC        horizontal POSITION compression for left-anchored content;
//                      XCP(x)/XCL(centre,halfW) apply it (SIZES never compress).
//     LAYOUT_XSHIFT    extra left shift on sub-4:3 frames (folded into XCP/XCL).
//     LAYOUT_VFIT/VOFF vertical analogues for portrait; frameTopV()/frameHV()
//                      give the full visible-frame bounds; frameCenterTY()
//                      centres the 1080 design in the frame (dialogs/cards).
//     DESC_BOOST       subtitle font multiplier on small frames.
//   In plain 16:9 every factor is the identity, so the model is a no-op and the
//   reference layout is exact. Each screen scenario in the README (4:3 / 21:9 /
//   portrait / low-res / ?res integer scaling / true-1x) is just a different set
//   of these values computed in resize() -- resize() is the single source of
//   truth for sizing and is re-run on every window resize.
//
// FILE MAP (jump to the `====` banners):
//   layout/anim constants . theme+per-month gradient . dialog/landing templates
//   . cinfo hover backgrounds . menu DATA . STATE . icon cache . month gradient
//   texture . easing . CANVAS SETUP (resize) . anim helpers . WebGL wave +
//   shaders . spline pipeline . captured-geometry wave . icon-glass GL .
//   XMB RENDERING (drawXMB) . dialog/side-panel/landing . NAVIGATION .
//   INPUT HANDLING . COLDBOOT INTRO . frame() loop.
// ============================================================================

// =====================================================
// PS3 XMB LAYOUT / ANIMATION CONSTANTS
// Values labelled with a vaddr are firmware-verified from
// explore_plugin.prx / xmb_plugin.prx (see /work/ps3/xmb-ref/explore_plugin_full_decomp.md).
// Values labelled "measured" come from 1080p RPCS3 captures; the binary uses
// dynamic PAF widget transforms so absolute pixel coords are not in the PRX.
// =====================================================
const V = {
  // ---- Screen ----
  W: 1920,                      // NATIVE_W (firmware: explore vaddr 0x270A38 = 1920.0)
  H: 1080,                      // NATIVE_H (firmware: explore vaddr 0x270A3C = 1080.0)

  // ---- Category bar (positions measured from RPCS3 1080p capture) ----
  CAT_Y: 289,                   // measured from RPCS3 1080p capture (not in binary) - INACTIVE icon center y
  CAT_Y_ACTIVE_OFFSET: -10,     // measured from RPCS3 1080p capture: active icon center is ~10px ABOVE inactive icons
                                // (REF: active cy ~ 279, inactive cy ~ 288). This lifts the active icon to create
                                // the proper gap between icon bottom and label top, matching real XMB.
  CAT_X: 566,                   // measured from RPCS3 1080p capture (not in binary)
  CAT_SPACING: 203,             // measured from RPCS3 1080p capture; xmb_plugin 0x17FBC has 200.0 as CAT_BAR_DURATION (different role)
  CAT_ICON_ACTIVE: 168,         // measured from RPCS3 1080p capture (not in binary)
  CAT_ICON_INACTIVE: 117,       // measured from RPCS3 1080p capture (not in binary)
  CAT_LABEL_Y: 342,             // measured from RPCS3 1080p capture (not in binary)
  CAT_LABEL_SIZE: 20,           // firmware: many 20.0f loads (explore vaddr 0x2706A4, 0x2706B4, 0x2706E0)
  CAT_INACTIVE_ALPHA: 0.9,      // firmware: xmb_plugin vaddr 0x17FB0 = 0.9 (bar normal alpha)
  CAT_FAR_ALPHA: 0.25,          // firmware: explore vaddr 0x270A6C = 0.25 (quarter alpha tier)

  // ---- Item list (positions measured from RPCS3 1080p capture) ----
  ITEM_FOCUS_Y: 515,            // measured from RPCS3 1080p capture (not in binary)
  ITEM_SPACING: 80,             // firmware: explore vaddr 0x271828 = 80.0 (also ITEM_VALUE_RIGHT_PAD)
  ITEM_ACTIVE_PAD: 87,          // measured from RPCS3 1080p capture (not in binary)
  ITEM_ICON_X: 566,             // measured from RPCS3 1080p capture (not in binary)
  ITEM_ICON_SIZE: 78,           // firmware: explore vaddr 0x2715C8, 0x271D34, 0x271E24 = 78.0 (PARENT_ICON_SIZE)
  ITEM_ICON_ACTIVE: 180,        // measured from RPCS3 1080p capture (not in binary)
  ITEM_TEXT_X: 683,             // measured from RPCS3 1080p capture (not in binary)
  ITEM_TEXT_SIZE: 30,           // firmware: explore vaddr 0x270898, 0x271488, 0x271398 = 30.0 (inactive font px)
  ITEM_TEXT_ACTIVE_SIZE: 34,    // firmware: explore vaddr 0x271120, 0x2713A0, 0x271AA0, 0x271BA8, 0x271BFC = 34.0 (active font px)
  ITEM_DESC_OFFSET: 28,         // measured from RPCS3 1080p capture (not in binary)
  ITEM_DESC_SIZE: 18,           // firmware: explore vaddr 0x271C80 = 18.0
  ITEM_VALUE_RIGHT_PAD: 80,     // firmware: explore vaddr 0x271828 = 80.0

  // ---- Item scale tiers (firmware-verified) ----
  ITEM_ACTIVE_SCALE: 1.3,       // firmware: explore vaddr 0x270A54, 0x270A78 = 1.3 (focused scale)
  ITEM_INACTIVE_SCALE: 0.833,   // firmware: explore vaddr 0x270A60 = 0.8333 (= 1/1.2 unfocused)
  ITEM_TWEEN_SCALE_UP: 1.06,    // firmware: explore vaddr 0x270944 = 1.06 (tween up)
  ITEM_TWEEN_SCALE_DOWN: 0.76,  // firmware: explore vaddr 0x270948 = 0.76 (tween down)

  // ---- Alpha tiers (firmware-verified) ----
  ALPHA_FOCUS: 1.0,             // firmware: explore vaddr 0x270928, 0x270C68 = 1.0
  ALPHA_INACTIVE: 0.48,         // firmware: explore vaddr 0x27160C = 0.48
  ALPHA_NEAR: 0.8,              // firmware: explore vaddr 0x270A94, 0x270B64 = 0.8 (+/-1 neighbor)
  ALPHA_MID: 0.5,               // firmware: explore vaddr 0x270C54, 0x270930 = 0.5 (+/-2 neighbor)
  ALPHA_FAR: 0.3,               // firmware: 0.3 is the far tier (XMB visibility tier 4) per decomp section H.4
  // Legacy distance-based alpha (kept for backwards compatibility with existing call sites)
  ALPHA_ADJ1: 0.55, ALPHA_ADJ2: 0.55, ALPHA_ADJ3: 0.55, ALPHA_ADJ4: 0.55,

  // ---- Category in submenu (firmware-verified) ----
  CAT_SUBMENU_SHIFT: -220,      // firmware: explore vaddr 0x2709B4, 0x270BA8 = -220.0 (submenu column x)
  CAT_SUBMENU_SHIFT_ALT: -215,  // firmware: explore vaddr 0x2709C8 = -215.0 (alt state)
  CAT_SUBMENU_ALPHA: 0.6,       // firmware: explore vaddr 0x271B64, 0x271C54, 0x270A54 family = 0.6
  CAT_SUBMENU_SCALE: 0.833,     // firmware: explore vaddr 0x270A60 = 0.8333
  CAT_SUBMENU_SHIFT_X: 257,     // measured sub_system_real_top.png: active cat icon settles at x~309 (CAT_X 566 - 257). The old 380 (xmb_plugin Bar::onScrollIn) put it too far left and too high.
  CAT_SUBMENU_Y_SHIFT: -10,     // measured sub_system_real_top.png: cat icon stays at row y~279 (CAT_Y 289 - 10), NOT pushed to the top. The old -220 reused an x-offset constant as a y-shift.
  CAT_SUBMENU_BAR_TARGET_Y: 500, // firmware: xmb_plugin vaddr 0x17F70 = 500.0 (Bar::onScrollIn secondary)
  CAT_SUBMENU_BAR_ALT_Y: 240,   // firmware: xmb_plugin vaddr 0x17F74 = 240.0 (Bar::onScrollIn alt)
  BAR_RESTORE_X: 840,           // firmware: xmb_plugin vaddr 0x17FE8 = 840.0 (Bar::onScrollOut)
  BAR_RESTORE_Y: -475,          // firmware: xmb_plugin vaddr 0x17FEC = -475.0 (Bar::onScrollOut)

  // ---- Submenu parent column (positions measured) ----
  PARENT_COL_X: 316,            // measured from RPCS3 1080p capture (not in binary)
  PARENT_COL_OFFSET: -180,      // firmware: explore vaddr 0x2709D0 = -180.0 (parent column x relative)
  PARENT_ICON_SIZE: 78,         // firmware: explore vaddr 0x2715C8, 0x271D34, 0x271E24 = 78.0
  PARENT_SPACING: 80,           // firmware: explore vaddr 0x271828 = 80.0
  SUBMENU_ICON_X_SHIFT: 290,    // measured from RPCS3 1080p capture (not in binary)
  SUBMENU_TEXT_X_SHIFT: 290,    // measured from RPCS3 1080p capture (not in binary)

  // ---- Clock (measured from RPCS3 1080p captures, e.g. cat_02_settings.png) ----
  // Frame is a U-shape opening to the right (extends past right edge of screen).
  // Top line at y=75, bottom line at y=132, left line at x=1329. Corner radius ~6.
  // Frame border line brightness ~90/255 with ~6px soft glow extending inward.
  CLOCK_X: 1716, CLOCK_Y: 103, CLOCK_SIZE: 26,  // measured from RPCS3 1080p capture (digit height ~22px)
  CLOCK_FRAME_X: 1329, CLOCK_FRAME_Y: 75, CLOCK_FRAME_W: 590, CLOCK_FRAME_H: 57,  // measured
  CLOCK_FRAME_CORNER: 6,        // measured corner radius
  CLOCK_FRAME_GLOW: 6,          // inner glow extends ~6px from border
  CLOCK_ICON_R: 16,             // measured from RPCS3 1080p (outer radius 16, 32x32 bbox)
  CLOCK_ICON_CX: 1789.5,        // measured icon center x
  CLOCK_RIGHT_PAD: 114,         // measured: right edge of screen (1919.5) - icon center = 130; icon-r to frame_right gap

  // ---- Animation durations (firmware-verified, decomp section H.1) ----
  // Per explore_plugin_full_decomp.md section H.1 "Summary of confirmed values".
  // The firmware is the source of truth (per project rule). Earlier RPCS3
  // burst-capture values (~90-100ms) were attempts to read motion from
  // sub-frame captures, but the binary itself names these durations
  // unambiguously in section H.1 and the recurring 200/250ms duration
  // table (section B.2). Reverted to firmware values.
  CAT_ANIM_MS: 250,             // firmware: explore vaddr 0x270854, 0x271444 = 250.0 (decomp H.1)
  ITEM_ANIM_MS: 200,            // firmware: explore vaddr 0x270B40, 0x270900 = 200.0 (decomp H.1)
  SUBMENU_ANIM_MS: 250,         // firmware: explore vaddr 0x270A64, 0x271444, 0x2708F0 = 0.25 (decomp H.1, B.3)
  LONG_PRESS_MS: 1000,          // firmware: explore vaddr 0x2707EC, 0x270700 = 1000.0

  // ---- Input timings (firmware-verified, explore vaddr 0x2706C8-0x2706F0) ----
  INPUT_INITIAL_DELAY_MS: 300,  // firmware: explore vaddr 0x2706E0 = 300.0 (initial key-repeat delay)
  INPUT_REPEAT_MS: 200,         // firmware: explore vaddr 0x2706F0 = 200.0 (base repeat interval)
  INPUT_FAST_REPEAT_MS: 68,     // firmware: explore vaddr 0x2706D4 = 0.068 (after acceleration)
  INPUT_MIN_REPEAT_MS: 50,      // firmware: explore vaddr 0x2706E4 = 0.050 (minimum after long hold)
  INPUT_ACCEL_MULT: 1.4,        // firmware: explore vaddr 0x2706EC = 1.4 (acceleration multiplier)

  // ---- Easing curves ----
  // FIRMWARE values (subtle smoothstep variant): used by the rare set of
  // "settled" anims that need a slight in/out bias.
  EASE_IN_WEIGHT: 0.5,          // firmware: explore vaddr 0x2707BC, 0x2707D0 = 0.5 (Hermite tangent in)
  EASE_OUT_WEIGHT: 0.4,         // firmware: explore vaddr 0x2707C0, 0x2707D4 = 0.4 (Hermite tangent out)
  EASE_3STEP: [0.28, 0.5, 0.78],            // firmware: explore vaddr 0x270DC4-0x270DCC (three-step Hermite)
  EASE_CURVE: [0.2, 0.28, 0.5, 0.78, 1.0],  // firmware: explore vaddr 0x271044-0x271054 (5-step gradient stops)
  // easeOutBack overshoot coefficient. c1=1.70158 yields the canonical 10%
  // overshoot, matching firmware xmb_plugin vaddr 0x17F58 = 1.1 (overshoot
  // factor). The explore plugin's ITEM_TWEEN_SCALE_UP=1.06 (vaddr 0x270944)
  // and ITEM_TWEEN_SCALE_DOWN=0.76 (vaddr 0x270948) corroborate the
  // overshoot/undershoot pattern for item-focus tweens. Used by navCat
  // and navItem so each press visibly springs and snaps into place
  // instead of glide-stopping like a smoothstep.
  EASE_BACK_C1: 1.70158,

  // ---- Pulse (active item breathing glow) ----
  // The PS3 PAF widget system animates fo_lbl_alpha (explore vaddr 0x248700)
  // for the focused item - a slow alpha oscillation that gives the active
  // text a subtle "breathing" quality. The firmware does not embed an
  // explicit period constant in either PRX (the actual sin/cos tables live
  // in qgl_gaia_app.prx where PI = 3.14159 at file 0x9EA30). Period and
  // amplitude here are tuned to the visual evidence: a 1500 ms cycle and
  // 25% amplitude around the base 0.55 glow alpha reads as breathing
  // without becoming distracting at idle. Pulse is suspended during item
  // motion (only the SETTLED active item pulses - matches PS3 behaviour
  // where the focus highlight is the final state's emphasis).
  PULSE_PERIOD_MS: 1500,
  PULSE_ALPHA_MIN: 0.42,        // outer halo low (around 0.55 base, -0.13)
  PULSE_ALPHA_MAX: 0.68,        // outer halo high (around 0.55 base, +0.13)
  PULSE_INNER_MIN: 0.38,        // inner halo low
  PULSE_INNER_MAX: 0.62,        // inner halo high

  // ---- Colors (firmware-verified) ----
  XMB_BLUE: [20, 60, 176],              // firmware: explore vaddr 0x271630 = (0.0784, 0.2353, 0.6875)
  GRADIENT_DARK: [51, 71, 128],         // firmware: explore vaddr 0x271044 = (0.20, 0.28, 0.50)
  GRADIENT_MEDIUM: [71, 128, 199],      // firmware: explore vaddr 0x271048 = (0.28, 0.50, 0.78)

  // ---- Thumbnail dimensions (firmware-verified, all 16:9 family) ----
  THUMB_W_SMALL: 108,           // firmware: explore vaddr 0x270F20 = 108.0
  THUMB_H_SMALL: 61,            // firmware: explore vaddr 0x270F24 = 61.0
  THUMB_W_DEFAULT: 312,         // firmware: explore vaddr 0x270F28 = 312.0
  THUMB_H_DEFAULT: 176,         // firmware: explore vaddr 0x270F2C = 176.0
  THUMB_W_MED: 188,             // firmware: explore vaddr 0x270F9C, 0x271358, 0x271B08 = 188.0
  THUMB_H_MED: 106,             // firmware: explore vaddr 0x270FA0, 0x27135C, 0x271B0C = 106.0
  THUMB_W_LARGE: 376,           // firmware: explore vaddr 0x271A88, 0x271AD4 = 376.0
  THUMB_H_LARGE: 211,           // firmware: explore vaddr 0x271A8C, 0x271AD8 = 211.0
  THUMB_W_HUGE: 432,            // firmware: explore vaddr 0x271AE8 = 432.0
  THUMB_H_HUGE: 240,            // firmware: explore vaddr 0x271AEC = 240.0
  ASPECT_16_9: 1.7778,          // firmware: explore vaddr 0x270F30 = 1.7778

  // ---- Wave (not in explore_plugin.prx; in custom_render_plugin.sprx) ----
  WAVE_RIBBONS: 5,              // measured / chosen (wave shader is separate plugin)
  WAVE_BASE_Y: 0.46,            // measured / chosen
  WAVE_COLOR: [140, 50, 160],   // measured / chosen

  // ---- Active-item text glow halo (measured from RPCS3 capture) ----
  // Source: /work/ps3/xmb_dump/menu_traversal/sub_datetime_d03.png, vertical+
  // horizontal brightness profiles around active item text strokes show a
  // gaussian-shaped halo with sigma~4.5 pixels (canvas shadowBlur ~= 2*sigma).
  // Falloff samples taken at x=1252..1267 (text edge): 89,53,41,33,25,19,14,
  // 10,7,5,3,2,1,1,0 -- best gaussian fit sigma=4.55, amp~54 (~21% relative).
  // Inactive items in the same image have NO halo (peak lum 114, drop to 0
  // in 2 pixels). The libfontFT.prx and explore_plugin.prx do not expose a
  // named glow constant; the visual is best matched as a canvas shadowBlur.
  // No fo_glow_* PAF property exists -- only fo_lbl_alpha/fo_lbl2_alpha
  // (explore vaddr 0x248700/0x248718) control focused label opacity.
  // Empirically tuned in web app to match the PS3 falloff shape: a wider
  // outer blur (sigma fits at radius=15) plus a tighter inner halo. Alpha
  // values calibrated against the measured PS3 falloff:
  //   PS3 ref:  d=2:53, d=4:33, d=6:19, d=8:10, d=10:5, d=12:2, d=14:1
  // (sampled at /work/ps3/xmb_dump/menu_traversal/sub_datetime_d03.png y=502)
  TEXT_GLOW_RADIUS: 15,         // measured: outer halo extent ~14px from edge
  TEXT_GLOW_COLOR: 'rgba(255,255,255,0.55)',  // tuned: web at this alpha matches d=4:33 PS3 falloff
  TEXT_GLOW_INNER_RADIUS: 5,    // tighter inner halo for the steep near-text falloff (peak 89 at d=1)
  TEXT_GLOW_INNER_COLOR: 'rgba(255,255,255,0.5)',

  // ---- Interframe blending (XMB foreground layer) ----
  //
  // Firmware (PS3 XMB renders at 30 fps) uses a previous-framebuffer
  // texture blended at const alpha 0.2 onto the current frame each tick
  // (evidence: /work/ps3/xmb_dump/frames/frame_115707.log binds the
  // 1920x1080 RGBA texture at offset 0x0dc80000 from frame N-1 inside
  // FRAME_BEGIN N, with const[1]={0.2,0,0,0}; qgl_gaia_app.prx exports
  // EarthPreviousTex / StarsPreviousTex / DstPrev / BlurAcc.fpo).
  //
  // A literal 0.2 transcribed into the web app produces a heavier smear
  // than firmware, because:
  //  (a) the web app runs at the browser's rAF rate (60 fps), so prev
  //      frames are HALF the wall-clock age the firmware sees. Two
  //      web frames span the same 33 ms one PS3 frame covers.
  //  (b) Canvas2D's "destination-over" alpha composite of the prior
  //      framebuffer over the cleared canvas multiplies the prior
  //      content by the constant alpha straight onto the new fragment
  //      after the new draw; the PS3's RSX shader-based composite of
  //      the prev framebuffer happens BEFORE the new geometry, so the
  //      new geometry's own alpha can re-suppress the residual where
  //      the new content draws partially. The net effect: at the same
  //      blend constant, the web app reads as more smeared.
  //  (c) the cat/item nav itself already crossfades the old/new active
  //      items via per-item alpha (the firmware does this too), so the
  //      accumulator layers a second fade on top of an already-fading
  //      pair, producing a "double fade" if the constant is too strong.
  //
  // The tuned web-side value below was chosen by visual comparison
  // against /work/ps3/xmb-ref/overview_0019.jpg / 0020.jpg (real PS3
  // mid-cat-trans). Side-by-side at 0.00 / 0.08 / 0.12 / 0.18 / 0.25
  // in /tmp/tune_compare.png: 0.12 best matches the firmware's ghost
  // intensity without the heavier "rubber band" effect 0.18+ produces.
  // (0.08 was nearly imperceptible at 60 fps; 0.20 firmware-literal
  // produced visible double-fade text overlap.)
  //
  // See /work/ps3/xmb-ref/interframe_blending_research.md and
  // /work/ps3/xmb-ref/interframe_blending_notes.md for full evidence.
  BLEND_PREV_ALPHA: 0.12,
};

// =====================================================
// THEME / COLOR / BACKGROUND SYSTEM
// =====================================================
// PS3 firmware Theme Settings has three sub-items per
// /work/ps3/app/dev_flash/vsh/resource/sysconf_plugin.rco inflated strings:
//   page_theme_config_theme       -- Theme (Original / Classic)
//   page_theme_config_color       -- Color (palette swatches)
//   page_theme_config_background  -- Background (Original / Theme / Classic)
//
// Theme strings (verified):
//   msg_theme_default = "Original"
//   msg_theme_classic = "Classic"
//
// Color/Background sub-options are not stored as text in firmware (they are
// rendered as image swatches in the real PS3 UI). The set below derives from
// the well-documented PS3 firmware color palette (Original auto-rotates by
// month; the other 14 are fixed tint LUTs that modulate the wave c[23] uniform).
// The 'Original' tint matches frame_123875 capture (May, 14:56 daytime):
//   c[23] = (0.651, 0.759, 1.000) -- pale cyan-blue (per /work/ps3/xmb-ref/wave_constants.json)

const THEME_OPTIONS = [
  {key:'original', name:'Original'},   // msg_theme_default
  {key:'classic',  name:'Classic'}     // msg_theme_classic
];

// Wave c[23] tint per Color option. The PS3 wave shader multiplies the
// ribbon base color by this tint then biases toward white in the compositor.
// Values are RGB in [0,1] with .w=1 for the c[23] vec4.
//
// "Original" is the verified firmware default (capture frame_123875 May daytime).
// The remaining tints follow the classic PS3 month-color palette documented
// in the PS3 firmware reverse-engineering community: each color is roughly
// a pastel tint pulling toward cyan/lavender for cool, amber/rose for warm.

// =====================================================
// PER-MONTH "ORIGINAL" GRADIENT (EMPIRICAL GROUND TRUTH)
// =====================================================
// The real PS3 "Original" theme sweeps the background HUE by calendar month
// (NOT a fixed plum). These values are the EMPIRICAL RENDERED per-month colors
// measured from RPCS3 (lower-left sampling region) and tabulated in
// /work/ps3/xmb-ref/boot/per_month_gradient.md. The raw month_bg_*.png textures
// have DIFFERENT hues -- the back_colours shader processes them -- so we drive
// the gradient directly from these measured hues to match the captures.
//
// Each entry: { h: hue deg, s: sat 0..1, v: day value 0..1, nv: night value 0..1 }
// Day vs night changes BRIGHTNESS (value) only; hue/sat preserved. Night value
// for months without a direct night capture is interpolated from the measured
// day->night value ratio (~0.33 mean of Jan/Jun/Sep/Dec) applied to the day V.
// Months 1..12 (index = month-1).
// EMPIRICAL ground truth from the per-month/date sweep (boot/permonth_date.md).
// Each entry is the d01 ANCHOR (pure month M), measured in the colored band
// (L_mid,R_mid,L_lower,R_lower,L_bottom,R_bottom). The firmware crossfades month
// M -> M+1 across the calendar date (monthTime = day/daysInMonth); the date
// crossfade is done by RGB-lerping adjacent anchors (see monthBaseColor below).
// nv = night value (day->night collapses VALUE only; hue/sat preserved).
// R/G-CORRECTED anchors. The RPCS3 SCREENSHOT capture path stores the buffer
// as [A,G,R,B], so the per-month sweep had to be re-decoded [2,1,3] (R<->G swap).
// Cross-checked against DECODE-INDEPENDENT video ground truth:
//   real.mp4 (boot->XMB, Original theme) steady gradient = VIOLET hue ~287
//     -> matches corrected Jun/Jul (~285), NOT the old [1,2,3] blue/cyan (~195).
//   sat_blue_capture/xmb_home.png (16 Sep, [2,1,3]) home = GREEN hue ~108
//     -> matches corrected Sep (~107), NOT the old [1,2,3] salmon (~13).
// Both independent sources confirm the global R/G swap. See
// per_month_gradient.md + frames_rgfix/ for the full corrected sweep.
// DEFINITIVE per-month anchors from DECODE-CLEAN video captures /work/realxmb
// (xmb-ref/realxmb_ground_truth.md). Each video = XMB Date&Time menu on the 28th,
// clock sweeping 00:00->24:00. These OVERTURN every prior RPCS3-screenshot table
// (which had R/G channel-swap errors: Sep was wrongly green, May wrongly teal,
// Jun wrongly blue). h,s = stable daytime hue/sat of the colored band; v = noon
// on-screen value target (colored bottom band); nv = night value (hue preserved,
// value collapses). NO .grb swizzle, NO cross-month desaturation crossfade
// (disproven: May28 is purple while Jun28 is teal -- no day-28 blend toward next).
const MONTH_GRADIENT = [
  { h:  58.6, s: 0.630, v: 0.785, nv: 0.176 }, // Jan  gold
  { h:  88.9, s: 0.650, v: 0.593, nv: 0.154 }, // Feb  yellow-green
  { h: 339.8, s: 0.562, v: 0.708, nv: 0.167 }, // Mar  mauve / pink-magenta
  { h: 118.1, s: 0.713, v: 0.277, nv: 0.031 }, // Apr  green (darker)
  { h: 270.7, s: 0.475, v: 0.440, nv: 0.188 }, // May  PURPLE
  { h: 166.5, s: 0.723, v: 0.632, nv: 0.031 }, // Jun  teal / cyan
  { h: 196.0, s: 0.620, v: 0.585, nv: 0.122 }, // Jul  cyan top (bottom -> MONTH_GRADIENT_BOT)
  { h: 288.0, s: 0.600, v: 0.672, nv: 0.104 }, // Aug  violet / magenta
  { h:  47.6, s: 0.705, v: 0.816, nv: 0.176 }, // Sep  GOLD / amber
  { h:  33.2, s: 0.590, v: 0.314, nv: 0.074 }, // Oct  orange / brown (darker)
  { h:   0.9, s: 0.668, v: 0.621, nv: 0.009 }, // Nov  red
  { h:   0.0, s: 0.000, v: 0.808, nv: 0.158 }  // Dec  achromatic white / silver
];

// HSV (h in deg, s/v in 0..1) -> linear-ish RGB 0..1.
function hsvToRgb(h, s, v) {
  h = ((h % 360) + 360) % 360;
  var c = v * s;
  var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  var m = v - c;
  var r = 0, g = 0, b = 0;
  if (h < 60)      { r = c; g = x; b = 0; }
  else if (h <120) { r = x; g = c; b = 0; }
  else if (h <180) { r = 0; g = c; b = x; }
  else if (h <240) { r = 0; g = x; b = c; }
  else if (h <300) { r = x; g = 0; b = c; }
  else             { r = c; g = 0; b = x; }
  return [r + m, g + m, b + m];
}

// Returns the per-month "Original" base RGB for the given month (0..11) and a
// night blend factor (0 = full day, 1 = full night). Hue/sat are constant;
// value blends day->night. This feeds uMonthBaseColor; the shader then applies
// the vertical vignette/structure on top. The value is normalized so the
// shader's downstream tonemap lands near the empirical measured V.
// monthTime in [0,1] = day-of-month / daysInMonth. The firmware crossfades
// month M -> month M+1 across the date. We reproduce it by RGB-lerping the two
// adjacent month anchors (this matches the measured d01/d15/d28 hue+value to
// within a few degrees; HSV hue-lerp does NOT match). A mild mid-fade
// desaturation pull replicates the small saturation dip the real crossfade of
// two opposite-hue colors produces at d15 (peak ~18% at monthTime 0.5).
// Sparse per-month BOTTOM-of-screen anchor overrides. Most months have a
// vertically-constant hue so the bottom equals the top anchor (MONTH_GRADIENT).
// July is a genuine vertical gradient in the /work/realxmb video (cyan top H~194
// -> blue bottom H~225, and the bottom is notably DARKER), which a single anchor
// cannot represent. Keyed by month index (0=Jan). Fields mirror MONTH_GRADIENT.
const MONTH_GRADIENT_BOT = {
  6: { h: 242.0, s: 0.900, v: 0.230, nv: 0.180 }  // Jul  deep blue bottom edge
};
// Pre-compensation so the on-screen V (after the shader vertical envelope and the
// downstream composite tonemap) lands on the video-measured target. Tuned via the
// /work/realxmb validation harness; keep as a single global so it is easy to fit.
var MONTH_VALUE_PRECOMP = 1.30;
function monthBaseColor(month, nightBlend, monthTime) {
  // Cross-month continuity: each month is its OWN color (the /work/realxmb videos
  // show no day-28 blend toward the next month). We blend adjacent anchors ONLY in
  // a short window around the month boundary so transitions are not a hard step.
  // monthTime in [0,1] = (day-1)/(daysInMonth-1); ~0.93 on the 28th (the video
  // date), where the result must equal this month's anchor -> blend stays inside
  // the last/first few days only.
  var m0 = ((month % 12) + 12) % 12;
  var e = MONTH_GRADIENT[m0];
  // TIME-INDEPENDENT base colour: the bottom-of-screen colour is the SAME at all
  // times of day. The whole day/night look is now the vertical black->colour
  // ramp in the shader (black extends further down toward night); the base
  // colour value itself does NOT change with the clock.
  return hsvToRgb(e.h, e.s, e.v * MONTH_VALUE_PRECOMP);
}
// Bottom-of-screen anchor color. Falls back to the top anchor when the month has
// no vertical-gradient override (so all months except July are unchanged).
function monthBaseColorBot(month, nightBlend) {
  var m0 = ((month % 12) + 12) % 12;
  var e = MONTH_GRADIENT_BOT[m0] || MONTH_GRADIENT[m0];
  return hsvToRgb(e.h, e.s, e.v * MONTH_VALUE_PRECOMP);
}

// Persisted state. Reads from localStorage; falls back to defaults.
function _loadThemeState(key, defaultIdx, options) {
  try {
    const v = localStorage.getItem('ps3-xmb-' + key);
    if (v === null) return defaultIdx;
    const idx = parseInt(v, 10);
    if (Number.isFinite(idx) && idx >= 0 && idx < options.length) return idx;
  } catch (e) { /* localStorage unavailable */ }
  return defaultIdx;
}
function _saveThemeState(key, idx) {
  try { localStorage.setItem('ps3-xmb-' + key, String(idx)); } catch (e) { /* ignore */ }
}

let themeIdx = _loadThemeState('theme',  0, THEME_OPTIONS);       // 0 = Original
let colorIdx = _loadThemeState('color',  0, COLOR_OPTIONS);       // 0 = Original
let bgIdx    = _loadThemeState('bg',     0, BACKGROUND_OPTIONS);  // 0 = Original
let fontIdx  = _loadThemeState('font',   0, FONT_OPTIONS);        // 0 = Original
let daynightIdx = _loadThemeState('daynight', 0, DAYNIGHT_OPTIONS); // 0 = Auto

// Smoothly-animated theme state, so colour and day/night changes CROSS-FADE
// instead of snapping (like the boot fading into the settled colour). The
// displayed values lerp toward the selected targets each frame.
let dispTint = COLOR_OPTIONS[colorIdx].tint.slice();   // animated gradient/wave hue
let dispHSV  = (COLOR_OPTIONS[colorIdx].key !== 'original') ? 1.0 : 0.0; // animated rotation strength
let dispBlend = 0.0;                                   // animated day/night blend
let _themeFadeInit = false;
// Advance the theme cross-fade. dt in ms; tau sets the fade speed (~feels like
// the boot colour settle). blendTarget is the day/night target for this frame.
function stepThemeFade(dt, blendTarget) {
  const k = 1.0 - Math.exp(-(dt > 0 ? dt : 16.7) / 220.0);   // ~0.4s fade
  const tt = COLOR_OPTIONS[colorIdx].tint;
  if (!_themeFadeInit) {            // first frame: snap (no fade from black)
    dispTint = tt.slice();
    dispHSV = (COLOR_OPTIONS[colorIdx].key !== 'original') ? 1.0 : 0.0;
    dispBlend = blendTarget; _themeFadeInit = true;
  } else {
    dispTint[0] += (tt[0] - dispTint[0]) * k;
    dispTint[1] += (tt[1] - dispTint[1]) * k;
    dispTint[2] += (tt[2] - dispTint[2]) * k;
    const hsvTarget = (COLOR_OPTIONS[colorIdx].key !== 'original') ? 1.0 : 0.0;
    dispHSV += (hsvTarget - dispHSV) * k;
    dispBlend += (blendTarget - dispBlend) * k;
  }
  updateWaveTintConstants();        // wave + particles follow the animated tint
}

// Returns the ANIMATED c[23] tint vec3 (cross-fades toward the selected Color).
function currentTintRGB() {
  return dispTint;
}

// Resolves an item's right-side value text. For theme-bound items (Theme,
// Color, Background under Theme Settings) the value comes from the live
// theme state so the menu reflects user selection without DATA mutation.
// Falls back to the static `it.v` for other items.
function resolveItemValue(it) {
  if (!it) return null;
  switch (it.n) {
    case 'Theme':      return THEME_OPTIONS[themeIdx].name;
    case 'Colour':     return COLOR_OPTIONS[colorIdx].name;
    case 'Background': return BACKGROUND_OPTIONS[bgIdx].name;
    case 'Font':       return FONT_OPTIONS[fontIdx].name;
    case 'Day/Night':  return DAYNIGHT_OPTIONS[daynightIdx].name;
  }
  return it.v || null;
}

// Applies a chooser dialog selection to theme state. Called from the dialog
// confirm path when the dialog template has a themeKey field. Persists the
// choice to localStorage so subsequent reloads keep the user's settings.
// Apply a theme selection to the LIVE state WITHOUT persisting. Used for
// immediate hover-preview as the user moves through a chooser.
function previewThemeSelection(themeKey, selectedIdx) {
  switch (themeKey) {
    case 'theme': themeIdx = selectedIdx; break;
    case 'color':
      colorIdx = selectedIdx;
      updateWaveTintConstants();   // wave/particles pick up the new tint live
      break;
    case 'bg':   bgIdx = selectedIdx; break;
    case 'font': fontIdx = selectedIdx; break;
    case 'daynight': daynightIdx = selectedIdx; break;
  }
}

// Apply AND persist the selection (on confirm).
function applyThemeSelection(themeKey, selectedIdx) {
  previewThemeSelection(themeKey, selectedIdx);
  switch (themeKey) {
    case 'theme': _saveThemeState('theme', themeIdx); break;
    case 'color': _saveThemeState('color', colorIdx); break;
    case 'bg':    _saveThemeState('bg', bgIdx); break;
    case 'font':  _saveThemeState('font', fontIdx); break;
    case 'daynight': _saveThemeState('daynight', daynightIdx); break;
  }
}

// Rewrites the c[23]/c[40]/c[42]/c[48]/c[61] tint entries in the
// pre-flattened constants buffer to the currently selected Color.
// These indices were identified in /work/ps3/xmb-ref/wave_constants.json as
// the RIBBON_BASE_TINT duplicates (all sharing the same value in captures).
function updateWaveTintConstants() {
  if (typeof WAVE_CONSTANTS_FLAT === 'undefined') return; // not yet declared
  const t = (typeof dispTint !== 'undefined') ? dispTint : COLOR_OPTIONS[colorIdx].tint;
  const tintIndices = [23, 40, 42, 48, 61];
  for (const i of tintIndices) {
    WAVE_CONSTANTS_FLAT[i*4+0] = t[0];
    WAVE_CONSTANTS_FLAT[i*4+1] = t[1];
    WAVE_CONSTANTS_FLAT[i*4+2] = t[2];
    // .w stays 1.0
  }
}

// Cache for raster illustrations loaded from /dialogs/.
const dialogImgCache = {};
function getDialogImage(path) {
  if (!dialogImgCache[path]) {
    const img = new Image();
    dialogImgCache[path] = {img, loaded: false};
    img.onload = function() { dialogImgCache[path].loaded = true; };
    img.src = path;
  }
  return dialogImgCache[path];
}

// =====================================================
// CINFO (HOVER) BACKGROUNDS
// =====================================================
// When the cursor rests on certain items for ~2 seconds, a branded background
// image fades in behind the wave but in front of the gradient. Mapping comes
// from /work/ps3/xmb-ref/hover_background_mapping.json (firmware behavior).
// Keys are item names (matches the `n` field in DATA).
const HOVER_BG = {
  'PlayStation\u00aeStore':       'backgrounds/cinfo-bg-storemain.jpg',
  'Sign Up':                       'backgrounds/cinfo-bg-signup.jpg',
  'Account Management':            'backgrounds/cinfo-bg-signup.jpg',
  'What\'s New':                   'backgrounds/cinfo-bg-whatsnew.jpg',
  'Photo Gallery':                 'backgrounds/cinfo-bg-photogallery.jpg'
};
// Dwell time before the hover bg fades in. The PS3's Info::cbActivate
// callback fires after this focus-stable interval (see
// /work/ps3/xmb-ref/hover_backgrounds.md "Trigger timing" section). The
// explore_plugin.prx binary does NOT contain a 2.0f or 2000.0f constant
// in the rodata section that maps to the Info pane code path - the only
// 2000.0 (at vaddr 0x270B3C) is consumed by IBoardCheckSpawn in
// remotedownload_check.cpp, not the cinfo dwell timer. The decomp note
// recommends "1.5-2 second" trigger window. The firmware does contain
// 1.5f at 5 rodata vaddrs (0x270930, 0x270964, 0x270A2C, 0x270BE4,
// 0x270C68) plus 1.4f at 0x2707DC. We use 1500ms (the documented lower
// bound and the value with multiple firmware constants present) - this
// also matches user experience on real PS3 hardware better than 2000ms.
const HOVER_BG_DWELL_MS = 1500;
// Fade durations: 500ms in (firmware: explore vaddr 0x270880, 0x270C8C
// among 9 rodata instances of 500.0f) and 300ms out (firmware: explore
// vaddr 0x270748 among 21 rodata instances of 300.0f). These are the
// canonical PAF widget fade durations used throughout the XMB.
const HOVER_BG_FADE_IN_MS = 500;
const HOVER_BG_FADE_OUT_MS = 300;
// Maximum visible alpha for the bg image (firmware composites below the wave;
// the wave still shows through, so we cap below 1.0 so the wave reads clearly).
const HOVER_BG_MAX_ALPHA = 0.85;

// Cinfo background image cache keyed by URL. Lazy-loaded on first request.
const cinfoBgCache = {};
function getCinfoBg(url) {
  if (!cinfoBgCache[url]) {
    const img = new Image();
    cinfoBgCache[url] = {img, loaded: false};
    img.onload = function() { cinfoBgCache[url].loaded = true; };
    img.src = url;
  }
  return cinfoBgCache[url];
}

// =====================================================
// DEFAULT ITEM INDEX PER CATEGORY
// =====================================================
// PS3 doesn't always default to index 0 when entering a category. Settings
// defaults to a useful spot (System Settings) rather than the first item.
// Mapping category id -> initial item index. Anything not listed defaults to 0.
const DEFAULT_ITEM_INDEX = {
  'settings': 5  // System Settings (index 5 in the items array)
};
function defaultItemIndexFor(catId) {
  return DEFAULT_ITEM_INDEX[catId] || 0;
}

// =====================================================
// STATE
// =====================================================
let ci = 0, ii = defaultItemIndexFor('user'), stack = [];
// Supported display aspect ratios. The XMB is natively 16:9; the others are
// derived from the same firmware 4:3 re-layout model (LAYOUT_FIT / LAYOUT_XC in
// resize): the content fills the frame at full element size with positions
// compressed (narrow) or expanded (wide). Order = TAB cycle order.
const ASPECTS = { '1:1': 1/1, '4:3': 4/3, '3:2': 3/2, '16:9': 16/9, '21:9': 21/9 };
const ASPECT_ORDER = ['16:9', '4:3', '3:2', '1:1', '21:9'];
// Initial aspect: ?aspect=4:3 (also accepts 1.333 etc.) else 16:9.
let aspect = (function () {
  try {
    const q = new URLSearchParams(location.search).get('aspect');
    if (q && ASPECTS[q]) return q;
    if (q) { const n = parseFloat(q); for (const k in ASPECTS) if (Math.abs(ASPECTS[k] - n) < 0.02) return k; }
  } catch (e) {}
  return '16:9';
})();

// Display orientation. 'landscape' (default) keeps the native XMB shape; in
// 'portrait' the same aspect ratio is rotated (e.g. 16:9 -> 9:16): the frame is
// taller than wide, so the layout is scaled to FILL THE WIDTH (never squashed)
// and the full-height design is centred vertically with the wave/gradient
// filling the rest of the frame. Toggle with the 'O' key, or set ?orientation=
// portrait (also ?portrait / ?orientation=p).
let orientation = (function () {
  try {
    const sp = new URLSearchParams(location.search);
    if (sp.has('portrait')) return 'portrait';
    const q = (sp.get('orientation') || '').toLowerCase();
    if (q === 'portrait' || q === 'p') return 'portrait';
    if (q === 'landscape' || q === 'l') return 'landscape';
  } catch (e) {}
  return 'landscape';
})();

// True-1x display mode (toggled with the 'N' key, or ?scale=1x / ?native).
// When ON together with ?res, the simulated frame is shown at its EXACT native
// pixel size with NO scaling/magnification (pillar/letterboxed), so it mirrors
// what the real target screen (e.g. a 480x800 panel) would output pixel-for-
// pixel. When OFF (default) the frame uses the normal device-pixel-ratio render
// + integer upscaling.
let native1x = (function () {
  try {
    const sp = new URLSearchParams(location.search);
    if (sp.has('native')) return true;
    const q = (sp.get('scale') || '').toLowerCase();
    if (q === '1x' || q === 'native' || q === '1') return true;
  } catch (e) {}
  return false;
})();

// Resolution simulation. ?res=1280x720 (or a preset like ?res=720p / 1080p /
// 4k / 480p / 576p) renders the app as if the viewport were exactly that pixel
// size, regardless of the real window -- the frame is drawn at the simulated
// resolution and visually shrunk to fit the window if it is larger. ?dpr=N
// overrides the device pixel ratio (e.g. ?dpr=2 to simulate a retina panel; the
// canvas backing store is N x the CSS size). Either can be combined with
// ?aspect= and ?portrait. With ?res, dpr defaults to 1 so "res" is the true
// backing-store pixel count.
const RES_PRESETS = {
  '240p': [426, 240], '360p': [640, 360], '480p': [640, 480], 'vga': [640, 480],
  '576p': [720, 576], '720p': [1280, 720], 'hd': [1280, 720], '768p': [1366, 768],
  '900p': [1600, 900], '1080p': [1920, 1080], 'fhd': [1920, 1080],
  '1440p': [2560, 1440], 'qhd': [2560, 1440], '2160p': [3840, 2160],
  '4k': [3840, 2160], 'uhd': [3840, 2160]
};
let simRes = (function () {
  try {
    const sp = new URLSearchParams(location.search);
    const q = (sp.get('res') || sp.get('resolution') || '').toLowerCase().trim();
    const dprq = parseFloat(sp.get('dpr'));
    let wh = null;
    if (q) {
      if (RES_PRESETS[q]) wh = RES_PRESETS[q];
      else { const m = q.match(/^(\d+)\s*[x×*]\s*(\d+)$/); if (m) wh = [+m[1], +m[2]]; }
    }
    if (wh) return { w: wh[0], h: wh[1], dpr: (dprq > 0 ? dprq : null) };
    if (dprq > 0) return { w: null, h: null, dpr: dprq };
  } catch (e) {}
  return null;
})();

// Cinfo (hover) background state. Tracks the currently focused HOVER_BG-mapped
// item, dwell start time, and the current bg image. When the cursor leaves an
// item (or moves to one without a bg) the alpha animates back to 0 and the
// current url is cleared once fully faded out.
//   focusedKey:  current item name with a HOVER_BG entry (or null)
//   dwellStart:  performance.now() when focus moved to focusedKey
//   currentUrl:  url of the bg currently being faded in or visible
//   alpha:       current visible alpha (0..HOVER_BG_MAX_ALPHA)
//   lastAlphaT:  performance.now() of the last alpha update (for dt-based fade)
let cinfoBg = {focusedKey: null, dwellStart: 0, currentUrl: null, alpha: 0, lastAlphaT: 0};

// Animation state - driven by render loop, not setTimeout
let catAnim = null; // {start, from, to, dur, ease?}
let itemAnim = null;
// Description fade state for item navigation. The item slide animation
// (itemAnim) is 100ms - too fast for description text to read as a fade
// rather than a flicker. The description gets its own slower fade so the
// previously-active item's description (visible at full alpha) recedes to
// 0 while the newly-active item's description appears - matching the PS3
// cinfo/info-pane behavior where description text crossfades smoothly.
// {start, dur, fromIdx} - fromIdx is the previous active item's index.
let itemDescAnim = null;
// Description fade duration. The firmware contains 200.0f (260 rodata
// instances, "base anim duration" per decomp doc B.2) and 300.0f (21
// instances, "longer transition / initial delay"). Description fades
// are slightly longer than the slide motion to read as a fade, so we
// use 250ms (a common firmware value between the two - explore vaddr
// 0x2708F0 = 0.25f is a documented anim duration).
const ITEM_DESC_FADE_MS = 250;

// Submenu slide animation state
// dir: 1 = entering submenu (parent slides left, child slides in from right)
//     -1 = exiting submenu (child slides right, parent slides in from left)

// dialogState = {item, template, sel, anim}
// Where template is from DIALOG_TEMPLATES, sel is the index of the focused
// option (chooser) or button (confirm/info), and anim is a fade-in progress.
let dialogState = null;
// dialogClosing holds a live-wave dialog that is animating its exit cross-fade
// after the user pressed Circle. {template, sel, iconId, start, dur}. The
// dialog keeps drawing at decreasing opacity (and the XMB chrome fades back
// in) until the animation completes, then it is cleared.
let dialogClosing = null;

// All FULLSCREEN settings dialogs (System Update and every menu/submenu like it)
// share the System Update design + transition: the live wave + per-month gradient
// stay rendering behind, blur-ramp in, the XMB chrome (icon row, clock, Settings
// column) zoom-fades out, and the dialog cross-fades over ~110ms (reversed on
// exit). This is the default for any dialog template UNLESS it is a side-panel
// chooser (Theme/Color/Background, panel:true) -- those keep the XMB sharp and
// slide a panel in -- or it explicitly opts out with liveWave:false. Centralising
// the rule here means every fullscreen dialog matches System Update automatically.
function isLiveWaveDlg(t) {
  return !!t && t.panel !== true && t.liveWave !== false;
}

// PSN/landing fullscreen card state - replaces the XMB when set.
// landingState = {item, template, anim}
let landingState = null;

function curItems() {
  if (!stack.length) return DATA[ci].items;
  const frame = stack[stack.length - 1];
  return frame.items[frame.pi].ch;
}

// =====================================================
// ICON CACHE
// =====================================================
const iconCache = {};
const ICON_RENDER_SIZE = 256;

// Per-icon visual scale multiplier. Most XMB icons are normal-map renders with
// transparent padding around the visible shape (fill ratio ~0.62-0.67 of the
// canvas). The PSN sphere (xmb_icon_psn.png) and PlayStation Store bag
// (playstation_store.png) come from different sources and fill the canvas
// almost entirely (0.94 and 1.00 respectively), making them appear ~50% larger
// than other icons when drawn at the same size. We scale them down so their
// visible content matches the median visible footprint of the canonical XMB
// icon set. Measured visible fill ratios (alpha > 10): xmb_icon_001=0.674,
// xmb_icon_psn=0.943, playstation_store=1.000, median across xmb_icon_NNN
// sample (60 icons) = 0.643. Target ratio = median / measured.
const ICON_SCALE = {
  'xmb_icon_psn':      0.68,  // 0.643 / 0.943 = 0.682; verified empirically against cat_08_psn.png (105x103 active, 73x72 inactive: exact match)
  'playstation_store': 0.83,  // empirical: ref bag 47x64 inactive, web bag at 0.64 was 36x50 (-23%); 0.64/0.77 = 0.83
};

function renderNormalMapIcon(normalMapImg) {
  const canvas = document.createElement('canvas');
  canvas.width = ICON_RENDER_SIZE;
  canvas.height = ICON_RENDER_SIZE;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(normalMapImg, 0, 0, ICON_RENDER_SIZE, ICON_RENDER_SIZE);
  const imgData = ctx.getImageData(0, 0, ICON_RENDER_SIZE, ICON_RENDER_SIZE);
  const pixels = imgData.data;
  const out = ctx.createImageData(ICON_RENDER_SIZE, ICON_RENDER_SIZE);
  const od = out.data;

  const keyLight = [0.45, 0.65, 0.6];
  const fillLight1 = [-0.5, 0.2, 0.7];
  const fillLight2 = [0.1, -0.5, 0.6];
  function norm(v) { const l = Math.sqrt(v[0]*v[0]+v[1]*v[1]+v[2]*v[2]); return l > 0 ? [v[0]/l,v[1]/l,v[2]/l] : [0,0,1]; }
  const kl = norm(keyLight), fl1 = norm(fillLight1), fl2 = norm(fillLight2);
  const halfK = norm([kl[0], kl[1], kl[2]+1]);
  const specPow = 40;
  const ambient = 0.55;

  for (let i = 0; i < pixels.length; i += 4) {
    const nx = (pixels[i] / 255) * 2 - 1;
    const ny = (pixels[i+1] / 255) * 2 - 1;
    const nz = (pixels[i+2] / 255) * 2 - 1;
    const nl = Math.sqrt(nx*nx + ny*ny + nz*nz);
    const Nx = nl > 0 ? nx/nl : 0, Ny = nl > 0 ? ny/nl : 0, Nz = nl > 0 ? nz/nl : 1;

    const dotK = Math.max(0, Nx*kl[0] + Ny*kl[1] + Nz*kl[2]);
    const dotF1 = Math.max(0, Nx*fl1[0] + Ny*fl1[1] + Nz*fl1[2]);
    const dotF2 = Math.max(0, Nx*fl2[0] + Ny*fl2[1] + Nz*fl2[2]);
    const dotH = Math.max(0, Nx*halfK[0] + Ny*halfK[1] + Nz*halfK[2]);
    const spec = Math.pow(dotH, specPow);
    const fresnel = Math.pow(1 - Math.abs(Nz), 2) * 0.15;
    const lum = Math.min(1, ambient + dotK * 0.35 + dotF1 * 0.08 + dotF2 * 0.06 + spec * 0.35 + fresnel);
    const val = Math.round(lum * 255);
    od[i] = val; od[i+1] = val; od[i+2] = val;
    od[i+3] = pixels[i+3];
  }
  ctx.putImageData(out, 0, 0);
  return canvas;
}

// Visual scale factor for an icon id (defaults to 1.0).
function iconScale(id) {
  return ICON_SCALE[id] || 1.0;
}

function getIcon(id) {
  if (!iconCache[id]) {
    const num = id.replace('xmb_icon_', '');
    const fallbackImg = new Image();
    // normalMap: HTMLImageElement holding the raw 128x128 normal map PNG
    //   used by the glass shader pipeline. Null for icons that are not
    //   normal-map-rendered (PSN sphere, Store bag).
    // rendered: whether the static CPU-Phong PNG is loaded (used as a
    //   fallback before glass GL is ready, and for special-ID icons).
    iconCache[id] = {img: fallbackImg, loaded: false, rendered: false,
                     normalMap: null, normalMapReady: false};
    // Only attempt the normal-map render path for ids with a numeric suffix
    // (xmb_icon_NNN). For special ids like xmb_icon_psn the normal map does
    // not exist; go straight to the raw icon to avoid a 404 noise event.
    if (/^\d{3}$/.test(num)) {
      const nmapImg = new Image();
      iconCache[id].normalMap = nmapImg;
      nmapImg.onload = function() {
        iconCache[id].normalMapReady = true;
        const rendered = renderNormalMapIcon(nmapImg);
        const finalImg = new Image();
        finalImg.onload = function() {
          iconCache[id].img = finalImg;
          iconCache[id].loaded = true;
          iconCache[id].rendered = true;
        };
        finalImg.src = rendered.toDataURL();
      };
      nmapImg.onerror = function() {
        // No normal map exists: fall back to raw colored icon.
        iconCache[id].normalMap = null;
        fallbackImg.src = 'icons/' + id + '.png';
        fallbackImg.onload = function() { iconCache[id].loaded = true; };
      };
      nmapImg.src = 'normalmaps/nmap_' + num + '.png';
    } else {
      fallbackImg.src = 'icons/' + id + '.png';
      fallbackImg.onload = function() { iconCache[id].loaded = true; };
    }
  }
  return iconCache[id];
}

// Load month gradient - PS3 interpolates between current and next month based on day
const monthBgImg = document.createElement('canvas');

function loadMonthBg() {
  const now = new Date();
  // Discrete current-month gradient (no cross-month fade -- blending two
  // opposite-hue months desaturates to grey). Day vs night chosen by hour.
  // Firmware month index is 1-based (01..12). Use the ACTUAL current month -- NO
  // off-by-one swap. The month texture drives VALUE/STRUCTURE + day/night ONLY;
  // the displayed plum HUE comes from the theme tint via HSV, not from picking a
  // neighbouring month's texture (gradient_firmware_logic.md S1c/S2).
  const month = (window._monthOverride != null) ? window._monthOverride : now.getMonth(); // 0-11
  const texMonth = month + 1; // 1..12, current month
  const hour = now.getHours();
  const isNight = (hour < 6 || hour >= 18);
  const idx = (isNight ? texMonth + 12 : texMonth).toString().padStart(2, '0');

  const img1 = new Image();
  img1.onload = function () {
    const ctx = monthBgImg.getContext('2d');
    ctx.drawImage(img1, 0, 0);
    monthBgLoaded = true;
  };
  img1.src = 'month_bg_' + idx + '.png';
}

// =====================================================
// EASING (PS3 ease_in_out_cubic from RPCS3)
// =====================================================
function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, maxLines) {
  // Word-wrap text into up to maxLines lines, then draw each from y downward.
  const words = text.split(' ');
  const lines = [];
  let cur = '';
  for (const w of words) {
    const test = cur ? cur + ' ' + w : w;
    if (ctx.measureText(test).width > maxWidth && cur) {
      lines.push(cur);
      cur = w;
      if (lines.length >= maxLines) break;
    } else {
      cur = test;
    }
  }
  if (cur && lines.length < maxLines) lines.push(cur);
  for (let i = 0; i < lines.length; i++) {
    ctx.fillText(lines[i], x, y + i * lineHeight);
  }
}

function ease(t) {
  // PS3 firmware default smoothstep (cubic Hermite).
  // Used for cat / item / submenu transitions.
  if (t >= 1) return 1;
  if (t <= 0) return 0;
  return t * t * (3 - 2 * t);
}

// Asymmetric cubic Hermite easing with explicit in/out tangent weights.
// Firmware: explore_plugin.prx vaddr 0x2707BC/C0, 0x2707D0/D4 etc.
// Weights are usually (0.5, 0.4). With (0.5, 0.5) this collapses back to
// the standard smoothstep. With (0.5, 0.4) the curve eases out a touch
// faster than it eases in, producing the firmware's "settle" feel.
function easeWithWeights(t, wIn, wOut) {
  if (t >= 1) return 1;
  if (t <= 0) return 0;
  // Cubic Hermite with h00=1, h10=0, h01=0, h11=1 boundary conditions
  // and tangents (wIn) at t=0, (wOut) at t=1. Expanded form:
  //   h(t) = (2t^3 - 3t^2 + 1)*0 + (t^3 - 2t^2 + t)*wIn
  //        + (-2t^3 + 3t^2)*1 + (t^3 - t^2)*wOut
  // Boundary values are 0 -> 1, tangents in/out scale slope at endpoints.
  const t2 = t * t;
  const t3 = t2 * t;
  return (t3 - 2 * t2 + t) * wIn
       + (-2 * t3 + 3 * t2)
       + (t3 - t2) * wOut;
}

// Sample a piecewise-linear curve at parameter t in [0, 1].
// Used for the firmware's 5-step ease curve [0.2, 0.28, 0.5, 0.78, 1.0]
// (vaddr 0x271044-0x271054). Each value is the output sample at evenly
// spaced inputs 0, 0.25, 0.5, 0.75, 1.0.
function easeFromCurve(t, curve) {
  if (t >= 1) return curve[curve.length - 1];
  if (t <= 0) return curve[0];
  const seg = curve.length - 1;
  const pos = t * seg;
  const i = Math.floor(pos);
  const f = pos - i;
  return curve[i] + (curve[i + 1] - curve[i]) * f;
}

// Back-ease (overshoot) easing. The XMB has documented overshoot behaviour:
//   - xmb_plugin.prx vaddr 0x17F58 = 1.1 (overshoot factor, 10%)
//   - explore_plugin.prx vaddr 0x270944 = 1.06 (ITEM_TWEEN_SCALE_UP)
//   - explore_plugin.prx vaddr 0x270948 = 0.76 (ITEM_TWEEN_SCALE_DOWN)
// The standard easeOutBack with c1=1.70158 yields exactly 10% overshoot,
// matching the firmware's 1.1 factor. The active item momentarily moves
// past its target then settles, giving the snappy/reactive feel.
//
//   easeOutBack(t) = 1 + (c1+1)*(t-1)^3 + c1*(t-1)^2
//
// Analytical peak in [0,1] is at t = 1 - 2*c1/(3*(c1+1)). For c1=1.70158
// peak ≈ 1.10 at t ≈ 0.58 - the curve rises past 1, settles back to 1 at
// t=1. NOTE: kept for reference / potential future scale-pop use, but no
// longer applied to nav cat/item slides because the overshoot produced a
// rubber-band feel that does not match the PS3 XMB's smooth glide.
function easeOutBack(t, c1) {
  if (t >= 1) return 1;
  if (t <= 0) return 0;
  if (c1 === undefined) c1 = 1.70158;
  const c3 = c1 + 1;
  const u = t - 1;
  return 1 + c3 * u * u * u + c1 * u * u;
}

// easeOutCubic: fast start, smooth finish, NO overshoot.
//   f(t) = 1 - (1-t)^3
// At t=0.3 the curve is already at 1 - 0.7^3 = 0.657 (66% of distance), so
// the slide visibly moves most of the way in the first third of its
// duration and then glides into the target. This matches the user-reported
// PS3 feel ("fast start, smooth settle") better than either a symmetric
// smoothstep (too floaty in the first half) or easeOutBack (rubber-band
// overshoot at the end). Used by navCat and navItem so each press snaps
// off the line without bouncing past the target.
function easeOutCubic(t) {
  if (t >= 1) return 1;
  if (t <= 0) return 0;
  const u = 1 - t;
  return 1 - u * u * u;
}

const bgCanvas = document.getElementById('bg');

// header docs near V.BLEND_PREV_ALPHA). We mirror this by keeping an
// offscreen canvas of the previous XMB-layer composite and drawing it at
// alpha=BLEND_PREV_ALPHA before the new XMB content draws.

const xmbPrevCtx = xmbPrevCanvas.getContext('2d');
let xmbPrevValid = false;

// pass runs on far fewer pixels, keeping the cost negligible even at 4K DPR
// without sacrificing visual quality (the blur radius dwarfs the downsample
// loss).
const dialogBlurCanvas = document.createElement('canvas');
const dialogBlurCtx = dialogBlurCanvas.getContext('2d');
const DIALOG_BLUR_W = 384;        // ~5x downsample from 1920w; blur kernel hides this
const DIALOG_BLUR_H = 216;

dialogBlurCanvas.height = DIALOG_BLUR_H;

// be redrawn scaled-up + faded (Fix 3). Sized to the device canvas in resize().
const chromeXfadeCanvas = document.createElement('canvas');
const chromeXfadeCtx = chromeXfadeCanvas.getContext('2d');

let scale = 1, scaleX = 1, scaleY = 1, dpr = window.devicePixelRatio || 1;
// Two horizontal factors for non-16:9 aspect ratios (both 1.0 in 16:9):
//   LAYOUT_FIT = frame geometry. The frame shows virtual x in 0..V.W*LAYOUT_FIT,
//                so V.W*LAYOUT_FIT is the frame's RIGHT edge. Use XCF() for
//                right-anchored / centred / frame-spanning things.
//   LAYOUT_XC  = content position compression for LEFT-anchored elements. It is
//                softened relative to LAYOUT_FIT for narrow frames so the layout
//                matches the real PS3 (slightly less compressed, right overflow
//                cropped). Use XCP()/XCL() for left-anchored x-POSITIONS only;
//                never apply either to element widths/sizes.
let LAYOUT_XC = 1, LAYOUT_FIT = 1;
// Vertical layout factors (mirror of LAYOUT_FIT for the portrait branch).
//   LAYOUT_VFIT = frame height in virtual units / V.H (1.0 in landscape, >1 in
//                 portrait where the frame is taller than the 1080 design).
//   LAYOUT_VOFF = virtual-y offset of the design's top edge so the 1080-tall
//                 layout is positioned within the taller frame (0 in landscape).
//                 The frame spans virtual y in [-LAYOUT_VOFF, V.H + (extra)].
let LAYOUT_VFIT = 1, LAYOUT_VOFF = 0;
// LAYOUT_XSHIFT: extra leftward shift (virtual px) of left-anchored content on
// narrow non-4:3 frames, so the active row (name + subtitle + value) gets more
// horizontal room on the right. 0 at 16:9 and at 4:3 (which is tuned to the real
// PS3). DESC_BOOST: subtitle (item description) font multiplier, raised on small
// frames so the secondary text stays readable at low resolutions.
let LAYOUT_XSHIFT = 0, DESC_BOOST = 1;
function XCP(x) { return x * LAYOUT_XC - LAYOUT_XSHIFT; }
function XCF(x) { return x * LAYOUT_FIT; }
// Full visible-frame bounds in virtual coords (accounts for the portrait
// vertical letterbox-less fill). In landscape these are 0 and V.H.
function frameTopV() { return -LAYOUT_VOFF; }
function frameHV() { return V.H * LAYOUT_VFIT; }
// Device-space vertical translate that CENTRES the 1080-tall virtual design in
// the visible frame. Used by fullscreen dialogs / side panels / landing cards so
// they sit centred for any aspect, orientation or resolution (it is 0 in 16:9
// and in any frame whose design already fills the height). cy_px = dpr*scaleY*y
// + frameCenterTY() maps virtual y=540 to the frame's vertical centre.
function frameCenterTY() { return xmbCanvas.height / 2 - dpr * scaleY * (V.H / 2); }
// Compress a centred draw's top-left: pass CENTRE and half-width, compress only
// the centre (keeps the element full size).
function XCL(centerX, halfW) { return centerX * LAYOUT_XC - LAYOUT_XSHIFT - halfW; }

function resize() {
  // Simulated viewport: ?res forces a specific pixel resolution; otherwise use
  // the real window. ?dpr overrides the device pixel ratio.
  const realDPR = window.devicePixelRatio || 1;
  const vw = (simRes && simRes.w) ? simRes.w : window.innerWidth;
  const vh = (simRes && simRes.h) ? simRes.h : window.innerHeight;
  // Render resolution (canvas backing). We always render at the DEVICE pixel
  // ratio so text/icons are pixel-sharp at full physical resolution -- including
  // when simulating a resolution (on a 2x/HiDPI display the backing is rendered
  // at 2x the native frame, so it is crisp and high-detail rather than a soft
  // half-resolution image). ?dpr=N overrides this for explicit super/sub-sampling
  // (e.g. ?dpr=1 to inspect true low-res native pixels).
  // TRUE 1x mode ('N' key): render the simulated frame at its exact native pixel
  // size (dpr=1) and show it 1:1 with no magnification (below). Only applies when
  // a ?res target is set.
  const trueNative = native1x && !!(simRes && simRes.w);
  dpr = trueNative ? 1 : ((simRes && simRes.dpr) ? simRes.dpr : realDPR);
  // Target display aspect ratio (1:1 / 4:3 / 3:2 / 16:9 / 21:9). In portrait the
  // ratio is inverted (e.g. 16:9 -> 9:16) so the frame is taller than wide.
  const baseR = ASPECTS[aspect] || 16 / 9;
  // 1:1 is square, so its portrait and landscape frames are identical; always
  // use the height-fill (fill-the-square) layout for it -- that makes the best
  // use of the square, whereas the width-fit portrait path would leave vertical
  // gaps. Portrait re-shaping therefore only applies to non-square ratios.
  const portrait = (orientation === 'portrait') && (Math.abs(baseR - 1) > 0.001);
  const r = portrait ? (1 / baseR) : baseR;
  let w, h;
  if (vw / vh > r) { h = vh; w = h * r; } else { w = vw; h = w / r; }
  // In TRUE 1x mode the CSS box is sized to native/realDPR while the backing
  // stays at the native pixel count (dpr=1), so the browser maps each native
  // pixel to exactly ONE physical device pixel -- the standard pixel-perfect
  // canvas mapping, with NO transform-scale resample (which on a HiDPI display
  // would otherwise upscale the backing 2x and then shrink it, leaving it soft).
  const cssScale = trueNative ? (1 / realDPR) : 1;
  scr.style.width = (w * cssScale) + 'px';
  scr.style.height = (h * cssScale) + 'px';
  // Display scaling for a simulated resolution. The canvas is rendered at the
  // native size; for display we use the LARGEST INTEGER scale that still fits the
  // real window, with pill/ letterboxing around it (the black #wrap background),
  // and nearest-neighbour (pixelated) filtering -- so each native pixel maps to a
  // clean NxN block instead of the browser's blurry fractional resample. Only
  // when the native frame is bigger than the window do we fall back to a
  // fractional fit (you cannot integer-downscale). Recomputed on every resize, so
  // it stays responsive to viewport changes.
  if (simRes && simRes.w) {
    scr.style.transformOrigin = 'center center';
    if (trueNative) {
      // TRUE 1x: the pixel-perfect 1:1 mapping is achieved by the CSS box sizing
      // above (native/realDPR) + native-size backing, so NO transform is needed.
      // Centred by the flex #wrap -> pill/letterboxed by its black background.
      scr.style.transform = '';
      scr.classList.add('pixelated');
    } else {
      const kf = Math.min(window.innerWidth / w, window.innerHeight / h);
      const k = (kf >= 1) ? Math.floor(kf) : kf;     // integer up, fractional down
      // Use nearest-neighbour (crisp NxN blocks) whenever we are integer-UPSCALING
      // at the physical-pixel level (each backing pixel maps to a whole number of
      // device pixels: k * realDPR >= dpr). When ?dpr supersamples beyond the
      // display (backing > shown physical), we are downscaling, so leave it smooth.
      const integer = (kf >= 1) && (k * realDPR >= dpr - 0.001);
      scr.style.transform = (Math.abs(k - 1) > 0.0001) ? ('scale(' + k + ')') : '';
      scr.classList.toggle('pixelated', integer);    // crisp nearest-neighbour blocks
    }
  } else {
    scr.style.transform = '';
    scr.classList.remove('pixelated');
  }
  // UNIFORM scale (never anamorphic) so icons/text/wave keep their true aspect
  // and are NEVER stretched. Scale fills the HEIGHT (h/V.H); in 16:9 this equals
  // w/V.W (unchanged). In 4:3 the 16:9-wide layout would overflow the narrower
  // frame, so we don't squash it -- instead LAYOUT_XC compresses element
  // POSITIONS (not sizes) so the full-size layout fits the 4:3 frame, exactly
  // like the real PS3 4:3 re-layout.
  // Low-resolution landscape frames render as the NORMAL layout (the standard
  // 16:9 / 4:3 / etc. design, just at fewer pixels and narrower) -- they are NOT
  // magnified. A previous "readability zoom" enlarged the whole UI and centred a
  // taller-than-frame design, which clipped the clock, removed the top/bottom
  // padding of full-screen dialogs and overlapped the clock with the category
  // bar. That is removed; readability at low res now comes purely from the
  // subtitle wrap + DESC_BOOST below. READ_CUT marks "genuinely tiny" frames used
  // by DESC_BOOST. (Portrait keeps its own PORTRAIT_ZOOM, applied in that branch.)
  const READ_CUT = 540;
  const readZoom = 1;
  let vOffPx = 0;
  if (portrait) {
    // PORTRAIT: the frame is taller than wide. We ZOOM IN past a plain width-fit
    // (PORTRAIT_ZOOM, plus the readability zoom) so the UI reads larger on a tall
    // screen, then use the ample vertical room to show a LONG item list rather
    // than a short centred band. Zooming makes the visible virtual width narrower
    // than V.W, so right-anchored content (values, clock) is repositioned to that
    // narrower right edge via LAYOUT_FIT and left-anchored content is mildly
    // compressed via LAYOUT_XC -- exactly the narrow-landscape model (cf.
    // 4:3/3:2), which keeps icons from overlapping. Vertically the focus row is
    // parked ~44% down the frame so the list runs far below it.
    const PORTRAIT_ZOOM = 1.3;
    // Narrower portrait frames zoom in MORE so the UI stays legible on small
    // phone-shaped screens (e.g. a 480-wide panel). Ramps from PORTRAIT_ZOOM up
    // to ~2.0 as the frame narrows; only when simulating a resolution.
    const pZoom = (simRes && simRes.w)
      ? Math.max(PORTRAIT_ZOOM, Math.min(2.0, 960 / w))
      : PORTRAIT_ZOOM;
    scale = (w / V.W) * pZoom;
    LAYOUT_FIT = (w / scale) / V.W;                   // visible virtual width / V.W
    LAYOUT_XC = 1 - (1 - LAYOUT_FIT) * 0.56;          // soften like a narrow frame
    LAYOUT_VFIT = (h / scale) / V.H;                  // tall: > 1
    // Park the focus row at 44% of the frame height (slightly above centre) so
    // more items fit below it -- longer vertical lists.
    vOffPx = h * 0.44 - V.ITEM_FOCUS_Y * scale;
    LAYOUT_VOFF = vOffPx / scale;
  } else {
    // LANDSCAPE / square: fill the HEIGHT (uniform), flex horizontally. readZoom
    // is 1 here, so this is the standard height-fill layout (clock at the top,
    // full dialog padding, no vertical centring) at whatever resolution.
    scale = (h / V.H) * readZoom;
    // Frame geometry factor: V.W*LAYOUT_FIT is the frame's right edge in virtual
    // space (= visible virtual width / V.W; 1.0 at 16:9 with no zoom).
    LAYOUT_FIT = (w / scale) / V.W;
    // Content position-compression. Narrow frames (<16:9) are softened toward 1.0
    // (factor 0.56) so the content is slightly less compressed than a pure fit and
    // overflows/crops on the right like the real PS3 4:3 (gives ~0.86 at 4:3 vs
    // 0.75 pure-fit). Wide frames just expand to fill (= LAYOUT_FIT).
    LAYOUT_XC = (LAYOUT_FIT >= 1) ? LAYOUT_FIT : (1 - (1 - LAYOUT_FIT) * 0.56);
    LAYOUT_VFIT = (h / scale) / V.H;                  // 1 when readZoom=1, else < 1
    vOffPx = (h - V.H * scale) / 2;                   // centre vertically (0 if no zoom)
    LAYOUT_VOFF = vOffPx / scale;
  }
  scaleX = scale;
  scaleY = scale;
  // Subtitle (item description) size boost on genuinely tiny SIMULATED frames so
  // secondary text stays readable (e.g. ?res=640x480 / 480x800). Same cutoff as
  // readZoom (smaller dimension < READ_CUT 540) so normal resolutions like
  // 960x544 / 960x540 / 720p keep the authentic subtitle size; only applied when
  // simulating a resolution. (Wide wrapping of the subtitle, fixed separately,
  // already keeps it readable on small but non-tiny frames such as 720x720.)
  DESC_BOOST = (simRes && simRes.w)
    ? Math.min(1.5, 1 + Math.max(0, READ_CUT - Math.min(w, h)) / 300)
    : 1;
  // Shift left-anchored content further LEFT on frames NARROWER than 4:3 (but not
  // 4:3 itself, which is matched to the real PS3) so the active row gets more room
  // on the right for the name, subtitle and value. Ramps from 0 at LAYOUT_FIT 0.75
  // (4:3) up as the frame narrows. Skipped for ~4:3 and for wide frames.
  const FIT_43 = 0.75;
  if (LAYOUT_FIT < FIT_43 - 0.01) {
    LAYOUT_XSHIFT = (FIT_43 - LAYOUT_FIT) * V.W * 0.34;
  } else {
    LAYOUT_XSHIFT = 0;
  }
  bgCanvas.width = w * dpr;
  bgCanvas.height = h * dpr;
  xmbCanvas.width = w * dpr;
  xmbCanvas.height = h * dpr;
  // Match the interframe-blend accumulator to the visible XMB canvas so
  // drawImage copies are 1:1 with no extra resampling.
  xmbPrevCanvas.width = w * dpr;
  xmbPrevCanvas.height = h * dpr;
  chromeXfadeCanvas.width = w * dpr;
  chromeXfadeCanvas.height = h * dpr;
  // Invalidate residual content -- a resize changes pixel layout.
  xmbPrevValid = false;
  // Resize wave canvas
  const wc = document.getElementById('wave');
  if (wc) {
    wc.width = w * dpr;
    wc.height = h * dpr;
    // Reset FBO sizes so they get recreated at new resolution
    if (webglAvailable) {
      fboW = 0;
      fboH = 0;
    }
  }
  // Portrait centres the design vertically via a translate (0 in landscape).
  const tY = dpr * vOffPx;
  bgCtx.setTransform(dpr * scaleX, 0, 0, dpr * scaleY, 0, tY);
  ctx.setTransform(dpr * scaleX, 0, 0, dpr * scaleY, 0, tY);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  // Crisp text rendering matching PS3 typography
  if ('fontKerning' in ctx) ctx.fontKerning = 'normal';
  if ('textRendering' in ctx) ctx.textRendering = 'optimizeLegibility';
  if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
  bgCtx.imageSmoothingEnabled = true;
  bgCtx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', resize);

// =====================================================
// ANIMATION HELPERS
// =====================================================
function animProgress(anim, now) {
  if (!anim) return null;
  const t = Math.min((now - anim.start) / anim.dur, 1);
  // Per-anim easing override; default is the smoothstep ease().
  const e = anim.ease ? anim.ease(t) : ease(t);
  const val = anim.from + (anim.to - anim.from) * e;
  return {val, done: t >= 1, t};
}

// =====================================================
// WEBGL WAVE BACKGROUND (firmware lines.qrc rendering)
// =====================================================
// Firmware parameters (LINE1.mnu, PARTICLES.mnu)
const FW_PERTURBATION = 0.1;
const FW_SPEC_POWER = 35.3;
const FW_SPEC_COEFF = 74.74;
// Firmware-derived steady-state count: emit_per_frame(16.65) * emit_prob(0.479)
// ~= 8 emitted/frame, lifetime 1/aging_speed(0.00285) ~= 350 frames -> ~2800.
// Firmware steady-state pool is ~2800, but most are sub-visible dust; the
