// =====================================================
// WAVE INPUT-IMPULSE SYSTEM (spring-physics over target)
// =====================================================
// The PS3 SPU spline (spline.elf) is a CONTINUOUS process: each 4ms tick
// integrates input pressure into 361 spline control points then applies
// damping=0.0001 per tick. There are no "discrete impulses" at the spline
// level - the spline reads the current input value every tick. Previous
// implementation pushed one timestamped impulse per nav event into an
// array of 4, which during sustained input (key-repeat at up to 20Hz)
// caused new impulses to evict old ones rapidly and produced visible
// "wobbles per event" rather than continuous deformation.
//
// New model: spring-physics ODE driven by a per-axis TARGET. Each press
// accumulates into the target (clamped at WAVE_VEL_CAP). A critically
// damped spring then advances the visible amplitude (waveVelX/waveVelY)
// toward that target every frame. The target itself decays exponentially
// to zero so a single tap produces a swell that rises, peaks, and settles
// on its own; sustained input keeps the target at the cap so the wave
// holds a steady deformation. Direction-reversal works naturally because
// the spring sees a continuous target change and the new force opposes
// existing velocity (no teleport, no amplitude step).
//
// Why a spring rather than a step+decay accumulator?
//   - Prior model: pushWaveImpulse did `waveVelX += magnitude`, an
//     instantaneous step in the shader uniform. Each press produced a
//     visible amplitude jump because the deformation magnitude is
//     proportional to waveVelX. That step is the perceived "jerk".
//   - Spring model: the target jumps, but waveVelX itself is the result
//     of integrating a second-order ODE so it cannot jump. The shader
//     receives a smooth signal regardless of how rapid the input is.
//
// Firmware citation (single_silk_input_reactive_notes.md):
//   "The SPU integrates the impulse over ~50 ticks (200ms half-life) via
//    natural damping." LINE1.mnu damping=0.0001 per 4ms tick is applied
//    to a continuously-read input scalar in the spline.elf SPU program.
//   So the firmware behavior is fundamentally a 2nd-order integration of
//   a smoothed input, not a step-add.
//
// Spring constants. The real PS3 XMB ramps wave response EXPONENTIALLY
//   while a direction is held. A single tap gives a barely-visible nudge;
//   continued key-repeat presses grow the wave amplitude non-linearly
//   toward the cap, reaching full deflection after ~2-3 seconds of hold.
//   The spring itself is critically damped (D = 2*sqrt(K)). Previously
//   K=100/D=20 (omega_n=10 rad/s, ~0.3s settle) - too stiff, the first
//   press was visible. Now K=30/D=10.95 (omega_n~5.5 rad/s, ~0.55s
//   settle) so even at full target the spring takes longer to reach it,
//   smoothing the perceived per-press jump.
const WAVE_VEL_CAP = 0.10;             // firmware perturbation=0.1 ceiling
const WAVE_SPRING_K = 30.0;            // spring stiffness (1/s^2) - softer
const WAVE_SPRING_D = 10.95;           // damping (1/s); 2*sqrt(30) ~= critical
const WAVE_TARGET_HALFLIFE_MS = 250;   // how fast the target decays toward 0
const WAVE_INT_SUBSTEP_S = 0.004;      // 4 ms = firmware timestep
// Exponential per-press ramp. magnitudeScale = 1 - exp(-holdDuration/TAU).
//   tau=800ms: scale ~0.22 @200ms, ~0.46 @500ms, ~0.71 @1s, ~0.92 @2s.
// Hold-reset threshold: if no input on an axis for >RESET_MS, the hold
//   duration is reset to 0 so the next press starts at floor again.
const WAVE_RAMP_TAU_MS = 800;
const WAVE_HOLD_RESET_MS = 500;
// Floor: even the very first press must produce SOME signal so the user
//   gets feedback. Without a floor (1-exp(0)=0) the first tap would be
//   invisible. 0.05x of base = ~5% of the per-press magnitude, barely
//   perceptible but present.
const WAVE_RAMP_FLOOR = 0.05;
// Per-press increment in the synthetic hold duration. Each pushWaveImpulse
//   advances the hold clock by this amount in addition to the wall-clock
//   delta since the last press. Key-repeat fires at ~50-200ms intervals so
//   wall-clock alone would suffice, but explicit per-press credit means the
//   ramp curve is the same regardless of repeat rate. 60ms matches the
//   median firmware repeat interval.
const WAVE_HOLD_PRESS_CREDIT_MS = 60;
let waveVelX = 0;                      // visible cat-nav amplitude (uniform-facing)
let waveVelY = 0;                      // visible item-nav amplitude
let _waveVelXDot = 0;                  // spring velocity (d/dt of waveVelX)
let _waveVelYDot = 0;
let _waveVelXTarget = 0;               // accumulated input target (cat)
let _waveVelYTarget = 0;               // accumulated input target (item)
let _waveVelLastT = 0;                 // last spring integration tick
// Per-axis hold tracking for exponential input ramp. We track both the
// last press time (to detect "fresh tap" vs "held key repeat") and the
// per-direction hold duration (so the ramp curve restarts on reversal).
let _lastInputTimeX = 0;
let _lastInputTimeY = 0;
let _holdDurationX = 0;                // ms accumulated in current X hold
let _holdDurationY = 0;                // ms accumulated in current Y hold
let _holdDirX = 0;                     // sign of current X hold (-1, 0, +1)
let _holdDirY = 0;                     // sign of current Y hold

function pushWaveImpulse(posX, magnitude, axis) {
  // axis: 'cat' for category (horizontal nav), 'item' for vertical.
  // The press steps the TARGET, not the visible amplitude. The spring
  // then smoothly tracks the new target. posX is unused (kept for API
  // compatibility with the call sites; the shader places deformation by
  // axis, not by posX).
  //
  // Exponential ramp: the contribution of each press grows with how long
  // the user has held this direction. The first press lands a tiny nudge;
  // sustained holding ramps the per-press contribution toward base
  // magnitude, while the accumulated target in turn ramps toward the cap.
  // Combined effect: deflection visibly grows non-linearly over ~1-2s.
  void posX;
  const now = performance.now();
  const dir = magnitude >= 0 ? 1 : -1;
  let lastT, holdMs, holdDir;
  if (axis === 'item') {
    lastT = _lastInputTimeY; holdMs = _holdDurationY; holdDir = _holdDirY;
  } else {
    lastT = _lastInputTimeX; holdMs = _holdDurationX; holdDir = _holdDirX;
  }
  const sinceLast = lastT === 0 ? Infinity : now - lastT;
  // Reset the hold clock on reversal OR if the prior press was long ago.
  if (holdDir !== dir || sinceLast > WAVE_HOLD_RESET_MS) {
    holdMs = 0;
  } else {
    // Advance hold clock by wall-clock delta plus a per-press credit so
    // the ramp profile is robust to whatever key-repeat rate fires it.
    holdMs += Math.min(sinceLast, WAVE_HOLD_RESET_MS) + WAVE_HOLD_PRESS_CREDIT_MS;
  }
  // Exponential scale: 0 at the first press, asymptotic to 1 after long
  // hold. Floor ensures the very first tap still produces a small signal.
  const rawScale = 1 - Math.exp(-holdMs / WAVE_RAMP_TAU_MS);
  const magnitudeScale = WAVE_RAMP_FLOOR + (1 - WAVE_RAMP_FLOOR) * rawScale;
  const scaled = magnitude * magnitudeScale;
  if (axis === 'item') {
    _lastInputTimeY = now;
    _holdDurationY = holdMs;
    _holdDirY = dir;
    _waveVelYTarget += scaled;
    if (_waveVelYTarget >  WAVE_VEL_CAP) _waveVelYTarget =  WAVE_VEL_CAP;
    if (_waveVelYTarget < -WAVE_VEL_CAP) _waveVelYTarget = -WAVE_VEL_CAP;
  } else {
    _lastInputTimeX = now;
    _holdDurationX = holdMs;
    _holdDirX = dir;
    _waveVelXTarget += scaled;
    if (_waveVelXTarget >  WAVE_VEL_CAP) _waveVelXTarget =  WAVE_VEL_CAP;
    if (_waveVelXTarget < -WAVE_VEL_CAP) _waveVelXTarget = -WAVE_VEL_CAP;
  }
}

// Frame-rate independent spring integrator for the wave amplitude. Called
// once per drawBGWebGL frame. Sub-steps at WAVE_INT_SUBSTEP_S (4 ms) so
// the ODE stays stable at any browser refresh rate and so behavior
// matches the firmware's 250 Hz spline tick. Target decays exponentially
// per real-time elapsed so a single tap fades on its own; held input
// keeps the target pinned at the cap.
function decayWaveVelocity(now) {
  if (_waveVelLastT === 0) { _waveVelLastT = now; return; }
  let dtMs = now - _waveVelLastT;
  _waveVelLastT = now;
  if (dtMs <= 0) return;
  // Guard against pathological frame gaps (tab backgrounded etc).
  if (dtMs > 250) dtMs = 250;

  // Target decay over real time elapsed this frame.
  const targetFactor = Math.pow(0.5, dtMs / WAVE_TARGET_HALFLIFE_MS);
  _waveVelXTarget *= targetFactor;
  _waveVelYTarget *= targetFactor;
  if (Math.abs(_waveVelXTarget) < 1e-6) _waveVelXTarget = 0;
  if (Math.abs(_waveVelYTarget) < 1e-6) _waveVelYTarget = 0;

  // Spring integration in fixed 4 ms sub-steps for ODE stability.
  let remaining = dtMs * 0.001; // seconds
  const h = WAVE_INT_SUBSTEP_S;
  while (remaining > 1e-6) {
    const step = remaining < h ? remaining : h;
    // Semi-implicit Euler: integrate velocity first (uses current pos),
    // then position with the new velocity. Stable for critically damped
    // springs at any reasonable step size.
    const ax = WAVE_SPRING_K * (_waveVelXTarget - waveVelX) - WAVE_SPRING_D * _waveVelXDot;
    const ay = WAVE_SPRING_K * (_waveVelYTarget - waveVelY) - WAVE_SPRING_D * _waveVelYDot;
    _waveVelXDot += ax * step;
    _waveVelYDot += ay * step;
    waveVelX += _waveVelXDot * step;
    waveVelY += _waveVelYDot * step;
    remaining -= step;
  }

  // Snap fully-settled state to zero to prevent endless tiny drift that
  // would keep the wave uniform constantly non-zero and pessimise the
  // shader branch in impulseDy().
  if (_waveVelXTarget === 0 &&
      Math.abs(waveVelX) < 1e-5 && Math.abs(_waveVelXDot) < 1e-4) {
    waveVelX = 0; _waveVelXDot = 0;
  }
  if (_waveVelYTarget === 0 &&
      Math.abs(waveVelY) < 1e-5 && Math.abs(_waveVelYDot) < 1e-4) {
    waveVelY = 0; _waveVelYDot = 0;
  }
}

// Boot == override_coldboot1. The steady HDR set is interpolated DAY<->NIGHT by
// the live day/night blend; boot then lerps from that steady base toward
// coldboot1 so the boot bloom-to-white peak is reached regardless of time.
const HDR_DAY     = { expo: 1.05, white: 0.899181, glareL: 1.10245, glareT: 0.738857 };
const HDR_NIGHT   = { expo: 1.41, white: 0.999878, glareL: 1.33,    glareT: 0.699812 };
const HDR_COLDBOOT1 = { expo: 1.64, white: 1.0,    glareL: 1.74,    glareT: 0.2 };
// Resolve the steady (non-boot) HDR set for the current time of day.
function steadyHdrParams() {
  const b = currentNightDayBlend;
  const lerp = (a, c) => a + (c - a) * b;
  return {
    expo:   lerp(HDR_DAY.expo,   HDR_NIGHT.expo),
    white:  lerp(HDR_DAY.white,  HDR_NIGHT.white),
    glareL: lerp(HDR_DAY.glareL, HDR_NIGHT.glareL),
    glareT: lerp(HDR_DAY.glareT, HDR_NIGHT.glareT),

}

// Resolve the per-frame HDR uniform set. At steady state this is the
// day/night-interpolated steadyHdrParams().
// During the boot intro the existing exposure envelope (bootGradientBrightness,
// 1.0 steady, ramping to BOOT_EXP_PEAK at the bloom peak) drives EXPOSURE /
// GLARE LEVEL / GLARE THRESH toward the coldboot1 values, so the boot
// bloom-to-white is the SAME HDR pipeline pushed high -- not a separate system.
function currentHdrParams() {
  // bootIntensity: 0 at steady, 1 at the coldboot1 bloom peak. bootGradientBrightness
  // is 1.0 steady and rises to BOOT_EXP_PEAK (3.6) at the peak.
  let t = 0.0;
  if (typeof bootGradientBrightness === 'number' && bootGradientBrightness > 1.0) {
    t = Math.min(1.0, (bootGradientBrightness - 1.0) / (BOOT_EXP_PEAK - 1.0));
  }
  const lerp = (a, b) => a + (b - a) * t;
  // Steady base is the time-of-day-interpolated DAY<->NIGHT set; boot lerps
  // from there toward coldboot1 so the bloom peak is reached at any time.
  const S = steadyHdrParams();
  return {
    expo:   lerp(S.expo,   HDR_COLDBOOT1.expo),
    white:  lerp(S.white,  HDR_COLDBOOT1.white),
    glareL: lerp(S.glareL, HDR_COLDBOOT1.glareL),
    glareT: lerp(S.glareT, HDR_COLDBOOT1.glareT),
    radial: (typeof bootRadial === 'number') ? bootRadial : 0.0,
  };
}

    var xr = 135 * Math.PI / 180, zr = 60 * Math.PI / 180;
    var d = [Math.sin(xr), Math.sin(zr), Math.cos(zr) * Math.cos(xr)];
    var l = Math.sqrt(d[0]*d[0]+d[1]*d[1]+d[2]*d[2]);
    return [d[0]/l, d[1]/l, d[2]/l];
  })(),
  ambient: [0.74, 0.80, 0.90],
  // SPEC1 POW=100 (sharp), SPEC2 POW=30 (broad). ATTN values .mnu=2 each;
  // the FP wraps the spec contribution through the 1-exp tonemap, so the
  // pre-tonemap intensity can exceed 1 (= clipped to ~1 in tonemap = pure
  // white highlight). Boosted attenuations to 2.4/1.6 (from 1.6/1.0) to
  // give the icons stronger embossed-edge highlights to match the PS3
  // captures where the curved surfaces are clearly defined.
  specParams: [100.0, 30.0, 2.4, 1.6],    // (pow1, pow2, attn1, attn2)
  // REFR R/G/B from .mnu (day theme) but BOOSTED 3x for clearly visible
  // chromatic dispersion. PS3 .mnu values are subtle; the user wants
  // STRONG refraction so the bg clearly bends around the icon curvature.
  refr:       [-0.096, -0.114, -0.144],
  // refrScl: applied as a multiplier on top of icon-UV scaling. The icon
  // already provides a natural-scale displacement (iconUVScale in the shader);
  // refrScl boosts that. Larger -> more refraction (bg bends more around
  // curves). Set to 12.0 so the chromatic offset is clearly visible at the
  // icon edges - the user wants STRONG glass effect, more like the real PS3.
  refrScl:    12.0,
  attnDiffEnv:[2.0, 0.74],                // (ATTN DIFF, ATTN ENV) from .mnu
  glassMix:   1.0,                        // unused in new shader, kept for compat
};

// Particle state - 3D model ported from particles.elf / PARTICLES.mnu.
// Camera at origin looking -Z, FOVY 71.8. Particles live in a frustum slab;
// each carries a spinning unit normal that drives the specular glitter.
// pos[3], vel[3], age[0..1], spin[3] (orientation), spinRate[3].
const PART_ASPECT_DEFAULT = 16 / 9;
const _focalY = 1.0 / Math.tan((FW_PART.fovy * Math.PI / 180) / 2);

// EXACT firmware particle projection matrix (RPCS3 VP constants c[256..259] of
// the particle draw call 36). clip = M * eye; NDC = clip.xy / clip.w.
// Validated: projecting the captured eye-space cloud lands the points exactly
// on the real particles in the framebuffer.
const PART_PROJ = { fx: 1.12820041, fy: 2.00568986, wz: -1.0, ww: 2.0 };
function projectEye(ex, ey, ez) {
  const w = PART_PROJ.wz * ez + PART_PROJ.ww;   // = -ez + 2
  if (w <= 0.001) return null;
  return [ (PART_PROJ.fx * ex) / w, (PART_PROJ.fy * ey) / w, w ];
}

// VERTICAL MOTION of the wave at screen-x = ndcX (NDC), using the SAME analytic
// terms as the wave vertex shader (uTime = waveT, LINE1 settings), with the
// static/DC base removed -> this is the pure undulation. Added on top of each
// particle's validated cloud position so the band sits ON the wave AND moves in
// lockstep with it (not an independent loop, not an absolute mis-placed crest).
function waveMotionDeltaY(x) {
  const t = (typeof waveT === 'number') ? waveT : (_partTime * 0.4);
  // time-varying wave terms only (cos + tension sin), mapped through the same
  // heightScale(0.5) and crest map (*0.6) and the screenY = -p.y direction.
  const moving = 0.09 * Math.cos(x * 2.0 - t * 0.5)          // waveCosAmp travelling
               + 0.25 * Math.sin(x * 0.306 + t * 0.075);      // tension, length, flow
  // EXACT 1:1 match to the wave crest motion: -(totalWave_AC * heightScale) *
  // crest map (0.6). No amplitude boost - boosting desynced the particles from
  // the wave (they overshot it). They now ride the wave in perfect lockstep.
  return -(moving * 0.5) * 0.6;                              // ~+/-0.10 NDC, matches wave
}

// The real XMB particle field (measured from 120-frame RPCS3 motion analysis)
// is NOT a uniform full-screen starfield. It is a band coupled to the wave:
// densest in the lower-LEFT, drifting rightward and fading out, nearly empty
// above the wave crest. Particles are emitted along the left of the wave band
// and carried right by the flow, so steady-state density falls left->right.
let _partTime = 0;
// NDC y of the wave-band center at a given NDC x. Wave crest sweeps ~41-61%
// screen height and rises toward the right; center ~52%, gentle curve + drift.
const _CLOUD_N = (typeof PARTICLE_CLOUD !== 'undefined') ? (PARTICLE_CLOUD.length / 3) | 0 : 0;
// Per-slot motion measured from the firmware: only ~1/3 of active particles move
// on a given frame, by ~0.5-1.2 world units, near-isotropic (NOT directional
// flow - that guess was wrong). So each particle hovers around an eye-space HOME
// sampled from the firmware-extracted cloud, with a small bounded random walk.
function spawnParticle(p, aspect) {
  // Sample a cloud home, but with a LARGE random offset so the 1400 particles
  // don't pile onto the 800 captured points (that caused visible clumping).
  // The offset spreads them while keeping the overall band shape.
  // EDGE PARTICLES: a fraction live at the far LEFT and RIGHT ends of the wave,
  // bigger, with reflective gold/silver/white glitter (a flashlight-reflection
  // look - strong specular flash in a metallic tint).
  p.edge = Math.random() < 0.12;
  if (p.edge) {
    const side = (Math.random() < 0.5) ? -1 : 1;
    // eye-x chosen so it projects near the screen edge (|ndcX| ~ 0.85-1.05),
    // near the wave crest; a bit nearer in depth so perspective makes them larger.
    p.hx = side < 0 ? (-5.6 - Math.random() * 1.1) : (5.1 + Math.random() * 1.1);
    p.hy = (Math.random() - 0.5) * 0.7;
    p.hz = -4.8 - Math.random() * 1.4;
    const r = Math.random();
    p.tintR = r < 0.34 ? 1.00 : (r < 0.67 ? 0.86 : 1.00);   // gold / silver / white
    p.tintG = r < 0.34 ? 0.80 : (r < 0.67 ? 0.89 : 1.00);
    p.tintB = r < 0.34 ? 0.38 : (r < 0.67 ? 0.97 : 1.00);
    p.bigScale = 1.9 + Math.random() * 1.5;
  } else {
    // Sample a cloud home, with a large offset to avoid clumping; keep the band
    // NARROW vertically so the glitter hugs the wave.
    const k = (Math.random() * _CLOUD_N) | 0, b = k * 3;
    p.hx = PARTICLE_CLOUD[b]     + (Math.random() - 0.5) * 1.6;
    // hug the wave TIGHTLY: compress the vertical spread hard so the glitter
    // sits in a thin band right on the wave line.
    p.hy = PARTICLE_CLOUD[b + 1] * 0.45 + (Math.random() - 0.5) * 0.16;
    p.hz = PARTICLE_CLOUD[b + 2] + (Math.random() - 0.5) * 1.4;
    p.bigScale = 1.0;
  }
  p.ex = p.hx; p.ey = p.hy; p.ez = p.hz;          // live eye-space position
  p.vx = 0; p.vy = 0; p.vz = 0;                   // velocity (smooth, friction-damped)
  // vertical lane within the wave-following band (NDC offset from the crest);
  // narrow, biased BELOW the crest (particles hug the wave, trail downward).
  p.bandOff = (Math.random() - 0.62) * 0.38;
  p.age = Math.random();
  // spinning normal -> the per-quad specular twinkle (the glitter/glare pass)
  p.sx0 = Math.random() * Math.PI * 2;
  p.sx1 = Math.random() * Math.PI * 2;
  p.rr0 = (0.5 + Math.random()) * FW_PART.spinTimeScale;
  p.rr1 = (0.5 + Math.random()) * FW_PART.spinTimeScale;
}
const particles = [];
for (let i = 0; i < BG_NUM_PARTICLES; i++) {
  const p = {};
  spawnParticle(p, PART_ASPECT_DEFAULT);
  particles.push(p);
}

// ------ SHADER SOURCES ------

const VS_BG = `
attribute vec2 aPos;
varying vec2 vUV;
void main() {
  vUV = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

// FS_BG: PS3 XMB in-menu background gradient
// The full back_colours0 shader handles boot animation transitions.
// In steady-state menu mode, the output is a simple gradient:
// - Black at top
// - Monthly gradient color fading in at bottom
// - Modulated by night brightness and day/night blend
// Colors blend between current and next month based on day of month
const FS_BG = `
precision mediump float;
varying vec2 vUV;
uniform float uWaveFade;  // 0..1 thin silvery wave presence (boot + steady)

// Thin silvery silk wave: a few delicate translucent filaments along a gently
// undulating crest, like the real PS3 XMB wave. Returns an additive RGB term
// (small -- peak ~0.4 linear so the composite tonemap lands it near ~180/255).
// NOT a band: each filament is a tight gaussian a few % of screen height tall,
// so the wave reads as wispy threads, never a thick blown slab.
vec3 silkWave(vec2 uv, float t) {
  if (uWaveFade <= 0.001) return vec3(0.0);
  float acc = 0.0;
  // Gentle sweeping S-curve, centered mid-screen (~45% height) to match the
  // real XMB steady frame: HIGHER on the left (~0.40), dipping to a TROUGH
  // left-of-center (~0.55), rising to a soft CREST on the right (~0.47). One
  // broad low-frequency sine gives the sweep; a tiny slow secondary term keeps
  // it organic without making it wavy. baseY uses uv.y-down convention (0=top).
  // Real PS3 steady wave: crest sweeps ~41%->61% height (~20% amplitude),
  // centered ~50%. Shape: upper-left HIGH (small y, ~0.42), gentle descent
  // through the middle, a TROUGH (max y, ~0.60) around x=0.54, then RISING
  // back toward the right (~0.50-0.58). A broad asymmetric sweep, not a plain
  // symmetric sine. Built from a phased primary sine (places the trough
  // left-of-center-right) plus a slower secondary term for organic drift.
  // baseY uses uv.y-down convention (0=top).
  float sweepPhase = t * 0.18;
  // Primary broad sweep: tuned (fit to the real frames) so the crest is HIGH
  // on the upper-left (~0.42) and descends to a TROUGH (max y, ~0.58-0.60)
  // around x=0.54-0.60, ~0.105-0.115 amplitude -> ~19% of screen height.
  float primary = sin(uv.x * 4.15 - 1.30 + sweepPhase);
  // Secondary slower term: lifts the right side back UP so the right rises
  // rather than mirroring the left, giving the real asymmetric sweep.
  float secondary = sin(uv.x * 2.0 + sweepPhase * 0.6);
  float baseY = 0.505
              + 0.115 * primary       // broad sweep -> trough left-of-center-right
              - 0.035 * secondary      // asymmetry: lifts the right side back up
              + 0.012 * sin(uv.x * 6.2831 * 0.9 + t * 0.35); // gentle organic ripple
  // 6 thin wispy strands at slightly different heights/phases. They overlap and
  // fan out (vertical spread grows toward the right) so the bundle reads as a
  // silky translucent ribbon, never a single hard line or a solid band.
  for (int i = 0; i < 6; i++) {
    float fi = float(i);
    // Fan-out: strands spread wider on the right (where the real wave frays).
    float spread = mix(0.016, 0.040, uv.x);
    float off = (fi - 2.5) * spread
              + 0.012 * sin(uv.x * 6.2831 * (0.8 + fi * 0.35) + t * (0.5 + fi * 0.12) + fi);
    float cy = baseY + off;
    // Strand thickness grows toward the right (fraying) so the bundle reads as
    // a soft diffuse veil there, tighter on the left.
    float thick = mix(0.0085, 0.013, uv.x);
    float d = (uv.y - cy) / thick;
    float prof = exp(-d * d);
    // Per-filament intensity drifts along x (silk glints fade in/out) so each
    // strand breaks up into wispy segments rather than a continuous line.
    float glint = 0.30 + 0.55 * (0.5 + 0.5 * sin(uv.x * 6.2831 * (1.6 + fi * 0.7) + t * (0.8 + fi * 0.18) + fi * 2.0));
    // Outer strands are fainter so the bundle has a soft falloff at its edges.
    float w = 1.0 - 0.15 * abs(fi - 2.5);
    acc += prof * glint * w;
  }
  // Overall left/right taper: the wave fades softly toward the far edges, but
  // only RIGHT at the very edges -- on real the ribbon is clearly visible from
  // x~0.05 (high, upper-left) all the way to x~0.95, so keep the taper narrow.
  acc *= smoothstep(0.0, 0.05, uv.x) * smoothstep(0.0, 0.05, 1.0 - uv.x);
  // Firmware wave ribbon tint c[23] = (0.651, 0.759, 1.000), the pale
  // cyan-BLUE that the wave blooms additively over the bright neutral top
  // corners, casting the blue hint at the top of the gradient
  // (back_colours_pipeline.md S4/S5). B=1.0 is the bluest channel, so the
  // additive bloom reads cool/blue at the top while the saturated month
  // hue dominates the lower band. NOT baked into the background.
  // WAVE TINT (bg-fix-v2): the wave is SILVERY -- it adds near-white light, not a
  // hardcoded blue. The correctly-decoded RPCS3 capture shows the green-month
  // wave is silvery/white with NO blue cast; any "blue top" is just the month's
  // own dark-saturated hue at the top of the gradient, not a wave tint. The old
  // c[23]=(0.651,0.759,1.000) pale cyan-blue tint forced a fake blue ribbon.
  // Use a neutral silver so the wave reads as light over whatever month hue.
  vec3 silkTint = vec3(0.96, 0.97, 1.00);  // silvery near-white (tiny cool bias)
  // Boosted so the silvery ribbon matches real's peak luminance (real ribbon
  // sits ~45-65 above the background). Still thin/wispy/translucent.
  return silkTint * acc * 0.42 * uWaveFade;
}

uniform sampler2D uMonthlyTex1Day;
uniform sampler2D uMonthlyTex2Day;
uniform sampler2D uMonthlyTex1Night;
uniform sampler2D uMonthlyTex2Night;
uniform float uMonthTime;
uniform float uNightBrightness;
uniform float uNightDayBlend;
uniform float uTime;
uniform vec2 uPerturb;
uniform sampler2D uWaveProfile;
// Per-month "Original" gradient base color (EMPIRICAL). uMonthBaseColor holds
// the measured per-month hue/sat at the day/night-blended value (computed in JS
// from MONTH_GRADIENT). When uUseMonthBase >= 0.5 the steady gradient is driven
// from this color instead of the raw month_bg textures, so May reads teal, Aug
// violet, Jan gold, etc., matching the empirical captures.
uniform vec3 uMonthBaseColor;
// Bottom-of-screen per-month color. For most months this equals uMonthBaseColor
// (the gradient hue is vertically constant). A few months (July: cyan top -> blue
// bottom) have a genuine vertical HUE/VALUE gradient the videos show, so the steady
// background lerps top->bottom between these two anchors by screenY.
uniform vec3 uMonthBaseColorBot;
uniform float uUseMonthBase;
// Theme system uniforms. uBgMode: 0=Original (monthly gradient),
// 1=Theme (same as Original for this build), 2=Classic (solid PS3 blue).
// uColorTint: c[23] tint vec3 - modulates monthly gradient toward the user's
// Color choice when in Original/Theme modes; ignored for Classic.
uniform int uBgMode;
uniform vec3 uClassicBgColor;
uniform vec3 uColorTint;
// uHSVStrength: 0 = leave gradient hue untouched (Color == Original, so the
// monthly gradient passes through and varies by date as on a real PS3),
// 1 = full HSV rotation toward uColorTint (Plum/Aqua/etc.). Mixed in main()
// so non-zero values let the user later add a slider without further shader
// edits.
uniform float uHSVStrength;
// uBootBrightness: coldboot1->coldboot2 gradient ramp. During the boot intro
// this drives the SAME FS_BG gradient from near-black (coldboot1) up to the
// full XMB gradient (coldboot2), so the hand-off at 6000ms is seamless. It is
// 1.0 (no effect) once the intro is done. See boot_spec.md section 1
// (Background gradient table, 4800-6000 ms ramp).
uniform float uBootBrightness;
// uBootRadial: center-first bloom weight (0 = uniform exposure, >0 = the
// screen center is over-exposed before the corners, matching the captured
// center-out whiteout f50-57). Multiplies a radial falloff into the exposure.
uniform float uBootRadial;
// uBootBgActive: 1 while the boot intro owns the background (logo + bloom +
// warning). When active the monthly day/night gradient is REPLACED by the
// near-black coldboot1 plum gradient (top ~0,0,0, a faint plum toward the
// wave low on screen), exposure-driven by uBootExposure so the dark scene can
// bloom to a true full-white peak. 0 once the intro ends (steady XMB).
uniform float uBootBgActive;
// uBootSweep: left-to-right reveal phase (0 = nothing lit, 1+ = whole frame
// lit). The coldboot background+wave come alive LEFT-FIRST: at a given sweep
// phase the left of the screen reaches full fade before the right. This is the
// moyou/gaia coldboot1->coldboot2 brightening that gives real.mp4 its L->R
// feel (the LOGO itself fades uniformly -- see logo_firmware_forensics.md).
uniform float uBootSweep;
// uBootExposure: linear exposure multiplier on the coldboot1 dark plum
// gradient during boot. 0 -> black; ~1 -> dim plum; high -> blooms to white
// in the HDR composite. Only consulted when uBootBgActive > 0.5.
uniform float uBootExposure;
// uBootExposureBottom: the same 0..1 reveal fade but for the BOTTOM of the
// frame. On real.mp4 the gradient reveals BOTTOM-FIRST -- the lower screen is
// always ~1.3x the top's luminance throughout the slow fade-up. uBootExposure
// is the TOP fade factor; uBootExposureBottom is the (larger) BOTTOM fade
// factor; the shader lerps between them by vUV.y so the reveal is bottom-led.
// Both reach 1.0 at the plateau so the steady hand-off is still a no-op.
uniform float uBootExposureBottom;
// uBootWhiteout: 0..1 flat whiteout flood added during the peak so the WHOLE
// frame (top corners included) clips to pure 255, not just the lit lower band.
uniform float uBootWhiteout;
// uBootTopLift: 0..1. Raises the dark-gradient vGrad floor so the bloom fills
// the WHOLE frame (top included) with magenta during the f38-f64 bloom, then
// the warning drops it back to 0 (near-black top). Early boot = 0 (black top).
uniform float uBootTopLift;
// uBootWaveGain: emission gain for the smooth screen-space boot wave band
// (drawn here in FS_BG so it has NO mesh facets / scanlines).
uniform float uBootWaveGain;
// uBootBandBloom: 0..1 downward white bloom of the band. 0 in early boot (thin
// dim streak on black, lower screen stays black) -> 1 during the warning/peak
// (band blooms white downward, real warning f80 lower = blown white).
uniform float uBootBandBloom;
// uBootLitScene: 0..1 cross-fade factor for the fixed LIT coldboot scene. 1.0
// throughout the boot intro (gradColor is the near-white BACKGROUND.mnu lit
// scene, NOT the monthly/time-of-day gradient); the JS ramps it to 0.0 at the
// XMB settle hand-off so the date-driven monthly gradient takes over only once
// settled. 0.0 in steady state (no effect).
uniform float uBootLitScene;

// ---------------------------------------------------------------------
// HSV ROTATION BLOCK -- ported from PS3 firmware back_colours0 fragment
// shader (538 ARB instructions, hash 0x488d79cb84616a06).
//
// The firmware shader samples the monthly gradient texture (May = green)
// and runs an HSV rotation block that replaces the gradient's hue with
// the user-selected Color tint (c[23] in the firmware constant buffer,
// uColorTint here). The gradient's luminance and saturation structure
// is preserved so the vertical day/night ramp still reads correctly.
//
// The 538-instruction port was previously preserved at git commit
// 0ccaaa6 / 1104783 ("Port back_colours0 firmware shader (538
// instructions) to WebGL GLSL"). The full port was too heavy and added
// noise / Gaussian / sigmoid chains that are only relevant for the boot
// animation. This is the core HSV rotation distilled from that port.
//
// rgb2hsv / hsv2rgb match the ARB MINR/MAXR/SGEH structure of the
// firmware FP. The hue blending is the same "hue from tint, S/V from
// gradient" composition documented in
// /work/ps3/xmb-ref/wave_color_purple_notes.md.
// ---------------------------------------------------------------------
vec3 rgb2hsv(vec3 c) {
  // ARB MINR/MAXR to find min/max components.
  float cmin = min(c.r, min(c.g, c.b));
  float cmax = max(c.r, max(c.g, c.b));
  float delta = cmax - cmin;

  float h = 0.0;
  if (delta > 0.0) {
    // ARB sector selection via SGTH/SLTH H4.
    float dr = (cmax - c.r) / delta;
    float dg = (cmax - c.g) / delta;
    float db = (cmax - c.b) / delta;
    if (c.r >= cmax) {
      h = db - dg;
    } else if (c.g >= cmax) {
      h = 2.0 + dr - db;
    } else {
      h = 4.0 + dg - dr;
    }
    h = h / 6.0;
    if (h < 0.0) h += 1.0;
  }
  float s = (cmax > 0.0) ? delta / cmax : 0.0;
  float v = cmax;
  return vec3(h, s, v);
}

vec3 hsv2rgb(vec3 hsv) {
  float h = hsv.x;
  float s = hsv.y;
  float v = hsv.z;
  float hh = h * 6.0;
  float ff = hh - floor(hh);
  // ARB MULR p/q/t setup.
  float p = v * (1.0 - s);
  float q = v * (1.0 - s * ff);
  float t = v * (1.0 - s * (1.0 - ff));
  // ARB SGEH H7/H8/H5/H6/H4 sector selection.
  vec3 rgb;
  if (hh < 1.0)      rgb = vec3(v, t, p);
  else if (hh < 2.0) rgb = vec3(q, v, p);
  else if (hh < 3.0) rgb = vec3(p, v, t);
  else if (hh < 4.0) rgb = vec3(p, q, v);
  else if (hh < 5.0) rgb = vec3(t, p, v);
  else               rgb = vec3(v, p, q);
  return rgb;
}

// applyHSVRotation: the back_colours0 hue replacement. Takes the
// monthly gradient color and the user tint, returns a color with:
//   - hue from the tint (so Plum -> purple regardless of month)
//   - saturation = blend of gradient and tint saturation (preserves
//     the May green's vividness while pulling toward the tint's
//     saturation level)
//   - value = gradient luminance scaled to tint brightness (keeps the
//     top-dark / bottom-bright structure of the monthly PNGs)
// This composition is what the 538-instruction shader effectively
// computes after its noise/Gaussian preamble cancels out at the final
// MADR R0, R0, 0.0, R3 (multiply by 0).
vec3 applyHSVRotation(vec3 gradColor, vec3 tint) {
  vec3 gradHSV = rgb2hsv(gradColor);
  vec3 tintHSV = rgb2hsv(tint);

  // Hue: take from tint. This is the firmware's hue rotation.
  float newH = tintHSV.x;

  // Saturation: blend gradient saturation with tint saturation. The
  // firmware mixes via 0.6 colorWeight constant (see ARB line ~496);
  // 0.65 here matches the captured RPCS3 wave deep purple at
  // /work/ps3/wave_frames/frame_010.png while keeping the gradient's
  // vertical falloff readable.
  float newS = mix(gradHSV.y, tintHSV.y, 0.65);

  // Value: use gradient luminance scaled by tint brightness. The
  // firmware multiplies by c[32].w (= 0.698 brightness) at the
  // compositor stage; we approximate by mixing gradient V toward tint V.
  // 0.35 weighting preserves the day/night dimming.
  float gradLuma = dot(gradColor, vec3(0.299, 0.587, 0.114));
  float tintLuma = dot(tint, vec3(0.299, 0.587, 0.114));
  float newV = mix(gradLuma, gradLuma * (tintLuma / max(gradLuma, 0.001)), 0.35);
  newV = clamp(newV, 0.0, 1.5);

  return hsv2rgb(vec3(newH, newS, newV));
}

// enrichHDR: portable (LDR, no EXT_float_blend) emulation of the firmware HDR
// glare/tonemap/exposure pipeline (back_colours/HDR.mnu) that gives the real
// PS3 gradient its rich, SATURATED, glowing look. We removed the WebGL float
// HDR path (it tripped the EXT_float_blend GPU crash), which left the steady
// gradient flat and DESATURATED vs real. This restores the vivid look on the
// GPU-portable path by:
//   1) boosting SATURATION about the per-pixel luma (so May purple reads vivid,
//      not washed grey) -- measured real steady gradient sits at HSV S~0.47 vs
//      the old web S~0.24, so we roughly double the chroma;
//   2) a gentle S-curve CONTRAST about the gradient midpoint for the HDR "pop"
//      (deepens the dark top, lifts the lit bottom) WITHOUT raising overall
//      brightness -- the curve is luma-preserving at the pivot;
//   3) a small chroma-weighted glow that only brightens already-saturated
//      regions, mimicking the HDR glare on the lit lower band.
// It deliberately does NOT lift mean brightness (we just fixed an over-bright
// regression): the contrast curve is symmetric about the pivot so darks fall as
// much as lights rise, and saturation boost preserves luma by construction.
vec3 enrichHDR(vec3 c) {
  // Saturation boost about luma. ~1.85 roughly doubles chroma to hit real's
  // S~0.47 from the web's S~0.24, restoring the vivid per-month hue.
  float lum = dot(c, vec3(0.299, 0.587, 0.114));
  vec3 sat = lum + (c - lum) * 1.55;
  // Luma-preserving S-curve contrast for the HDR "pop". Pivot at the gradient's
  // working midpoint (~0.5 linear). smoothstep-style curve deepens shadows and
  // crisps highlights symmetrically so MEAN brightness is unchanged.
  float L = clamp(dot(max(sat, 0.0), vec3(0.299, 0.587, 0.114)), 0.0, 1.0);
  float pivot = 0.5;
  float curved = L + (L - pivot) * 0.35 * (1.0 - abs(L - pivot) * 2.0);
  curved = clamp(curved, 0.0, 2.0);
  vec3 outc = sat * (curved / max(L, 0.001));
  // Chroma-weighted glow: a tiny additive lift ONLY where the pixel is already
  // saturated (the lit hue band), emulating HDR glare without washing the darks
  // or raising the flat-grey regions.
  float chroma = clamp(length(outc - dot(outc, vec3(0.299,0.587,0.114))) , 0.0, 1.0);
  outc += outc * chroma * 0.12;
  // Pre-tonemap value lift. The downstream composite tonemap
  // (1 - exp2(-scene * expo/white)) is CONCAVE: at the low linear values FS_BG
  // emits it lifts the small (green) channel of a purple disproportionately,
  // DESATURATING the hue and skewing it toward blue, and lands the gradient far
  // darker than real (web V~0.34 vs real V~0.49). Lifting the linear scene value
  // moves the pixel up into the tonemap's more-linear region, which BOTH
  // restores the measured value to real's level AND preserves the purple hue /
  // saturation through the composite. This is NOT an over-brighten: it targets
  // real.mp4's measured steady V, and the contrast curve above keeps the
  // dark-top / bright-bottom structure intact.
  outc *= 0.86;
  return max(outc, 0.0);
}

void main() {
  vec2 gradUV = vec2(0.5, 1.0 - vUV.y);

  vec4 tex1Day = texture2D(uMonthlyTex1Day, gradUV);
  vec4 tex2Day = texture2D(uMonthlyTex2Day, gradUV);
  vec4 tex1Night = texture2D(uMonthlyTex1Night, gradUV);
  vec4 tex2Night = texture2D(uMonthlyTex2Night, gradUV);

  // R/G SWAP (bg-fix-v2): the month_bg_*.png textures were extracted with the
  // autodump-bin channel mapping [1,2,3], but the RPCS3 SCREENSHOT buffer (the
  // true on-screen color) is [2,1,3] -- R and G are swapped relative to these
  // textures. Sampling them raw rendered September salmon/magenta instead of the
  // real GREEN (H~110). Swapping R<->G at the sample makes the rendered per-month
  // hue match the correctly-decoded RPCS3 capture (sat_blue_capture/xmb_home.png
  // green H110, and the per-month frames_rgfix reference). See bg_fix_v2.md.
  tex1Day.rgb  = tex1Day.rgb.grb;
  tex2Day.rgb  = tex2Day.rgb.grb;
  tex1Night.rgb = tex1Night.rgb.grb;
  tex2Night.rgb = tex2Night.rgb.grb;

  vec3 dayColor = mix(tex1Day.rgb, tex2Day.rgb, clamp(uMonthTime, 0.0, 1.0));
  vec3 nightColor = mix(tex1Night.rgb, tex2Night.rgb, clamp(uMonthTime, 0.0, 1.0));

  vec3 gradColor = mix(dayColor, nightColor, uNightDayBlend);
  gradColor = mix(gradColor, gradColor * uNightBrightness, uNightDayBlend);

  // FIRMWARE PIPELINE (back_colours_pipeline.md S2/S7, replaces the measured
  // single-anchor shortcut of commit 49c2843):
  //   field = cornerLum(x,y) * lerp(monthTexA, monthTexB, blendW)
  // gradColor above already IS lerp(monthTexA, monthTexB, uMonthTime) with the
  // day/night DDS set chosen by uNightDayBlend -- the JS binds the CURRENT
  // month into tex1 and the NEXT month into tex2, so uMonthTime = (day-1)/
  // (daysInMonth-1) reproduces the empirical within-month progression
  // (May green d01 -> desaturated d15 -> June purple d28). The texture carries
  // the ENTIRE hue + the full vertical chroma profile; we do NOT flatten it to
  // one anchor. uUseMonthBase is forced to 0 from JS for all non-classic modes
  // so this is the active path; the flat anchor branch is retained only as a
  // dead fallback.
  bool useMonthBase = (uUseMonthBase >= 0.5);
  if (useMonthBase) {
    // Confine the bottom anchor to the lower edge only: the vertical-gradient
    // months (July) are DOMINANTLY the top color (cyan) across the screen, with
    // the deep-blue bottom appearing just below the menu row. A full 0..1 mix
    // spread the dark color across the whole lower half (wrong); restrict it to
    // screenY > ~0.7 so most of the screen keeps the top color.
    gradColor = mix(uMonthBaseColor, uMonthBaseColorBot, smoothstep(0.70, 1.0, 1.0 - vUV.y));
  }

  float screenY = 1.0 - vUV.y;

  // FIRMWARE cornerLum: bilinear interpolation of the 4 BACKGROUND.mnu corner
  // greys -- TL/TR = (1,1,1) white, BL = (0.8473,0.8462,0.8464),
  // BR = (0.9249,0.9226,0.9229). This is the VALUE/vignette structure ONLY
  // (R~=G~=B, never hue); it modulates luminance of the month texture.
  // back_colours_pipeline.md S2(a)/S7 Layer A. xn=0 left, 1 right; screenY=0
  // top, 1 bottom.
  float xn = clamp(vUV.x, 0.0, 1.0);
  vec3 cTL = vec3(1.0, 1.0, 1.0);
  vec3 cTR = vec3(1.0, 1.0, 1.0);
  vec3 cBL = vec3(0.847347, 0.846155, 0.846448);
  vec3 cBR = vec3(0.924870, 0.922603, 0.922933);
  vec3 cTop = mix(cTL, cTR, xn);
  vec3 cBot = mix(cBL, cBR, xn);
  vec3 cornerLum = mix(cTop, cBot, screenY);
  // vis kept for the wave headroom multiply lower down (legacy name).
  float vis = 1.0;

  // STEADY "Original" background: the firmware drives this from the CURRENT
  // month's gradient texture (per-month hue: May green, June purple, etc.)
  // blended only DAY<->NIGHT by the live clock. gradColor above already does
  // exactly that: the JS loader binds the CURRENT month into BOTH tex1 and tex2
  // (day and night), so mix(tex1,tex2,monthTime) is a no-op and NO cross-month
  // hue blend can occur. That cross-month blend (current month into tex1, NEXT
  // month into tex2, faded by monthTime) was the desaturation root cause: near
  // a month boundary it mixed two opposite hues (e.g. May green + June purple)
  // in RGB, collapsing saturation to a washed grey. With the discrete binding
  // that is gone, so the steady Original gradient is the saturated per-month
  // gradient again (replacing commit 8292979's hardcoded purple override).
  //
  // FIRMWARE MODEL: the gradient VALUE/STRUCTURE (enrichHDR + vertical envelope +
  // top-corner vignette) is shaped here for ALL colors, then the HUE is replaced
  // by the theme tint via HSV below. Since the hue is now ALWAYS theme-driven
  // (default = plum), this luminance-shaping block runs unconditionally -- it sets
  // up the V (luminance) that applyHSVRotation preserves while swapping the hue.
  if (!useMonthBase) {
    // STRUCTURE (bg-fix-v2): the correctly-decoded RPCS3 capture
    // (sat_blue_capture/xmb_home.png, September) shows the monthly gradient is
    // DARK + MOST-SATURATED at the TOP and BRIGHT + LESS-SATURATED at the
    // BOTTOM -- a vertical VALUE ramp with saturation falling as value rises:
    //   TOP    y30   H110 S0.56 V0.12
    //   MID    y430  H111 S0.43 V0.23
    //   BOTTOM y1010 H108 S0.38 V0.44
    // The raw 64x32 month texture is nearly FLAT in value (V~0.7-0.83) and
    // carries the wrong polarity, and the old cornerLum was WHITE at the top
    // (1,1,1) which washed the top corners bright -- the opposite of real.
    // So we keep ONLY the texture's HUE (and a small per-row chroma cue) and
    // impose the measured vertical value+saturation envelope ourselves.
    //
    // screenY: 0 = top, 1 = bottom.
    vec3 gHSV = rgb2hsv(gradColor);
    // VALUE ramp (bg-final): the correctly-decoded RPCS3 capture
    // (sat_blue_capture/xmb_home.png, September) measures TOP V0.12 and
    // BOTTOM V0.36 -- DARKER than the old web (top V0.19, bottom V0.53) at
    // BOTH ends. Lower both ends of the linear-value ramp so that AFTER the
    // downstream exposure (*1.05) + luma Reinhard shoulder + wave add the
    // on-screen value lands on real (top ~0.12, bottom ~0.36). The bottom must
    // NOT wash out: it is pulled down hard (0.94 -> 0.56) so the lower band
    // keeps its saturation instead of blowing toward grey/white.
    // A mild gamma on screenY keeps the upper band dark for longer (the real
    // gradient stays dark through the top third, brightening into the lower half).
    float vRamp = mix(0.078, 0.49, pow(screenY, 0.92));
    // SATURATION ramp (bg-final): MORE saturated than the old web at both ends
    // -- real Sep is TOP S0.57 (dark, saturated) -> BOTTOM S0.41 (brighter,
    // still saturated). The downstream luma Reinhard DESATURATES the brighter
    // bottom more than the dark top, so the pre-tonemap ramp is set above the
    // target (top 0.72 -> on-screen ~0.57; bottom 0.60 -> on-screen ~0.41) to
    // pre-compensate that wash and keep the bottom from desaturating to grey.
    float sRamp = mix(0.66, 0.55, screenY);
    // Preserve the texture's own chroma where it differs (e.g. Jan/Dec grey
    // anchors read S~0): scale the measured ramp by how saturated the texture
    // is, so a grey month stays grey instead of being forced colourful.
    float texSat = clamp(gHSV.y / 0.6, 0.0, 1.0);
    float outS = sRamp * texSat;
    // Night collapses value toward black; the cornerLum bottom-corner vignette
    // (BL 0.847, BR 0.925) is folded in as a gentle luminance-only modulation.
    float vCorner = mix(mix(0.847, 0.925, xn), 1.0, 1.0 - screenY);
    float outV = vRamp * mix(1.0, vCorner, 0.4);
    gradColor = hsv2rgb(vec3(gHSV.x, outS, outV));
    // Day/night: the ramp above is the DAY target; night dims it down. The JS
    // sets uNightDayBlend (0 day, 1 night) and uNightBrightness; fold the night
    // dimming in as a pure value scale so the hue/structure stay correct.
    gradColor *= mix(1.0, 0.42, uNightDayBlend);
  }

  // MONTH-BASE structure: the empirical per-month color already carries the
  // correct hue/sat/value, so we apply only the vignette STRUCTURE (corners
  // ~1.0 top, ~0.847/0.925 bottom) without the texture-tuned value lifts. A
  // gentle vertical envelope brightens the lower screen slightly and darkens
  // the top corners, matching the measured corner ratios. Day/night value is
  // already folded into uMonthBaseColor; night thus collapses brightness with
  // hue preserved (top reads near-black at night because the base value is low).
  if (useMonthBase) {
    // /work/realxmb SATURATION COMPENSATION: the downstream composite tonemap
    // (concave) compresses the dominant channel of a saturated color more than the
    // dim channels, desaturating the gradient (measured loss: Apr anchor S0.78 ->
    // on-screen 0.53, Nov 0.65 -> 0.47). Re-saturate about luma here so the
    // on-screen S lands on the video target. Achromatic months (Dec, S~0) are
    // untouched because chroma is ~0.
    {
      float lumS = dot(gradColor, vec3(0.299, 0.587, 0.114));
      gradColor = lumS + (gradColor - lumS) * 1.25;
      gradColor = max(gradColor, 0.0);
    }
    // EMPIRICAL vertical structure (boot/permonth_date.md, section B). Measured
    // normalized V profile, top->bottom (screenY 0=top, 1=bottom): bright top
    // (~0.96), gently darkening to a DARK BAND centered ~0.78 down (the menu row,
    // norm V ~0.68), then brightening back to a bright, saturated colored BOTTOM
    // band (~0.95). The old mix(1.0,1.05,screenY) was nearly flat -- this is the
    // real dark-mid / colored-bottom structure that the web was missing.
    // Build it as: bright baseline minus a Gaussian dip at the dark band. The
    // dark band sits at the menu/icon row (~0.66 down); the COLORED lower band
    // below it (where L_lower is measured) stays bright and saturated. Dip is
    // narrow so it does not pull the bright lower band or the bright top down.
    float dip = exp(-pow((screenY - 0.68) / 0.14, 2.0)); // 1.0 at band, ->0 away
    float vEnvM = 1.05 - 0.26 * dip;
    // Soft bright top highlight (real top band is the brightest, norm ~1.0).
    vEnvM *= 1.0 + 0.05 * smoothstep(0.30, 0.0, screenY);
    // Mild lift at the very bottom (colored glow band).
    vEnvM *= 1.0 + 0.06 * smoothstep(0.85, 1.0, screenY);
    gradColor *= vEnvM;
    // The dark band is also where saturation PEAKS on the real captures (mid-band
    // S up to ~0.92 vs top ~0.75). Boost chroma in the dark band so it reads as a
    // rich saturated stripe, not a flat darkening.
    {
      float lumM = dot(gradColor, vec3(0.299, 0.587, 0.114));
      gradColor = lumM + (gradColor - lumM) * (1.0 + 0.22 * dip);
    }
    // Horizontal vignette: edges ~12% darker and a touch more saturated than
    // center (real left edge V~0.49 vs center ~0.59; left darker than right).
    {
      float dxm = vUV.x - 0.52;                 // hotspot just right of center
      float hV = 1.0 - 0.30 * dxm * dxm * (dxm < 0.0 ? 1.6 : 1.0); // left falls more
      gradColor *= hV;
    }
    // Bottom-corner darkening (BL 0.847, BR 0.925 relative to bottom-center).
    {
      float dxm = (vUV.x - 0.5);
      float botEdge = clamp(screenY * (abs(dxm) * 2.0), 0.0, 1.0);
      float sideM = mix(0.847, 0.925, smoothstep(-0.5, 0.5, dxm)); // left darker
      gradColor *= mix(1.0, sideM, botEdge);
    }
    // Top-corner darkening: real top corners drop to ~0.57-0.65x of top-center.
    {
      float dxm = (vUV.x - 0.5);
      float dyTopM = (1.0 - screenY);
      float cornerM = clamp(pow(dyTopM, 1.5) * (abs(dxm) * 2.0), 0.0, 1.0);
      float sideC = mix(0.88, 1.0, smoothstep(0.0, 0.5, dxm)); // left corner darker
      gradColor *= 1.0 - 0.40 * cornerM * sideC;
    }
  }

  // NIGHT TOP: the base night gradient top is already near-black (~10,10,13),
  // close to the real f200 night top (18,18,24). A tiny lift keeps it from
  // reading as pure black while staying dark; daytime (blend 0) is untouched.
  // /work/realxmb NIGHT STRUCTURE: the night videos (h0/h21) show the TOP going
  // PURE BLACK while the BOTTOM band retains its dim saturated color. A flat dim
  // color is wrong; impose a night-only vertical value ramp that crushes the top
  // toward black and keeps the lower colored band. Day (uNightDayBlend 0) is a
  // no-op so the daytime fit is untouched.
  {
    // SMOOTH vertical night darkening (screenY 0=top .. 1=bottom). A long, even
    // top->bottom ramp - NOT a short hard crush. The TOP darkens toward a dark
    // SHADE of the primary colour (a deep, near-black tint only at FULL night;
    // at Evening it is merely the darkest shade of the colour, never pure black).
    // The BOTTOM barely changes with time of day - only slightly dimmer at night.
    // Black(top) -> colour(bottom) gradient at ALL times of day. The BOTTOM
    // colour is identical regardless of time (botMul = 1.0); only HOW FAR the
    // black reaches down the screen changes: a small black cap at the top by day,
    // progressively extending downward toward night. Controlled by the ramp
    // exponent (higher = black holds longer before easing into colour).
    float exillum = mix(1.15, 3.4, uNightDayBlend);      // day shallow -> night deep
    float v = pow(screenY, exillum);                     // 0 top -> 1 bottom (colour)
    // Top darkness depends on time: by DAY the top is only mildly darkened (much
    // less black); toward NIGHT it deepens to ~pure black. Bottom stays full
    // colour at all times.
    float topMul = mix(0.30, 0.02, uNightDayBlend);
    gradColor *= mix(topMul, 1.0, v);
  }

  // ---- BOOT LIT EXPOSURE (coldboot scene is the PRIMARY COLOR, brightened) ----
  // The real PS3 cold-boot background is NOT white: it is the SAME primary-color
  // gradient as steady (the user's MANUALLY CHOSEN color theme if set, otherwise
  // the time-of-day / monthly gradient -- May = purple), just rendered LIT, i.e.
  // at an ELEVATED exposure (the coldboot scene is more brightly illuminated than
  // the settled gradient). uBootLitScene is the boot lift amount: it ramps from a
  // small positive lift during boot down to 0.0 at the settle hand-off, so the
  // exposure NORMALIZES smoothly into the steady primary-color gradient with no
  // pop and the SAME HUE throughout. We brighten gradColor in place here, before
  // the HSV tint / tonemap below, so the manual color choice and the day/night
  // structure are preserved and only the brightness (value) is lifted.
  if (uBootLitScene > 0.0001) {
    // Boot shares the SATURATED HDR look with steady so the lit primary color
    // and the settled gradient match (no hue/saturation pop at the hand-off).
    // Only enrich when the steady branch above did NOT already (named Color
    // themes run their own HSV block and must not be double-saturated).
    if (uHSVStrength >= 0.5) {
      gradColor = enrichHDR(gradColor);
    }
    // SATURATION-PRESERVING boot lift. A plain multiply (gradColor *= 1.85)
    // pushes all channels up equally; the downstream concave tonemap
    // (finalColor / (1 + finalColor*0.30)) then COMPRESSES the brighter
    // channels more than the dim ones, collapsing chroma -> the boot read
    // GREY (measured S~0.16-0.30) instead of the lit-but-saturated PURPLE the
    // real PS3 boot shows (S~0.4-0.5, same hue as steady). To keep the chroma
    // while still lifting brightness:
    //   1) lift VALUE (luma) only, leaving the chroma vector intact;
    //   2) RE-SATURATE about the new (brighter) luma so the purple survives the
    //      brightness lift AND the downstream tonemap wash.
    float lb = clamp(uBootLitScene, 0.0, 1.0);
    // VALUE lift is deliberately MODEST (up to ~1.55x, not 1.85x): the brighter
    // the pixel goes before the downstream concave tonemap
    // (finalColor/(1+finalColor*0.30)), the harder that tonemap compresses the
    // already-bright dominant channel relative to the dim one, which COLLAPSES
    // chroma -> grey. A smaller value lift keeps the boot lit but leaves the
    // pixel in the tonemap's more-linear region where the purple survives.
    float lift = 1.0 + lb * 0.55;            // up to ~1.55x exposure (value)
    float lumB = dot(gradColor, vec3(0.299, 0.587, 0.114));
    vec3 chromaB = gradColor - lumB;         // hue/chroma component, luma-free
    // RE-SATURATE the chroma ABOUT the new luma, and OVER-restore it (chroma gain
    // grows FASTER than the value lift) so the lit-but-saturated purple lands at
    // ~steady saturation (S~0.5) AFTER the tonemap wash, not a washed grey
    // (the old equal lift==satGain measured S~0.41 boot vs 0.50 steady). Up to
    // ~2.1x chroma gain at full lift pre-compensates the tonemap desaturation.
    float satGain = 1.0 + lb * 1.10;
    gradColor = lumB * lift + chromaB * satGain;
    gradColor = max(gradColor, 0.0);
  }

  // === SILK CLOTH SURFACE ===
  // Model a continuous 3D cloth surface with smooth displacement, compute
  // surface normals from the gradient, and apply Fresnel/Phong lighting.
  // The PS3 renders this as overlapping geometry but the visual result is
  // a single smooth translucent veil with light catching the folds.
  float t = uTime;
  float x = vUV.x;

  float perturbY = uPerturb.y * 0.5;
  float perturbX = uPerturb.x * 0.3;

  // Cloth center position (oscillates vertically)
  float groupY = 0.46 + 0.06 * sin(t * 0.5) + perturbY;
  float diagSlope = -0.18 + perturbX;
  float clothCenter = groupY + x * diagSlope;

  // Cloth displacement field: smooth undulating surface
  // Multiple sine waves at different scales create organic cloth folds
  float clothY = screenY - clothCenter;
  float clothHalfWidth = 0.16;

  // Envelope: how much the cloth covers this pixel (0 outside, 1 at center)
  float envelope = smoothstep(clothHalfWidth * 1.3, clothHalfWidth * 0.3, abs(clothY));

  // Surface displacement: creates the 3D fold structure
  // Large folds (cloth draping)
  float fold1 = sin(x * 8.0 + t * 0.8) * 0.5;
  float fold2 = sin(x * 5.0 - t * 0.5 + 1.5) * 0.3;
  float fold3 = cos(x * 12.0 + t * 0.6 + 0.7) * 0.2;
  // Cross-direction ripples (fabric texture)
  float ripple = sin(clothY * 50.0 + fold1 * 8.0 + t * 0.3) * 0.15;
  // Combined surface height
  float height = fold1 + fold2 + fold3 + ripple;

  // Surface normal from displacement gradient (finite differences in screen space)
  float eps = 0.003;
  float clothY_dx = (screenY - (groupY + (x + eps) * diagSlope));
  float fold1_dx = sin((x+eps) * 8.0 + t * 0.8) * 0.5;
  float fold2_dx = sin((x+eps) * 5.0 - t * 0.5 + 1.5) * 0.3;
  float fold3_dx = cos((x+eps) * 12.0 + t * 0.6 + 0.7) * 0.2;
  float ripple_dx = sin(clothY_dx * 50.0 + fold1_dx * 8.0 + t * 0.3) * 0.15;
  float height_dx = fold1_dx + fold2_dx + fold3_dx + ripple_dx;
  float dhdx = (height_dx - height) / eps;

  float clothY_dy = (screenY + eps) - clothCenter;
  float ripple_dy = sin(clothY_dy * 50.0 + fold1 * 8.0 + t * 0.3) * 0.15;
  float height_dy = fold1 + fold2 + fold3 + ripple_dy;
  float dhdy = (height_dy - height) / eps;

  // Surface normal
  vec3 N = normalize(vec3(-dhdx * 0.3, -dhdy * 0.3, 1.0));

  // Lighting: key light from upper-left, fill from right (decompiled 5D220FDA)
  vec3 lightDir = normalize(vec3(0.4, 0.6, 0.8));
  vec3 viewDir = vec3(0.0, 0.0, 1.0);
  vec3 halfVec = normalize(lightDir + viewDir);

  float diffuse = max(dot(N, lightDir), 0.0) * 0.5;
  float specular = pow(max(dot(N, halfVec), 0.0), 30.0) * 0.6;

  // Fresnel: edges of cloth catch more light (rim lighting)
  float fresnel = pow(1.0 - abs(N.z), 3.0) * 0.4;

  // Cloth opacity: thicker in middle, transparent at edges
  float opacity = envelope * (0.35 + 0.15 * (height * 0.5 + 0.5));

  // Final silk brightness
  float silk = (0.3 + diffuse + specular + fresnel) * opacity;

  // Silk color: near-white with slight gradient warmth
  vec3 waveColor = mix(vec3(0.95, 0.93, 0.91), gradColor * 1.2, 0.15);

  // vec3 finalColor = gradColor * vis + waveColor * silk;
  // vec3 finalColor = waveColor * silk; // TEMP: black wallpaper
  // The monthly gradient is the firmware-correct backdrop the wave is drawn on top of.
  // Multiply by vis to keep top of screen darker, leaving room for the wave to read.
  // For the month-base path the empirical value is already carried in gradColor
  // (and shaped by the month-base structure block above), so apply only a gentle
  // vis to leave the wave room without re-darkening the calibrated value.
  float visEff = useMonthBase ? mix(0.92, 1.0, vis) : vis;
  vec3 finalColor = gradColor * visEff;

  // Color theme tint: drive the gradient through the firmware HSV
  // rotation block (ported from back_colours0 538-instruction shader).
  // The hue is taken from the selected Color (c[23] / uColorTint) so
  // Plum reads as purple, Aqua Blue as cyan, etc., regardless of the
  // underlying monthly gradient texture. Saturation and value retain
  // the gradient's day/night vertical structure.
  //
  // When Color is "Original" the JS side sets uHSVStrength = 0 so the
  // raw monthly gradient passes through unrotated. That is the firmware
  // behavior: a real PS3 with Color = Original shows the month-specific
  // hue (May green, June purple, August blue, etc.) without any tint
  // bias. uColorTint still defaults to the daytime c[23] cyan-blue but
  // the mix below ignores it at strength 0.
  if (uBgMode != 2) {
    vec3 rotated = applyHSVRotation(gradColor, uColorTint);
    finalColor = mix(gradColor, rotated, uHSVStrength) * visEff;
  }

  // Classic background mode: solid PS3 blue gradient (firmware vaddr 0x271630
  // = #143CAF). Top darkens, bottom brightens, matching the legacy XMB.
  if (uBgMode == 2) {
    vec3 classicTop = uClassicBgColor * 0.20;
    vec3 classicBot = uClassicBgColor * 1.10;
    finalColor = mix(classicTop, classicBot, screenY);
  }

  // GLOBAL tonemap (back_colours_pipeline.md S3/S7): the firmware tone-maps
  // ONCE, globally in the compositor (HDR.mnu EXPOSURE 1.05), AFTER the
  // additive wave+particles -- NOT per-pixel on the bare gradient. The old
  // per-pixel Reinhard finalColor/(1+0.30*finalColor) compressed the brighter
  // (dominant-hue) channel harder than the dim one, COLLAPSING chroma and
  // washing the month colour to grey. Replace it with a LUMINANCE-ONLY soft
  // shoulder + exposure: scale value by a Reinhard curve on luma alone and

  // light. We must NOT let the bright monthly day/night gradient bleed into
  // the boot. When uBootBgActive, discard gradColor entirely and emit the
  // near-black coldboot1 gradient: top (0,0,0), a faint plum lifting toward

    // zero color/brightness/saturation jump when uBootBgActive is released at

    // before the right (matching real.mp4). uBootSweep advances 0..(1+band);

    // are still dark, with a soft band of width SWEEP_BAND between. At
    // uBootSweep >= 1+band the whole frame is revealed (sweepMask == 1), so the
    // UI hand-off is unaffected. The sweep MODULATES the global fade only; it
    // never exceeds it, so the final state still equals the steady output.

    float sweepMask = clamp((front - vUV.x) / SWEEP_BAND + 1.0, 0.0, 1.0);

    // front reaches it (the whole scene is dimly lit, the left just leads).
    sweepMask = mix(0.35, 1.0, sweepMask);

    // it is fully visible at t=2.0s while the gradient is still black. So the
    // wave must NOT be killed by the gradient fade: fade ONLY the dark plum
    // gradient, then ADD the wave back at its own (uWaveFade-gated) brightness.
    // The wave still rides the L->R sweep so it comes alive left-first.
    vec3 gradOnly = finalColor - waveColorAdd;
    // The wave comes alive almost immediately (real: full-bright ribbon at
    // t=2.0s), so it follows the sweep only weakly -- a high floor (0.8) keeps
    // the ribbon bright across the whole width while the gradient still obeys
    // the left-first sweep underneath it.
    float waveMask = mix(0.8, 1.0, sweepMask);
    // On the BLACK boot scene the ribbon must read as bright as on real.mp4
    // (band peak ~120/255 at t=2-3s) -- on the dark gradient it is not yet
    // sitting on a bright base the way the steady wave is, so give the boot
    // wave a brightness boost that fades out as the gradient lights up (so the
    // hand-off to steady, where waveColorAdd is unboosted, stays seamless).
    float waveBoost = 1.0 + 0.7 * (1.0 - fade);
    gl_FragColor = vec4(gradOnly * fade * sweepMask + waveColorAdd * waveMask * waveBoost, 1.0);
    return;
  }
  gl_FragColor = vec4(finalColor, 1.0);
}`;

  float cmin = min(c.r, min(c.g, c.b));  // MINR R5, R1.y, R1.z; MINR R4, R1, R5.w
  float cmax = max(c.r, max(c.g, c.b));  // MAXR R5, R1, R1.z; MAXR R4, R1.x, R5.y
  float delta = cmax - cmin;              // ADDR R4, R4.w, -R4.x

  // MULR R2, R4.y, 6.0  -- delta * 6

    // SGTH/SLTH H4 -- comparison flags for which component is max
    // ADDR R1, R6, 0.5
    // The ARB computes hue sector offsets:
    // ADDR R5, R1, -R1.y  (r-g sector)
    // ADDR R5, R1.x, -R1.z (different sector)
    // ADDR R2, R1.y, -R1.x
    // Then uses H4 flags to select correct sector
    float dr = (cmax - c.r) / delta;
    float dg = (cmax - c.g) / delta;
    float db = (cmax - c.b) / delta;

      h = db - dg;
    } else if (c.g == cmax) {
      h = 2.0 + dr - db;
    } else {
      h = 4.0 + dg - dr;
    }

    h += 0.5;           // ADDR R1, R6, 0.5

  float v = cmax;

// --- HSV to RGB (matching ARB assembly HSV->RGB with step-based sector selection) ---
vec3 hsv2rgb(vec3 hsv) {
  float h = hsv.x;
  float s = hsv.y;
  float v = hsv.z;

  // ARB: ADDR R5, R2.x, -0.0001; MULR R0, R4.x, 6.0
  float hh = (h - 0.0001) * 6.0;     // constants: -0.0001, 6.0
  float ff = fract(hh);               // FRCR R5, R0.z

  // ARB uses SGEH comparisons against 1,2,3,4,5,6 to determine sector
  // Then builds p, q, t values:
  // MULR R5, R4.w, R5.w  -- p = v * (1-s) setup
  // MULR R4, R5, R5.y    -- q = v * (1 - s*f)
  // ADDR R4, R5.w, -R5.x -- t = v * (1 - s*(1-f))
  float p = v * (1.0 - s);
  float q = v * (1.0 - s * ff);
  float t = v * (1.0 - s * (1.0 - ff));

  // Sector selection using step functions (SGEH H7/H8/H5/H6/H4 in ARB)
  // Each SGEH tests hh >= N, then MADR combines with weighted blending
  vec3 rgb;
  if (hh < 1.0) {
    rgb = vec3(v, t, p);
  } else if (hh < 2.0) {
    rgb = vec3(q, v, p);
  } else if (hh < 3.0) {
    rgb = vec3(p, v, t);
  } else if (hh < 4.0) {
    rgb = vec3(p, q, v);
  } else if (hh < 5.0) {
    rgb = vec3(t, p, v);
  } else {
    rgb = vec3(v, p, q);
  }
  return rgb;
}
