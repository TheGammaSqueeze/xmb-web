  // So gradUV.y = 1 - vUV.y maps correctly:
  //   screen top (vUV.y=0) -> gradUV.y=1 -> texture top (dark in PNG)
  //   screen bottom (vUV.y=1) -> gradUV.y=0 -> texture bottom (bright in PNG)
  // BUT WebGL flips PNGs by default (UNPACK_FLIP_Y_WEBGL)
  // Let me just use vUV directly and handle it
  // WebGL without FLIP_Y: texY=0 maps to PNG BOTTOM (bright for monthly gradients)
  // We want screen BOTTOM (vUV.y=1) to get the bright colors
  // So flip: gradUV.y = 1-vUV.y makes screen bottom -> texY=0 -> PNG bottom (bright)
  vec2 gradUV = vec2(vUV.x, 1.0 - vUV.y);

  // Sample day textures
  vec4 tex1Day = texture2D(uMonthlyTex1Day, gradUV);
  vec4 tex2Day = texture2D(uMonthlyTex2Day, gradUV);
  // Sample night textures
  vec4 tex1Night = texture2D(uMonthlyTex1Night, gradUV);
  vec4 tex2Night = texture2D(uMonthlyTex2Night, gradUV);

  // ---- ARB lines 770-778: Month blending ----
  // ADDR R1, -R2, 0.5  -- offset for blend
  // MULR R3, R3.x, R0.xxyz  -- scale by month progress
  // MADR R0, R3.x, R2, -R3.yzww  -- interpolate between months
  // Blend between current and next month (day)
  vec3 dayColor = mix(tex1Day.rgb, tex2Day.rgb, uMonthTime);
  // Blend between current and next month (night)
  vec3 nightColor = mix(tex1Night.rgb, tex2Night.rgb, uMonthTime);

  // ---- ARB lines 779-785: Day/night blending ----
  // MADR R1, R1.w, R1, R4  -- night/day interpolation
  // MADR R3, R1.w, R0, R3.yzww
  vec3 gradColor = mix(dayColor, nightColor, uNightDayBlend);

  // Apply night brightness
  gradColor = mix(gradColor, gradColor * uNightBrightness, uNightDayBlend);

  // ---- Combine gradient with position-based visibility ----
  // The background gradient fades in from top (black) to bottom (colored)
  // This is a simple linear ramp, NOT from the Gaussians
  // The Gaussians modulate noise/wave perturbation, not the base gradient
  float gradientVisibility = smoothstep(0.3, 0.95, vUV.y);
  vec3 finalColor = gradColor * gradientVisibility;

  // Gaussians add noise perturbation in the wave area
  float noiseStrength = clamp(g1 * 0.5 + g2 * 0.3, 0.0, 1.0);
  finalColor = mix(finalColor, finalColor * (0.85 + 0.3 * noiseColor), noiseStrength * 0.15);

  // ---- ARB line 789: Final output ----
  // MADR R0, R0, 0.0, R3  -- last instruction: R0 = R0 * 0 + R3 = R3
  // The final multiply by 0 zeroes the noise offset, leaving just the gradient
  // This means the shader output IS the blended monthly gradient with tone mapping

  // Direct output - the gradient colors from the monthly textures are already in display range
  // The firmware's tone mapping is for HDR content; our textures are LDR
  gl_FragColor = vec4(finalColor, 1.0);
}`;

// Particle vertex/fragment: per-particle brightness + color are computed
// CPU-side (the spinning-normal Phong specular, exactly as in the firmware /
// the validated sim) and passed as attributes. The VS sizes the point sprite
// (bright glints get a wider glow halo = the threshold glare bloom); the FS
// draws a core+halo profile and outputs premultiplied additive color.
const VS_PARTICLE = `
attribute vec2 aPos;     // NDC position
attribute float aSize;   // point size in pixels (incl. glint glow)
attribute float aBright; // HDR brightness
attribute vec3 aColor;   // tint (iridescent)
attribute float aSpark;  // diffraction-spike sparkle amount
varying float vBright;
varying vec3 vColor;
varying float vSpark;
void main() {
  vBright = aBright;
  vColor = aColor;
  vSpark = aSpark;
  gl_Position = vec4(aPos, 0.0, 1.0);
  gl_PointSize = aSize;
}`;

const FS_PARTICLE = `
precision mediump float;
varying float vBright;
varying vec3 vColor;
varying float vSpark;
void main() {
  vec2 pc = gl_PointCoord * 2.0 - 1.0;
  float d2 = dot(pc, pc);
  if (d2 > 1.0) discard;                                    // ROUND spec
  // round glitter spec: tight SHARP bright core + soft round glow (HDR bloom).
  float core = exp(-d2 * 9.0);                              // sharp round core
  float glow = exp(-d2 * 1.8) * 0.40;                       // soft round bloom
  // diffraction-spike sparkle (4-point cross), scaled per-particle by aSpark so
  // larger/brighter specs get a crisp shiny sparkle (kept sharp, not blurred).
  float cross = (exp(-pc.y*pc.y*70.0) + exp(-pc.x*pc.x*70.0)) * exp(-d2*1.2);
  float spark = cross * vSpark * 0.7;
  float a = (core + glow + spark) * vBright;
  // bright glints blow out toward white (HDR highlight desaturation)
  float hot = clamp(vBright * 0.6 - 0.6, 0.0, 1.0);
  vec3 col = mix(vColor, vec3(1.0), hot);
  gl_FragColor = vec4(col * a, a);                          // premultiplied additive
}`;

// Bloom: horizontal/vertical Gaussian blur
const VS_QUAD = `
attribute vec2 aPos;
varying vec2 vUV;
void main() {
  vUV = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

// === HDR GLARE CHAIN (port of LinesController D9D6DC41 + HDR.mnu) ===
// Bright-pass: per-channel (NOT luminance) so the chromatic glare survives.
// b = max(scene - GLARE_THRESH, 0). Firmware uses precision_clamp + a
// greaterThanEqual(x, c_thresh) gate; max(x-thresh,0) is the port-equivalent.
const FS_BRIGHTPASS = `
precision highp float;
varying vec2 vUV;
uniform sampler2D uTex;
uniform float uGlareThresh;   // GLARE THRESH (0.739 steady / 0.2 boot)
void main() {
  vec3 c = texture2D(uTex, vUV).rgb;
  gl_FragColor = vec4(max(c - vec3(uGlareThresh), 0.0), 1.0);
}`;

// Per-channel separable Gaussian. uRadScale carries the per-channel GAUSSIAN
// RAD (R 1.239 / G 1.432 / B 1.558) so blue blooms widest. 9-tap.
const FS_BLOOM_BLUR = `
precision highp float;
varying vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uDir;          // (1/w,0) or (0,1/h)
uniform vec3 uRadScale;     // per-channel radius multiplier (R<G<B)
void main() {
  float w[5];
  w[0] = 0.227027; w[1] = 0.194595; w[2] = 0.121622; w[3] = 0.054054; w[4] = 0.016216;
  vec3 sum = texture2D(uTex, vUV).rgb * w[0];
  for (int i = 1; i < 5; i++) {
    // Per-channel sample offsets: scale the tap step by the channel's gaussian
    // radius so the three channels blur to different widths (chromatic glare).
    vec2 baseOff = uDir * float(i);
    float r = texture2D(uTex, vUV + baseOff * uRadScale.r).r
            + texture2D(uTex, vUV - baseOff * uRadScale.r).r;
    float g = texture2D(uTex, vUV + baseOff * uRadScale.g).g
            + texture2D(uTex, vUV - baseOff * uRadScale.g).g;
    float b = texture2D(uTex, vUV + baseOff * uRadScale.b).b
            + texture2D(uTex, vUV - baseOff * uRadScale.b).b;
    sum += vec3(r, g, b) * w[i];
  }
  gl_FragColor = vec4(sum, 1.0);
}`;

// Additive accumulate (one glare-pyramid level into the accumulator).
const FS_ADD = `
precision highp float;
varying vec2 vUV;
uniform sampler2D uTex;
uniform float uScale;
void main() {
  gl_FragColor = vec4(texture2D(uTex, vUV).rgb * uScale, 1.0);
}`;

// Final composite: TONEBEFORE=1 firmware order.
//   toned = 1 - exp2(-scene * (EXPOSURE/WHITE) * log2e)   (tonemap base first)
//   glare = pow(glareSum, GLARE_SUM_POW) * GLARE_LEVEL     (shaped, after tone)
//   out   = clamp(toned + glare, 0, 1)                     (hard clip -> whiteout)
// _fetch_constant(142) recombine lerp is folded into the additive GLARE_LEVEL.
const FS_COMPOSITE = `
precision highp float;
varying vec2 vUV;
uniform sampler2D uScene;
uniform sampler2D uGlare;
uniform float uExposure;     // EXPOSURE
uniform float uWhiteLevel;   // WHITE LEVEL
uniform float uGlareLevel;   // GLARE LEVEL
uniform float uGlareSumPow;  // GLARE SUM POW
uniform float uBootRadial;   // boot center-first spatial exposure boost (0 steady)
uniform float uBootWhiteout; // 0..1 boot peak: force the final output to pure white
void main() {
  // SUBTLE composite. The real PS3 XMB boot/steady look is NOT bloomed: the
  // wave is a thin silvery ribbon, the background a soft purple gradient. We
  // deliberately DO NOT add the glare pyramid or any whiteout here -- those
  // produced the over-bloomed magenta/white artifact. This is essentially a
  // gentle exposure passthrough of the LDR scene FBO. uGlare/uBoot* uniforms
  // are retained for binding compatibility but unused.
  vec3 scene = texture2D(uScene, vUV).rgb;
  const float LOG2E = 1.442695;
  vec3 toned = vec3(1.0) - exp2(-scene * (uExposure / max(uWhiteLevel, 1e-3)) * LOG2E);
  gl_FragColor = vec4(clamp(toned, 0.0, 1.0), 1.0);
}`;

// ------ ICON GLASS SHADER ------
// Port of the PS3 XMB icon fragment program (hash 488d79cb84616a06, 38
// variants in /work/ps3/xmb_dump/shaders/fp/). The decompiled FP body is
// 140 lines of fc[]-driven math. We follow the implementation plan at
// /work/ps3/xmb-ref/icon_glass_implementation_plan.md which translates the
// structure to a clean WebGL1-compatible GLSL fragment shader.
//
// Pipeline (matches PS3 hardware):
//   1. tex0 = _NormalMap (per-icon 128x128 RGBA, RG = nx/ny, A = mask)
//   2. tex1 = _AmbMap / _MiscMap (shared 16x12 ambient gradient ramp)
//   3. tex2 = _EnvMap (shared 64x64 matcap, silver/blue sheen)
//   4. tex3 = _BackgroundMap (live downscaled scene = wave + gradient)
//   5. Sample tex3 with chromatic per-channel offsets:
//        R: REFR R = -0.032
//        G: REFR G = -0.038
//        B: REFR B = -0.048
//      (offsets from icons.qrc default day theme .mnu)
//   6. Two specular lobes with pow=100 and pow=30 (SPEC1/SPEC2 POW)
//   7. Fresnel rim ((1 - N.V)^2)
//   8. 1 - exp(-x) HDR tonemap, then tint by vertex _ChangingColor
//   9. Output translucent with SRC_ALPHA / ONE_MINUS_SRC_ALPHA blend so
//      the refracted background shows through (PS3 blend = 770/771).
//
// Material constants are the icons.qrc "day" theme values; cross-referenced
// to the .mnu file at /tmp/icons_decomp.bin offset 0x1600+.

const VS_ICON_GLASS = `
attribute vec2 aPos;
varying vec2 vUV;
varying vec2 vScreenUV;
uniform vec2 uBgCenterUV;   // icon center in waveCanvas UV (0..1)
uniform vec2 uBgRadiusUV;   // icon half-size in waveCanvas UV
void main() {
  // aPos is -1..1; map to 0..1 icon UV
  vUV = aPos * 0.5 + 0.5;
  // Compute the matching screen UV for the background refraction lookup.
  // Each icon pixel samples directly behind itself.
  vScreenUV = uBgCenterUV + aPos * uBgRadiusUV;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const FS_ICON_GLASS = `
precision highp float;
varying vec2 vUV;
varying vec2 vScreenUV;

uniform sampler2D uNormalMap;     // tex0: per-icon 128x128 RGBA normal map
uniform sampler2D uAmbMap;        // tex1: 16x12 ambient gradient ramp
uniform sampler2D uEnvMap;        // tex2: 64x64 silver matcap envmap
uniform sampler2D uBackgroundMap; // tex3: live waveCanvas snapshot (refraction)

// Per-draw geometry uniforms (also declared in VS for vScreenUV).
uniform vec2 uBgRadiusUV;    // icon's UV half-extent on the bg (needed for refraction scaling)

// Material params (from icons.qrc .mnu day theme, see icon_glass_research.md)
uniform vec3  uLight1;       // LIT1 normalized direction (z=22.8, x=-32.4 deg)
uniform vec3  uLight2;       // LIT2 normalized direction (z=60, x=135 deg)
uniform vec3  uAmbient;      // AMB R,G,B = (0.74, 0.80, 0.90) cool blue tint
uniform vec4  uSpecParams;   // (SPEC1 POW=100, SPEC2 POW=30, ATTN1=2, ATTN2=2)
uniform vec3  uRefr;         // REFR R,G,B = (-0.032, -0.038, -0.048) chromatic offsets
uniform float uRefrScl;      // REFR SCL multiplier; .mnu=10 but we map differently
uniform vec2  uAttnDiffEnv;  // (ATTN DIFF=2, ATTN ENV=0.74)
uniform vec4  uChangingColor;// _ChangingColor per-icon tint (default white)
uniform float uGlassMix;     // legacy mix factor (kept for compat, mostly unused)

void main() {
  // ---------------------------------------------------------------------
  // PORT OF FP 488d79cb84616a06 (140-line body, 62 fc[] constants).
  // Mapping notes:
  //   tex0 sample (line 663) -> nm                  (R/G/A used; B reconstructed)
  //   alpha kill (line 664)  -> discard
  //   normal decode (l.669)  -> N
  //   tex3 samples (l.697-704) -> refracted.{r,g,b}, chromatic per channel
  //   tex1 sample (l.739)    -> _MiscMap (ambient ramp)
  //   tex2 sample (l.771)    -> envCol (matcap)
  //   half-vector spec (l.682-688) -> two-lobe Phong
  //   tonemap (l.781-788)    -> 1 - exp(-x), per-channel exposure (fc[57..59])
  //   final tint (l.789)     -> * fc[61].z (kept as a single brightness scale)
  // ---------------------------------------------------------------------

  // STEP 1: sample _NormalMap. R/G = nx/ny, A = mask (alpha test).
  vec4 nm = texture2D(uNormalMap, vUV);
  if (nm.a < 1.0/255.0) discard;

  // STEP 2: decode normal. PS3 FP: h5.xy = (r0 + fc[3].x) * 2 with fc[3].x = -0.5
  // The icon normal maps store unsigned nx,ny in R,G; nz is reconstructed.
  vec2 nxy = nm.rg * 2.0 - 1.0;
  float nxyLen2 = dot(nxy, nxy);
  float nz = sqrt(max(0.0, 1.0 - nxyLen2));
  vec3 N = vec3(nxy, nz);

  // View vector. PS3 FP builds h4 from icon UV; for our orthographic-ish
  // billboard, use a near-orthographic V with a small perspective skew so
  // the matcap responds to icon position.
  vec3 V = normalize(vec3((vUV - 0.5) * -0.3, 1.0));

  // Half vectors and dot products for two lights (Blinn-Phong).
  vec3 H1 = normalize(V + uLight1);
  vec3 H2 = normalize(V + uLight2);
  float NdotH1 = max(dot(N, H1), 0.0);
  float NdotH2 = max(dot(N, H2), 0.0);
  float NdotV  = clamp(dot(N, V), 0.0, 1.0);

  // STEP 3: CHROMATIC REFRACTION (PS3 FP lines 696-704, three TEX2D(3,...))
  // Each channel samples the background at a slightly different UV. The
  // displacement direction is the in-plane normal nxy; the offset MAGNITUDE
  // comes from the REFR R/G/B .mnu values (negative -> sample "inward"
  // from the icon edge).
  //
  // PS3 source: refrDir is derived from the perturbed UV (h3.zw), scaled
  // by fc[13/14/15] which are the REFR offsets. The PS3 REFR offsets are in
  // icon-local UV (0..1 across the icon's UV space). For the web port we
  // convert them to screen-UV space by multiplying by 2x the icon's UV
  // radius, so the chromatic dispersion is proportional to icon size. The
  // refrScl multiplier (typically 1.0 here) lets us boost the effect for
  // stronger visible distortion.
  vec2 iconUVScale = uBgRadiusUV * 2.0; // icon's UV span on the bg
  vec2 refrDir = nxy * uRefrScl * iconUVScale;
  vec2 uvR = vScreenUV + refrDir * uRefr.r;
  vec2 uvG = vScreenUV + refrDir * uRefr.g;
  vec2 uvB = vScreenUV + refrDir * uRefr.b;
  float bgR = texture2D(uBackgroundMap, clamp(uvR, vec2(0.0), vec2(1.0))).r;
  float bgG = texture2D(uBackgroundMap, clamp(uvG, vec2(0.0), vec2(1.0))).g;
  float bgB = texture2D(uBackgroundMap, clamp(uvB, vec2(0.0), vec2(1.0))).b;
  vec3 refracted = vec3(bgR, bgG, bgB);

  // STEP 4: AMBIENT (cool blue tint per .mnu, modulated by ambient ramp).
  // The PS3 FP samples _MiscMap (tex1) with the icon UV; we use the
  // upward-facing normal Y to pick a row from the small ramp.
  float ambUVy = clamp(N.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 ambSample = texture2D(uAmbMap, vec2(0.5, ambUVy)).rgb;
  // Tint: ambSample modulates the cool-blue uAmbient color
  vec3 ambient = uAmbient * (0.5 + 0.5 * ambSample);

  // STEP 5: ENVMAP (matcap). PS3 FP samples tex2 with the perturbed
  // normal mapped 0..1. We use the standard matcap convention.
  vec2 envUV = N.xy * 0.5 + 0.5;
  vec3 envCol = texture2D(uEnvMap, envUV).rgb * uAttnDiffEnv.y;

  // STEP 6: TWO SPECULAR LOBES (sharp + broad, both pre-tonemap).
  float spec1 = pow(NdotH1, uSpecParams.x) * uSpecParams.z;
  float spec2 = pow(NdotH2, uSpecParams.y) * uSpecParams.w;
  vec3 spec = vec3(spec1 + spec2);

  // STEP 7: FRESNEL rim ((1 - N.V)^2). Brightens silhouette edges.
  float fres = pow(1.0 - NdotV, 2.0);

  // STEP 8: COMPOSITE.
  //
  // The PS3 composite is essentially:
  //   final_brightness = ambient_tint * env_contribution + spec_lobes + rim
  //   final_color      = refracted_bg + final_brightness   (additive)
  //   tonemapped       = 1 - exp(-final_color * exposure)
  //
  // So the REFRACTED BACKGROUND is the dominant color (icon picks up the
  // surrounding gradient/wave), and the lighting terms ADD on top to make
  // the highlights and ambient tint pop. This is what gives the icon its
  // glass-like, translucent character.
  //
  // CRITICAL: the PS3 FP applies its output through real GL_BLEND src=SRC_ALPHA
  // dst=ONE_MINUS_SRC_ALPHA. The shader's alpha output is a CONSTANT (taken
  // from the per-draw uniform), not the normal-map alpha. The normal-map's
  // alpha is only used for the early _kill() discard test. This means the
  // icon body has a UNIFORM partial opacity, and the actual framebuffer pixel
  // is a blend of the lit surface with the underlying scene. That's why the
  // PS3 captures show clear glass-like translucency where the scene shows
  // through the icon body.
  //
  // Web port: we write premultiplied alpha at a SUB-UNITY level so the 2D
  // drawImage compositing reproduces the same translucent overlay. The alpha
  // is modulated by Fresnel: edges become opaque (rim brightening), body
  // stays glass-translucent. This matches the user-observable behaviour on
  // the real PS3 XMB.
  //
  // STRONG GLASS look per user requirements: maximum embossing visibility,
  // strong cool-blue ambient, dominant silver matcap sheen, sharp specular
  // highlights, bright fresnel rim, and visible bg refraction through body.
  //
  // Pre-tonemap inputs (typical ranges for shaded surfaces):
  //   - ambient * 0.55:  0.40..0.55 - cool blue base shows clearly
  //   - envCol * ATTN_DIFF * 0.60:  ~0.45..0.95 - silver matcap dominant
  //   - spec * 1.80:  varies 0..3+ where curvature catches light - SHARP
  //   - vec3(fres) * 0.75:  0..0.75 - bright rim at silhouette edges
  //   - normalDarken: subtle shadow on under-lit sides for stronger relief
  //   - refracted * 0.35:  bg tint visible through body
  //
  // EDGE DARKENING (relief term): subtract a small blue-biased shadow where
  // the surface faces away from the key light, creating darker creases that
  // emphasize 3D form. The blue bias keeps the shadow consistent with the
  // cool ambient palette.
  float shadowFactor = (1.0 - max(dot(N, uLight1), 0.0)) * 0.30;
  vec3 highlights = ambient * 0.55
                  + envCol * uAttnDiffEnv.x * 0.60
                  + spec * 1.80
                  + vec3(fres) * 0.75
                  - vec3(0.0, 0.02, 0.05) * shadowFactor;

  // Refracted bg shows through the icon (multiplier 0.35 keeps the bg
  // clearly visible as a glassy tint while the silver matcap dominates the
  // body color). This is what makes the icon feel like glass over the wave.
  vec3 totalColor = refracted * 0.35 + highlights;

  // STEP 9: HDR tonemap. Exposure 0.95 keeps the dynamic range in [0..0.85]
  // for typical inputs while letting specular peaks push toward (but not
  // saturate to) 1.0. The spec terms can hit ~3.0 pre-tonemap which then
  // tonemaps to ~0.94 - bright but not blown out.
  vec3 surface = vec3(1.0) - exp(-totalColor * 0.95);

  // Final brightness multiplier. PS3 captures show ~1.05-1.1.
  surface = surface * 1.08;

  // STEP 10: apply icon mask alpha plus Fresnel-driven opacity.
  //
  // User-requested STRONG glass: more transparency in the body so the wave
  // bg is clearly visible behind the icons, with bright opaque edges from
  // the rim term. The fresAlpha curve (0.55 body, 0.95 edges) gives this
  // glass-overlay look.
  //
  // Combining: body alpha at 0.55 (was 0.70) makes wave bg show clearly
  // through icon center; rim at 0.95 (was 1.00) keeps a slight glass-edge
  // halo while staying opaque enough to define the icon shape.
  float fresAlpha = 0.55 + 0.40 * fres;   // 0.55 body, ~0.95 at edges
  float alpha = nm.a * fresAlpha * uChangingColor.a;
  surface = surface * uChangingColor.rgb;

  // Premultiplied output (iconGLCanvas premultipliedAlpha:true).
  gl_FragColor = vec4(surface * alpha, alpha);
}`;

// ============================================================================
// PS3SplineReverse pipeline (JS)
// ============================================================================
// Direct port of /work/PlayStation-3-XMB/ps3xmbwave/spline-reverse.js by
// linkev (MIT, copyright 2025 Mart). Reproduces the reverse-engineered SPU
// `spline.elf` flow: synthetic descriptor stream -> per-entry coefficient
// decode -> 0x169-entry table -> 8-iteration kernel -> spline-evaluated
// displacement texture row.
//
// The output is a Float32Array of WxH samples (one luminance scalar per
// texel). This is uploaded to a LUMINANCE FLOAT texture each frame and the
// wave vertex shader samples it for the base height displacement.
//
// Tuning knobs come from PS3_SPLINE_SETTINGS below; they mirror
// linkev/ps3xmbwave/spline-settings.js but seeded with values that line up
// with our firmware-derived constants (LINE1.mnu).
const PS3_SPLINE_SETTINGS = {
  flowSpeed:        0.30,
  tension:          0.25,
  damping:          0.0001,
  length:           0.306,
  spacing:          407.0,
  timeStep:         1.0,
  bandAmplitude:    0.20,
  bandSecondaryFreq:7.0,
  bandSecondaryAmp: 0.025,
  travelSpeed1:     0.25,
  travelAmp1:       0.014,
  travelSpeed2:     0.15,
  travelAmp2:       0.008,
  perturbation:     0.10,
  perturbationScale:0.07,
  waveCosAmp:       0.09,
  waveBias:         -0.10,
  waveHeightScale:  0.50,
  waveSoftClip:     0.22,
  rePipelineBlend:  0.45,
  reDescriptorStrength: 0.7,
  reSyntheticDescriptorSeed: 1337,
  reSyntheticDescriptorMotion: 0.65,
  reKernelGain:     0.04,
  reNormalizeGain:  0.08,
  reKernelPhaseStep:0.45,
  reIndexJitter:    0.006,
  reTemporalSmooth: 0.84,
  zDetailScale:     0.08,
  ffdScale1X: 5.68, ffdScale1Y: 1.00, ffdScale1Z: 1.00,
  ffdScale2X: 2.83, ffdScale2Y: 1.28, ffdScale2Z: 2.89,
  ffdOffsetX: 0.00, ffdOffsetY: -0.47, ffdOffsetZ: 0.00,
  ffdYAmp: 0.05, ffdZAmp: 0.06,
};

const PS3SplineReverse = (function () {
  const PS3 = {
    B380_SIZE_BYTES: 0x2200,
    TABLE_ENTRY_COUNT: 0x169,
    OUTPUT_STRIDE_BYTES: 0x400,
    LOOP_ITERS: 8,
    STORE_OFFSETS_BYTES: [0x000, 0x100, 0x200, 0x300, 0x010, 0x110, 0x210, 0x310],
    STRIDE_FLOATS: 0x400 >> 2,
  };

  const NORM_A = new Float32Array([0.39584, -0.0052389996, -0.58664495, 0.189007]);
  const NORM_B = new Float32Array([-0.003751, -0.57536095, 0.161975, 0.417137]);
  const R37_WORDS = [0x00, 0x11, 0x22, 0x33];

  function clamp01(v) { return Math.max(0, Math.min(1, v)); }
  function fract(v) { return v - Math.floor(v); }
  function hash01(x) { return fract(Math.sin(x) * 43758.5453123); }

  function bsplineBasis(t) {
    const t2 = t * t;
    const t3 = t2 * t;
    return [
      (1 - 3 * t + 3 * t2 - t3) / 6,
      (4 - 6 * t2 + 3 * t3) / 6,
      (1 + 3 * t + 3 * t2 - 3 * t3) / 6,
      t3 / 6,
    ];
  }

  function evalSpline(cp, u) {
    const n = cp.length - 3;
    if (n < 1) return 0;
    const s = Math.max(0, Math.min(u * n, n - 1e-6));
    const seg = Math.floor(s);
    const t = s - seg;
    const b = bsplineBasis(t);
    return b[0] * cp[seg] + b[1] * cp[seg + 1] + b[2] * cp[seg + 2] + b[3] * cp[seg + 3];
  }

  function tableIndexFromWord(word) {
    const hi = (word >> 4) & 0xff;
    const lo = word & 0xf;
    return (19 * hi + lo) % PS3.TABLE_ENTRY_COUNT;
  }

  function wrapIndexFloat(v, len) {
    let out = v % len;
    if (out < 0) out += len;
    return out;
  }

  function sampleTableVec4(table, idxFloat, out) {
    const len = PS3.TABLE_ENTRY_COUNT;
    const i0 = Math.floor(idxFloat) % len;
    const i1 = (i0 + 1) % len;
    const t = idxFloat - Math.floor(idxFloat);
    const b0 = i0 * 4;
    const b1 = i1 * 4;
    out[0] = table[b0]     * (1 - t) + table[b1]     * t;
    out[1] = table[b0 + 1] * (1 - t) + table[b1 + 1] * t;
    out[2] = table[b0 + 2] * (1 - t) + table[b1 + 2] * t;
    out[3] = table[b0 + 3] * (1 - t) + table[b1 + 3] * t;
  }

  function vec4Mix(a, b, t, out) {
    const s = 1 - t;
    out[0] = a[0] * s + b[0] * t;
    out[1] = a[1] * s + b[1] * t;
    out[2] = a[2] * s + b[2] * t;
    out[3] = a[3] * s + b[3] * t;
  }

  class SyntheticDescriptorSource {
    constructor() {
      this.lastSeed = 0;
      this.cached = new Uint8Array(PS3.B380_SIZE_BYTES);
    }
    buildB380(settings) {
      const seed = settings.reSyntheticDescriptorSeed | 0;
      if (seed === this.lastSeed && this.cached[0] !== 0) return this.cached;
      this.lastSeed = seed;
      const out = this.cached;
      const len = out.length;
      for (let i = 0; i < len; i++) {
        const f = i / len;
        const wave =
          Math.sin((f * 97.0)  * (0.3  + settings.length))                    * 0.5 +
          Math.sin((f * 211.0) * (0.15 + settings.tension * 3.0))             * 0.3 +
          Math.sin((f * 17.0)  * (0.2  + settings.perturbationScale * 2.0))   * 0.2;
        const noise = hash01(i * 13.37 + seed * 0.01) * 2.0 - 1.0;
        const v = clamp01((wave * settings.reDescriptorStrength + noise * 0.35 + 1.0) * 0.5);
        out[i] = (v * 255) | 0;
      }
      return out;
    }
    decodeCoefficients(b380, settings, timeSec, coeffOut) {
      const len = b380.length;
      const stride = 0x130;
      const phase = timeSec * settings.flowSpeed * settings.timeStep * settings.reSyntheticDescriptorMotion;
      for (let entry = 0; entry < PS3.TABLE_ENTRY_COUNT; entry++) {
        const entryBase = entry * 16;
        const descBase = (entry * stride) % len;
        for (let blk = 0; blk < 4; blk++) {
          for (let lane = 0; lane < 4; lane++) {
            const byteIdx = (descBase + blk * 0x10 + lane * 4 + (entry % 7)) % len;
            const b = b380[byteIdx] / 255;
            const centered = b * 2 - 1;
            const harmonic = Math.sin(entry * 0.07 + blk * 0.91 + lane * 1.37 + phase * 0.23);
            coeffOut[entryBase + blk * 4 + lane] = centered * 0.75 + harmonic * 0.25;
          }
        }
      }
    }
  }

  class PS3SplineReversePipeline {
    constructor() {
      this.source = new SyntheticDescriptorSource();
      this.b300 = new Float32Array(16);
      this.coeffs = new Float32Array(PS3.TABLE_ENTRY_COUNT * 16);
      this.table = new Float32Array(PS3.TABLE_ENTRY_COUNT * 4);
      this.kernelPacked = new Float32Array(PS3.LOOP_ITERS * 8 * 4);
      this.kernelPackedPrev = new Float32Array(PS3.LOOP_ITERS * 8 * 4);
      this.controlPoints = new Float32Array(28);
      // Scratch vectors reused per kernel iter
      this._v0 = new Float32Array(4); this._v1 = new Float32Array(4);
      this._v2 = new Float32Array(4); this._v3 = new Float32Array(4);
      this._r12 = new Float32Array(4); this._r13 = new Float32Array(4);
      this._r14 = new Float32Array(4); this._r15 = new Float32Array(4);
      this._r9  = new Float32Array(4); this._r4  = new Float32Array(4);
      this._r87 = new Float32Array(4); this._r89 = new Float32Array(4);
    }
    buildRuntimeInputs(settings) {
      this.b300[0]  = settings.damping;
      this.b300[1]  = settings.length;
      this.b300[2]  = settings.tension;
      this.b300[3]  = settings.spacing * 0.001;
      this.b300[4]  = settings.waveCosAmp;
      this.b300[5]  = settings.waveBias;
      this.b300[6]  = settings.timeStep;
      this.b300[7]  = settings.perturbation;
      this.b300[8]  = settings.perturbationScale;
      this.b300[9]  = settings.flowSpeed;
      this.b300[10] = settings.ffdScale1X;
      this.b300[11] = settings.ffdScale2X;
      this.b300[12] = settings.ffdOffsetY;
      this.b300[13] = 0.5; // fresnelScale carrier
      this.b300[14] = settings.waveHeightScale;
      this.b300[15] = 1.0;
      return { b300: this.b300, b380: this.source.buildB380(settings) };
    }
    buildSplineTable(runtime, settings, timeSec) {
      this.source.decodeCoefficients(runtime.b380, settings, timeSec, this.coeffs);
      const normalizeGain = settings.reNormalizeGain;
      const c = this.coeffs;
      const b = runtime.b300;
      for (let i = 0; i < PS3.TABLE_ENTRY_COUNT; i++) {
        const cBase = i * 16;
        const tBase = i * 4;
        for (let lane = 0; lane < 4; lane++) {
          const raw =
            c[cBase + lane]      * b[0] +
            c[cBase + 4 + lane]  * b[1] +
            c[cBase + 8 + lane]  * b[2] +
            c[cBase + 12 + lane] * b[3];
          const denomAbs = Math.max(Math.abs(NORM_B[lane]), 0.05);
          const denom = NORM_B[lane] < 0 ? -denomAbs : denomAbs;
          const norm = ((raw - NORM_A[lane]) / denom) * normalizeGain;
          this.table[tBase + lane] = Math.tanh(norm);
        }
      }
      return this.table;
    }
    runKernel(table, settings, timeSec) {
      const idxFloat = [0, 0, 0, 0];
      const v0 = this._v0, v1 = this._v1, v2 = this._v2, v3 = this._v3;
      const r12 = this._r12, r13 = this._r13, r14 = this._r14, r15 = this._r15;
      const r9 = this._r9, r4 = this._r4, r87 = this._r87, r89 = this._r89;
      const stores = [r12, r13, r14, r15, r9, r4, r87, r89];
      for (let iter = 0; iter < PS3.LOOP_ITERS; iter++) {
        const phase = timeSec * settings.reKernelPhaseStep + iter * 0.37;
        for (let lane = 0; lane < 4; lane++) {
          const baseWord = (R37_WORDS[lane] + iter * 0x13) & 0xff;
          const baseIdx = tableIndexFromWord(baseWord);
          const smoothOffset = Math.sin(phase + lane * 0.77) * settings.reIndexJitter * PS3.TABLE_ENTRY_COUNT;
          idxFloat[lane] = wrapIndexFloat(baseIdx + smoothOffset, PS3.TABLE_ENTRY_COUNT);
        }
        sampleTableVec4(table, idxFloat[0], v0);
        sampleTableVec4(table, idxFloat[1], v1);
        sampleTableVec4(table, idxFloat[2], v2);
        sampleTableVec4(table, idxFloat[3], v3);
        const mixA = 0.5 + 0.5 * Math.sin(phase * 0.7);
        const mixB = 0.5 + 0.5 * Math.cos(phase * 0.9);
        vec4Mix(v0, v1, mixA, r12);
        vec4Mix(v1, v2, mixB, r13);
        vec4Mix(v2, v3, mixA, r14);
        vec4Mix(v3, v0, mixB, r15);
        for (let lane = 0; lane < 4; lane++) {
          r9[lane]  = v1[lane] - v0[lane];
          r4[lane]  = v2[lane] - v1[lane];
          r87[lane] = v3[lane] - v2[lane];
          r89[lane] = v0[lane] - v3[lane];
        }
        for (let s = 0; s < 8; s++) {
          const packedBase = (iter * 8 + s) * 4;
          const vec = stores[s];
          this.kernelPacked[packedBase    ] = vec[0];
          this.kernelPacked[packedBase + 1] = vec[1];
          this.kernelPacked[packedBase + 2] = vec[2];
          this.kernelPacked[packedBase + 3] = vec[3];
        }
      }
      const temporal = Math.max(0, Math.min(0.999, settings.reTemporalSmooth));
      for (let i = 0; i < this.kernelPacked.length; i++) {
        const smoothed = this.kernelPackedPrev[i] * temporal + this.kernelPacked[i] * (1 - temporal);
        this.kernelPacked[i] = smoothed;
        this.kernelPackedPrev[i] = smoothed;
      }
      return this.kernelPacked;
    }
    writeDisplacementTexture(settings, timeSec, outData, width, height) {
      const runtime = this.buildRuntimeInputs(settings);
      const table = this.buildSplineTable(runtime, settings, timeSec);
      const kernelPacked = this.runKernel(table, settings, timeSec);
      const cp = this.controlPoints;
      const cpCount = cp.length;
      const kernelVecCount = PS3.LOOP_ITERS * 8;
      const flow = timeSec * settings.flowSpeed * settings.timeStep;
      for (let row = 0; row < height; row++) {
        const z = (row / Math.max(1, height - 1)) * 2 - 1;
        const rowBase = row * width;
        const rowPhase = flow * 0.25 + z * 1.7;
        for (let i = 0; i < cpCount; i++) {
          const x = i / Math.max(1, cpCount - 1);
          const kvf = row * 0.93 + i * 0.61 + flow * 0.35;
          const kv0 = ((Math.floor(kvf) % kernelVecCount) + kernelVecCount) % kernelVecCount;
          const kv1 = (kv0 + 1) % kernelVecCount;
          const kt = kvf - Math.floor(kvf);
          const k0 = kv0 * 4;
          const k1 = kv1 * 4;
          const kx = kernelPacked[k0]     * (1 - kt) + kernelPacked[k1]     * kt;
          const ky = kernelPacked[k0 + 1] * (1 - kt) + kernelPacked[k1 + 1] * kt;
          const kz = kernelPacked[k0 + 2] * (1 - kt) + kernelPacked[k1 + 2] * kt;
          const kw = kernelPacked[k0 + 3] * (1 - kt) + kernelPacked[k1 + 3] * kt;
          const reCore =
            (kx * 0.45 + ky * 0.25 + kz * 0.2 + kw * 0.1) * settings.reKernelGain +
            Math.sin(rowPhase + x * 6.2) * settings.bandAmplitude +
            Math.cos(z * settings.bandSecondaryFreq + x * 4.8 + flow * 0.09) * settings.bandSecondaryAmp;
          const legacy =
            Math.sin((x * Math.PI * 1.3 + z * 0.8) - flow * settings.travelSpeed1) * settings.travelAmp1 * settings.tension +
            Math.sin((x * Math.PI * 2.8 - z * 1.2) + flow * settings.travelSpeed2) * settings.travelAmp2 +
            settings.perturbation * settings.perturbationScale *
              Math.sin((x * (4.0 + settings.length * 2.0) + z * 4.0 - flow * 0.6) * (settings.spacing * 0.01));
          cp[i] = reCore * settings.rePipelineBlend + legacy * (1.0 - settings.rePipelineBlend);
        }
        for (let xi = 0; xi < width; xi++) {
          outData[rowBase + xi] = evalSpline(cp, xi / Math.max(1, width - 1));
        }
      }
    }
  }

  return {
    createPipeline() { return new PS3SplineReversePipeline(); },
  };
})();

// Spline displacement texture state (filled each frame by PS3SplineReverse,
// uploaded to the GPU and sampled by the wave vertex shader).
const SPLINE_TEX_W = 256;
const SPLINE_TEX_H = 64;
let splineTex = null;
let splineTexData = new Float32Array(SPLINE_TEX_W * SPLINE_TEX_H);
let splineTexFormat = null;       // gl.LUMINANCE or gl.RGBA fallback
let splineTexFloatType = null;    // gl.FLOAT or gl.UNSIGNED_BYTE fallback
let splineTexFallbackBytes = null;// Uint8Array used when float texture unsupported
let splineReversePipeline = null; // PS3SplineReverse pipeline instance

// ------ WAVE SHADER (firmware lines.qrc 5D220FDA34BF60B4) ------
//
// PS3 implementation:
//   - SPU `spline.elf` evaluates a B-spline over 361 control points and writes
//     8 vec4 attributes per control-point step (kernel FUN_000045c0, stride
//     0x400). Per LINE1.mnu: damping=0.0001 tension=0.25 spacing=407
//     brightness=0.7 fresnel=0.64 timestep=4ms perturbation=0.1.
//   - 6 ribbon strips are drawn (FP 5D220FDA34BF60B4 per ribbon, only
//     c[2].x differs: world X = 405..1405). Each ribbon is one wide
//     translucent silk strip in world space (post-spline, displaced by the
//     SPU spline normal-map). The visible silk threads in the captured
//     frame come from the 6 overlapping ribbons + the LinesController
//     bloom pass producing the soft halo.
//   - LinesController (FP D9D6DC41) compositor additively accumulates the
//     ribbons, adds a Gaussian bloom pass (HDR.mnu gauss_radius), tonemaps
//     with c[57..59]=log2(e) and c[60]=1 in `1-exp(-x)` soft clip, then
//     blits.
//
// Web port strategy:
//   - Render 6 wide silk ribbons matching firmware c[2].x layout. Each
//     ribbon is a high-segment-count strip that follows a shared B-spline
//     curve (matching the firmware basis at DAT_0000d600/de00 of
//     spline.elf - constants 0x89c0..0x89f0, all coefficients in 1/6
//     units). Each ribbon is offset slightly so the 6 strips overlap to
//     produce the silk-fabric look.
//   - Each ribbon has a wide gaussian cross-section (not a thin line) so
//     the additive blend builds up volume in the overlap zone. With 6
//     ribbons stacked the result reads as one cohesive flowing silk
//     fabric (matching /work/ps3/wave_frames/frame_010.png reference).
//   - Per-ribbon phase shift (driven by firmware spacing constant) makes
//     the strips lay at slightly different heights so the silk band has
//     internal structure (visible silk threads inside the band).
//   - Fragment shader keeps the firmware-decompiled lighting math
//     (Blinn-Phong + chromatic Fresnel + HDR soft clip).
//
// FIRMWARE-ACCURATE WAVE IMPLEMENTATION - 3D MESH (silk geometry)
// ============================================================================
// The PS3 XMB wave is a 3D mesh that is displaced in the vertex shader and
// shaded with screen-space normals in the fragment shader. The visible "silk
// threads" arise where the surface curves enough that screen-space derivatives
// produce a strong Fresnel reading. This is the same architecture used by the
// PS3-XMB community port (PlayStation-3-XMB/ps3xmbwave) which is the only
// public implementation that recovers the recognisable silk shape.
//
// Geometry: a tessellated rectangular mesh in NDC, e.g. 200 segments wide
// by 32 rows tall, rendered as a triangle strip. The "horizontal" axis
// (aPos.x in -1..+1) maps directly to screen x; the "vertical" axis
// (aPos.y in -1..+1) becomes the world-z (depth into ribbon) AND is used
// to bias the displaced screen-y so the back of the mesh sits higher on
// screen than the front (creates the parallax look between the stacked
// silk strands).
//
// Displacement layers (vertex shader):
//   1. Cosine wave along x for the broad silk swell (cos(p.x*2 - t/2))
//   2. xmbNoise base height for organic deformation
//   3. FFD: two FREE-FORM-DEFORM passes at firmware-derived frequencies
//      that add the "flowing silk" undulation (sin(p*ffdScale1 + offset
//      + uTime*flowSpeed))
//   4. Per-vertex impulse deflection for nav reactivity (Gaussian falloff,
//      exponential temporal decay, NO oscillation, per memory feedback)
//
// Lighting (fragment shader):
//   - Normal from dFdx/dFdy of vWorldPos (screen-space derivatives)
//   - Two Blinn-Phong specular terms with firmware exponents 44.86 / 74.11
//   - Fresnel: (1 + dot(forward, N))^4 * 0.5 weighted by firmware c[26].x
//   - Tint with firmware c[23] daytime cool blue (0.651, 0.759, 1.0)
//   - HDR soft-clip via 1 - exp(-color * c[56].x)
//
// LINE1.mnu firmware parameters (wave_constants.json) preserved:
//   damping=0.0001, tension=0.25, spacing=407, brightness=0.7,
//   fresnel=0.64, timestep=4, perturbation=0.1
// Wave vertex shader: ported from PlayStation-3-XMB/ps3xmbwave/spline.js
// (MIT, copyright 2025 Mart aka linkev) and adapted to WebGL1 GLSL.
//
// The mesh is a screen-space grid in NDC (-1..+1). Vertex Y displacement is
// driven by a pre-computed spline displacement texture filled by the
// PS3SplineReverse JS pipeline (also ported from linkev's spline-reverse.js).
// On top of that texture sample we layer two-octave FFD distortion, a
// travelling cosine swell, a structured perturbation, soft-clipping, and a
// z-detail displacement sample. Continuous-velocity nav impulses
// (uWaveVelX/uWaveVelY) ride on top so the wave still reacts to input.
const VS_WAVE = `
//WGL2_ES300
precision highp float;
attribute vec2 aPos;                  // aPos in NDC [-1,1]
uniform sampler2D uSplineTex;         // R32F equivalent (LUMINANCE float)
uniform float uTime;
uniform float uAspect;
uniform float uWaveVelX;
uniform float uWaveVelY;
uniform float uFlowSpeed;
uniform float uTension;
uniform float uDamping;
uniform float uLength;
uniform float uSpacing;
uniform float uPerturbation;
uniform float uPerturbationScale;
uniform float uTimeStep;
uniform float uWaveCosAmp;
uniform float uWaveBias;
uniform float uWaveHeightScale;
uniform float uWaveSoftClip;
uniform vec3 uFfdScale1;
uniform vec3 uFfdScale2;
uniform vec3 uFfdOffset;
uniform float uFfdYAmp;
uniform float uFfdZAmp;
uniform float uZDetailScale;
// Boot intro: vertical NDC shift of the whole wave so the crest can rise from
// its low coldboot1 position (crest mid-screen) to the steady high XMB crest.
// 0.0 at steady state (no-op).
uniform float uWaveYOffset;
varying vec3 vWorldPos;
varying vec2 vUV;
varying float vScreenY;   // clip-space Y of this vertex (-1 top..+1 bottom in NDC*-1)

// Continuous-velocity deformation. The cat-nav swell follows uWaveVelX
// smoothly across zero so a left->right direction change slides the swell
// center through x=0 instead of teleporting from -0.25 to +0.25. The
// item-nav swell sits at the focused-item slot.
float impulseDy(float xN) {
  float total = 0.0;
  const float SIGMA_CAT  = 0.55;
  const float SIGMA_ITEM = 0.70;
  if (abs(uWaveVelX) > 1e-4) {
    // Map velocity (clamped to firmware perturbation cap 0.1) onto NDC offset
    // +/- 0.25. clamp(velX * 2.5, -0.25, 0.25) is continuous so the swell
    // center glides as velocity decays / accelerates rather than snapping
    // when the sign flips on a direction change.
    float cx = clamp(uWaveVelX * 2.5, -0.25, 0.25);
    float dx = xN - cx;
    total += uWaveVelX * exp(-(dx*dx) / (SIGMA_CAT*SIGMA_CAT));
  }
  if (abs(uWaveVelY) > 1e-4) {
    float dx = xN - (-0.25);
    total += uWaveVelY * exp(-(dx*dx) / (SIGMA_ITEM*SIGMA_ITEM));
  }
  return total;
}

// tanh polyfill - WebGL1 GLSL has no tanh builtin
float xtanh(float x) {
  float e2x = exp(2.0 * x);
  return (e2x - 1.0) / (e2x + 1.0);
}

void main() {
  // World coords: x = aPos.x (screen-aligned X), z = aPos.y (depth axis)
  vec3 p = vec3(aPos.x, 0.0, aPos.y);
  vec2 uv = aPos * 0.5 + 0.5;
  vUV = uv;

  // Sample the precomputed spline displacement texture as the base height.
  // Equivalent to texture(uSplineTex, uv).r in the WebGL2 reference.
  p.y = texture2D(uSplineTex, uv).r;

  // Two-octave free-form deformation (FFD). The reference uses ffdScale1/2
  // multipliers plus a shared offset; here we keep that shape exactly.
  vec3 ffd1 = p * uFfdScale1 + uFfdOffset;
  vec3 ffd2 = p * uFfdScale2 + uFfdOffset;
  p.y += sin(ffd1.x + uTime * uFlowSpeed) * uFfdYAmp;
  p.z += cos(ffd2.z + uTime * uFlowSpeed) * uFfdZAmp;

  // Base cosine wave + bias (waveCosAmp / waveBias from settings).
  float baseWave = cos(p.x * 2.0 - uTime * 0.5 * uTimeStep) * uWaveCosAmp + uWaveBias;
  baseWave *= (1.0 - uDamping);
  baseWave += uTension * sin(p.x * uLength + uTime * uFlowSpeed * uTimeStep * 0.25);

  // Structured high-frequency perturbation. Identical to the reference.
  float structured = uPerturbation * uPerturbationScale * (
    sin((p.x * uLength * 6.0 + p.z * 0.5) * uSpacing * 0.01 + uTime * uFlowSpeed * uTimeStep * 0.7) * 0.5 +
    sin((p.x * uLength * 10.0 - p.z * 0.8) * uSpacing * 0.005 - uTime * uFlowSpeed * uTimeStep * 0.35) * 0.25
  );

  // Soft-clip via tanh so big amplitudes don't blow out the silhouette.
  float totalWave = (baseWave + structured) * uWaveHeightScale;
  totalWave = uWaveSoftClip * xtanh(totalWave / max(uWaveSoftClip, 1e-4));
  p.y -= totalWave;

  // Depth detail sample - the reference samples the spline texture again
  // but with a horizontally-scrolling UV. Adds a subtle Z ripple.
  vec2 uv2 = uv;
  uv2.x = fract(uv2.x - uTime * uFlowSpeed * 0.04 * uTimeStep);
  p.z -= texture2D(uSplineTex, uv2).r * uZDetailScale;

  // OUR nav-reactivity layer on top.
  p.y -= impulseDy(p.x) * 0.4;

  // Boot intro vertical crest shift (low coldboot1 -> high steady). 0 at steady.
  p.y += uWaveYOffset;

  vWorldPos = p;

  // Match the reference shader: gl_Position = vec4(p, 1.0). x/y from the
  // displaced position, depth = p.z. The wave's silhouette in screen
  // space is the projection of p.y onto the framebuffer.
  // Screen projection. p.y is the displaced wave height (the crest contour).
  // The original mapping put screen Y = p.y, which makes the ribbon a thin
  // horizontal band at the crest only -- the "thin thread" symptom. To form a
  // BAND of light (firmware draws ribbon strips covering the lower screen), we
  // sweep the depth axis (aPos.y, -1 far .. +1 near) DOWNWARD from the crest:
  // the near edge of the ribbon falls to the bottom of the screen, filling the
  // lower band that the exposure then whites out.
  //   depth01: 0 at the far (crest) edge -> 1 at the near edge.
  float depth01 = aPos.y * 0.5 + 0.5;
  // crestY: the wave-displaced top contour. Steady crest sits near 46% screen
  // height (NDC ~ +0.08 from center => slightly above middle). p.y is small.
  float crestY = p.y * 0.6 + 0.10;
  // Screen Y sweeps from the crest contour down to the screen bottom (-1).
  float screenY = mix(crestY, -1.05, depth01);
  gl_Position = vec4(p.x, screenY, 0.0, 1.0);
  // vScreenY in NDC (+1 top .. -1 bottom). The FS builds the firmware vertical
  // band profile (dark above crest -> purple core -> white whiteout below).
  vScreenY = screenY;

// Fragment shader: derive normal from screen-space derivatives of vWorldPos
