    // Match the snappy easeOutCubic used for entering / category scrolling.
    ease: easeOutCubic
  };
  ii = f.pi;
  queueOrLock(V.SUBMENU_ANIM_MS);
  playNav();
}

// Test hook so automation can dispatch nav directly without keyboard events.
window.simulateInput = function(kind, dir) {
  // When a dialog/landing modal is open, route LEFT/RIGHT directly to
  // navCat so navDialog can handle the option selection. Otherwise fall
  // through to the existing XMB nav semantics (left=back if in submenu).
  if (dialogState || landingState) {
    switch (kind) {
      case 'left':  navCat(-1); break;
      case 'right': navCat(1); break;
      case 'up':    navItem(-1); break;
      case 'down':  navItem(1); break;
      case 'enter': enter(); break;
      case 'back':  back(); break;
    }
    return;
  }
  switch (kind) {
    case 'left':  if (stack.length) back(); else navCat(-1); break;
    case 'right': {
      if (stack.length) {
        const items = curItems();
        if (items && items[ii] && items[ii].ch) enter();
      } else { navCat(1); }
      break;
    }
    case 'up':    navItem(-1); break;
    case 'down':  navItem(1); break;
    case 'enter': enter(); break;
    case 'back':  back(); break;
  }
};

// Read-only inspector for the wave amplitude state. Used by automated
// verification to confirm the spring is smoothly tracking the input
// target rather than stepping with each press.
window._waveState = function() {
  return {
    velX: waveVelX, velY: waveVelY,
    velXDot: _waveVelXDot, velYDot: _waveVelYDot,
    tgtX: _waveVelXTarget, tgtY: _waveVelYTarget,
    holdX: _holdDurationX, holdY: _holdDurationY,
    holdDirX: _holdDirX, holdDirY: _holdDirY,
    t: performance.now()
  };
};

// =====================================================
// INPUT HANDLING
// =====================================================
// Key repeat system - mimics PS3 controller repeat behavior
// Initial delay: 300ms, base repeat 200ms, accelerates by 1.4x per repeat
// down to a 50ms floor. All timings derive from V.INPUT_* which sources
// firmware vaddrs 0x2706E0/F0/D4/E4/EC (explore_plugin.prx).
const keyState = {};
// Key repeat (firmware values from explore_plugin.prx via V)
const KEY_INITIAL_DELAY = V.INPUT_INITIAL_DELAY_MS;  // firmware: 300ms
const KEY_REPEAT_SLOW = V.INPUT_REPEAT_MS;           // firmware: 200ms base
const KEY_REPEAT_FAST = V.INPUT_FAST_REPEAT_MS;      // firmware: 68ms accelerated
const KEY_REPEAT_MIN = V.INPUT_MIN_REPEAT_MS;        // firmware: 50ms minimum
const KEY_ACCEL_FACTOR = V.INPUT_ACCEL_MULT;         // firmware: 1.4x acceleration multiplier

// Build a key-action closure. `fromRepeat` is forwarded to nav* so the
// firmware-derived processKeyRepeat schedule can drive chained motion without
// the inputLock clamping it down to the animation duration.
function getKeyAction(key, fromRepeat) {
  // Network wizard owns all D-pad input while active.
  if (wizState) {
    switch (key) {
      case 'ArrowLeft':  return () => wizNavCat(-1);
      case 'ArrowRight': return () => wizNavCat(1);
      case 'ArrowUp':    return () => wizNavItem(-1);
      case 'ArrowDown':  return () => wizNavItem(1);
      default: return null;
    }
  }
  switch (key) {
    case 'ArrowLeft':  return () => {
      // When a modal is up, LEFT/RIGHT belongs to navDialog (via navCat),
      // not the XMB submenu-back semantics.
      if (dialogState || landingState) { navCat(-1, fromRepeat); return; }
      if (stack.length) {
        // back() is a stack pop -- we don't auto-repeat into deeper navigation
        if (!fromRepeat) back();
      } else navCat(-1, fromRepeat);
    };
    case 'ArrowRight': return () => {
      if (dialogState || landingState) { navCat(1, fromRepeat); return; }
      if (stack.length) {
        // enter() opens a submenu -- not a repeatable action.
        if (!fromRepeat) {
          const items = curItems();
          if (items && items[ii] && items[ii].ch) enter();
        }
      } else { navCat(1, fromRepeat); }
    };
    case 'ArrowUp':    return () => navItem(-1, fromRepeat);
    case 'ArrowDown':  return () => navItem(1, fromRepeat);
    default: return null;
  }
}

document.addEventListener('keydown', e => {
  if (e.repeat) { e.preventDefault(); return; } // We handle repeat ourselves
  // Pressing any key during the boot intro skips to the final cross-fade.
  if (!bootIntroDone && bootIntroStart > 0) {
    maybeSkipBoot();
    e.preventDefault();
    return;
  }
  // OSK raw typing: printable chars + Backspace fill/edit the field directly.
  if (wizState && wizState.osk && wizOskRawKey(e)) return;
  const action = getKeyAction(e.key, /*fromRepeat=*/false);
  if (action) {
    e.preventDefault();
    action();
    // Start repeat tracking. Store the key so processKeyRepeat can build a
    // repeat-mode action (fromRepeat=true) per fire; that flag is what tells
    // navCat/navItem to bypass the inputLock and use the firmware cadence.
    keyState[e.key] = {
      key: e.key,
      startTime: performance.now(),
      lastRepeat: performance.now(),
      repeatCount: 0
    };
  } else {
    switch (e.key) {
      case 'Enter': case 'x': case 'X':
        e.preventDefault(); enter(); break;
      case 'Backspace': case 'Escape': case 'z': case 'Z':
        e.preventDefault(); back(); break;
      case 'Tab':
        // Cycle through the supported aspect ratios (Shift+Tab goes backwards).
        e.preventDefault();
        {
          const n = ASPECT_ORDER.length;
          let idx = ASPECT_ORDER.indexOf(aspect);
          if (idx < 0) idx = 0;
          idx = (idx + (e.shiftKey ? n - 1 : 1)) % n;
          aspect = ASPECT_ORDER[idx];
        }
        resize(); break;
      case 'o': case 'O':
        // Toggle portrait / landscape orientation for the current aspect ratio.
        e.preventDefault();
        orientation = (orientation === 'portrait') ? 'landscape' : 'portrait';
        resize(); break;
      case 'n': case 'N':
        // Cycle between TRUE 1x (exact native target-screen pixels, no scaling,
        // letter/pillarboxed) and NORMAL rendering (device-pixel-ratio + integer
        // scaling). Only meaningful when a ?res target is set.
        e.preventDefault();
        native1x = !native1x;
        resize(); break;
    }
  }
});

document.addEventListener('keyup', e => {
  delete keyState[e.key];
});

// Key repeat timer - runs in the animation loop.
// Firmware cadence (decomp D.1, vaddrs 0x2706E0/F0/EC/E4):
//   t=0       initial press fires immediately (repeatCount = 0)
//   t=300     first repeat  (interval = KEY_INITIAL_DELAY = 300)
//   t=500     second repeat (interval = KEY_REPEAT_SLOW   = 200)
//   t=643     third repeat  (interval = 200/1.4   = 143)
//   t=745     fourth repeat (interval = 200/1.4^2 = 102)
//   t=818     fifth repeat  (interval = 200/1.4^3 =  73)
//   t=870     sixth repeat  (interval = 200/1.4^4 =  52)
//   t=920     seventh+      (interval = KEY_REPEAT_MIN    =  50)
// repeatCount counts the number of repeats already fired (not including the
// initial press). The first repeat uses the INITIAL delay; subsequent
// repeats use SLOW divided by ACCEL^(count-1), floored at MIN.
function processKeyRepeat(now) {
  for (const key in keyState) {
    const ks = keyState[key];
    // A frame may span multiple repeat intervals once acceleration kicks in
    // (interval can drop to 50ms while the frame budget is ~16ms - usually
    // fine, but rAF can throttle or stall to 30/50ms+). Loop until we've
    // consumed all repeats due by `now`, bounded to keep a long stall from
    // firing dozens of nav events in one frame.
    let safety = 16;  // ample for a 250ms stall at the 50ms floor
    while (safety-- > 0) {
      let interval;
      if (ks.repeatCount === 0) {
        interval = KEY_INITIAL_DELAY;
      } else {
        interval = Math.max(KEY_REPEAT_MIN,
          KEY_REPEAT_SLOW / Math.pow(KEY_ACCEL_FACTOR, ks.repeatCount - 1));
      }
      if (now - ks.lastRepeat < interval) break;
      // Build a repeat-mode action (fromRepeat=true) so navCat/navItem skip
      // the inputLock and let this firmware-derived cadence dictate the rate.
      const repeatAction = getKeyAction(ks.key, /*fromRepeat=*/true);
      if (repeatAction) repeatAction();
      ks.lastRepeat += interval;  // advance by exactly one interval so the
                                  // cadence stays on-schedule even after a stall
      ks.repeatCount++;
    }
  }
}

// Gamepad polling
let gpPrev = {};
function pollGP() {
  const gps = navigator.getGamepads();
  for (const gp of gps) {
    if (!gp) continue;
    const p = i => gp.buttons[i] && gp.buttons[i].pressed;
    const jp = i => p(i) && !gpPrev[gp.index + '_' + i];

    // D-pad: 12=up, 13=down, 14=left, 15=right
    if (jp(14)) {
      if (wizState) navCat(-1);                 // wizard owns L/R (no XMB back)
      else if (dialogState || landingState) navCat(-1);
      else if (stack.length) back();
      else navCat(-1);
    }
    if (jp(15)) {
      if (wizState) {
        navCat(1);
      } else if (dialogState || landingState) {
        navCat(1);
      } else if (stack.length) {
        const items = curItems();
        if (items && items[ii] && items[ii].ch) enter();
      } else {
        navCat(1);
      }
    }
    if (jp(12)) navItem(-1);
    if (jp(13)) navItem(1);
    if (jp(0)) enter();   // Cross
    if (jp(1)) back();    // Circle

    // Left stick - also drives wave/particle perturbation
    const lx = gp.axes[0], ly = gp.axes[1];
    wavePerturbX += (lx * FW_PERTURBATION - wavePerturbX) * 0.1;
    wavePerturbY += (ly * FW_PERTURBATION - wavePerturbY) * 0.1;
    const deadzone = 0.5;
    const lxKey = 'axis_lx_' + gp.index;
    const lyKey = 'axis_ly_' + gp.index;
    if (Math.abs(lx) > deadzone && !gpPrev[lxKey]) {
      if (lx < -deadzone) {
        if (wizState) navCat(-1);
        else if (dialogState || landingState) navCat(-1);
        else if (stack.length) back();
        else navCat(-1);
      }
      if (lx > deadzone) {
        if (wizState) {
          navCat(1);
        } else if (dialogState || landingState) {
          navCat(1);
        } else if (stack.length) {
          const items = curItems();
          if (items && items[ii] && items[ii].ch) enter();
        } else { navCat(1); }
      }
    }
    gpPrev[lxKey] = Math.abs(lx) > deadzone;

    if (Math.abs(ly) > deadzone && !gpPrev[lyKey]) {
      if (ly < -deadzone) navItem(-1);
      if (ly > deadzone) navItem(1);
    }
    gpPrev[lyKey] = Math.abs(ly) > deadzone;

    for (let i = 0; i < gp.buttons.length; i++) {
      gpPrev[gp.index + '_' + i] = p(i);
    }
  }
  requestAnimationFrame(pollGP);
}

// Mouse movement drives wave perturbation (like PS3 Sixaxis motion sensor)
// Uses velocity (movement delta) not position, with spring-damper decay
var lastMouseX = 0, lastMouseY = 0;
document.addEventListener('mousemove', function(e) {
  var dx = e.clientX - lastMouseX;
  var dy = e.clientY - lastMouseY;
  lastMouseX = e.clientX;
  lastMouseY = e.clientY;
  wavePerturbX += dx * 0.0003 * FW_PERTURBATION;
  wavePerturbY += dy * 0.0003 * FW_PERTURBATION;
});

// Interframe blending is enabled only while a scrolling animation is in
// progress. When idle the new frame is identical to the prior frame, so the
// blend is a no-op visually; we skip the work to stay cheap on the idle
// frame path. Dialogs and the landing screen disable blending because both
// are full-opaque replacements that visually conflict with smear.
//
// Also short-circuited when BLEND_PREV_ALPHA is 0 -- there is no point
// snapshotting and re-compositing a fully transparent layer.
//
// Special case for catAnim: a cat-switch renders BOTH old and new item
// lists at non-zero alpha while they slide past each other. Blending the
// prev frame at 12% under the current cat-switch frame accumulates a
// trail of OLD items at multiple x positions across the slide (each frame
// of the slide has old items at a slightly different oldShift), reading as
// a rubber-band smear rather than the firmware's clean fade-out-then-in.
// Skip the blend during catAnim so the asymmetric alpha curve in the
// cat-switch render handles the visual on its own.
function shouldBlendInterframe() {
  if (V.BLEND_PREV_ALPHA <= 0) return false;
  if (landingState || dialogState) return false;
  if (catAnim) return false;
  return !!(itemAnim || submenuAnim || itemDescAnim);
}

// Cubic-bezier easing used by the firmware INTERPOLATION_BEZIER mode for
// the blur/whole/fade transitions. Control points come straight from the
// VSMX bytecode: blur+whole = (0.1, 0.0, 0.1, 1.0), fade = (0.8, 0.0, 0.8, 1.0).
// We solve for y given x using Newton's method (standard CSS-style bezier).
function bootBezier(x, x1, y1, x2, y2) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  // Search for the t where bezier_x(t) = x, then return bezier_y(t).
  const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
  const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
  function bx_(t) { return ((ax * t + bx) * t + cx) * t; }
  function bdx_(t) { return (3 * ax * t + 2 * bx) * t + cx; }
  let t = x;
  for (let i = 0; i < 8; i++) {
    const xt = bx_(t) - x;
    if (Math.abs(xt) < 1e-5) break;
    const d = bdx_(t);
    if (Math.abs(d) < 1e-6) break;
    t -= xt / d;
  }
  return ((ay * t + by) * t + cy) * t;
}

// WebGL canvases underneath, modulated by the boot-phase globals, so the wave
// swells visibly beneath this overlay. When the intro completes the overlay is
// hidden so the steady XMB shows through cleanly.
const bootCanvas = document.createElement('canvas');

bootCanvas.style.top = '0';

// Helper: linear ramp of x within [a,b] clamped to 0..1.
function bootRamp(x, a, b) {
  if (x <= a) return 0;
  if (x >= b) return 1;
  return (x - a) / (b - a);
}

// modulation globals that drive the wave/gradient underneath. Returns true
// while the XMB UI (icons/menu/clock) should be suppressed; the wave and
// gradient render throughout via drawBGWebGL.
//
// Timeline (ms, boot_spec.md section 0/1, firmware-authoritative coldboot.jsx):
//   0..1500       black hold; gradient=coldboot1 near-black, wave=coldboot1
//                 flat/dim (already drawn underneath, faint).
//   1500..2800    appear: logo+footer emerge dim from black (gold tint).
//   2800..3050    appear_wait hold.
//   3050..3550    blur: glow/bloom plate alpha 0->1, cubic-bezier(0.1,0,0.1,1).
//   3550..3800    blur_wait hold.
//   3800..4300    whole: logo+footer bloom gold -> full white,
//                 cubic-bezier(0.1,0,0.1,1).
//   4300..4800    whole_wait: full-white hold (the peak).
//   4800..6000    fade: logo/footer/blur alpha 1->0, cubic-bezier(0.8,0,0.8,1);
//                 CONCURRENTLY the gradient brightens (coldboot1->coldboot2)
//                 and the wave swells (perturbation 0->alive, brightness up)
//                 over the same window. XMB UI fades in over the last stretch.
//   >=6000        hand-off to steady XMB (coldboot2 == steady state).
function drawBootIntro(now) {
  if (bootIntroDone) return false;
  if (bootIntroStart < 0) { bootIntroStart = now; }
  let elapsed = now - bootIntroStart;
  // Debug-only: pin the boot elapsed time for deterministic verification
  // captures (set window.__pinBootMs from the devtools console / CDP). Has no
  // effect in normal playback when the hook is undefined.
  if (typeof window !== 'undefined' && window.__pinBootMs != null) {
    elapsed = window.__pinBootMs;
    bootIntroStart = now - elapsed;
  }
  if (bootSkippedByInput) {
    // Fast-forward past the logo+warning straight to the hand-off so a button
    // press jumps to the (already fully swelled) steady XMB.
    elapsed = Math.max(elapsed, BOOT_SEQ_END_MS);
    bootIntroStart = now - elapsed;
  }
  if (elapsed >= BOOT_SEQ_END_MS) {
    bootIntroDone = true;
    bootCanvas.style.display = 'none';
    bootGradientBrightness = 1.0;
    bootWaveActive = false;
    bootWaveBrightness = 1.0;
    bootWavePerturb = 1.0;
    bootWaveGeom = 1.0;
    bootWaveYOffset = 0.0;
    bootRadial = 0.0;   // clear the boot center-out exposure boost at hand-off
    bootBgActive = false;   // release the dark-gradient override to steady XMB
    bootBgExposure = 0.0;
    bootLitScene = 0.0;     // lit coldboot scene fully handed off to time-of-day
    manualColorReveal = 1.0; // manual Color theme fully applied on the settled XMB
    bootSweep = 1.0;        // whole frame lit; sweep is a no-op in steady state
    bootWaveGain = 0.0;
    bootWhiteout = 0.0;
    bootTopLift = 0.0;
    bootBandBloom = 0.0;
    bootBgBlurPx = 0.0;
    bootUIReveal = 1.0;
    bootLabelReveal = 1.0;
    bootIconReveal = 1.0;
    // Clear any residual CSS blur + overscan transform on the background canvases.
    applyBgBlur(0);
    return false;
  }

  // ---- Drive the LIVE wave + plum gradient underneath (the HERO) ----
  // boot_TRUE_spec.md: the wave + plum gradient run through the ENTIRE boot.
  // We never blank to black or suppress the wave. A single EXPOSURE envelope
  // (uBootBrightness, a >1 multiplier on the live gradient) drives the whole
  // bloom; the wave uFade is driven by a parallel brightness envelope so the
  // wave is the bright hero through the bloom. The plum gradient over-exposed
  // passes through magenta/pink then clips to white -- that IS the bloom.
  bootWaveActive = true;
  bootBgActive = true;   // own the background: force the dark coldboot1 plum

  // EXPOSURE envelope on the DARK coldboot1 plum gradient (uBootExposure).
  // The plum base is (0.45,0.34,0.57); fed through the HDR composite (expo
  // ~1.05, exp2 tonemap). Targets (frames_png_fixed, color-correct):
  //   E ~ 0.0  -> black             (f6-f20, 470-1780 ms)
  //   E ~ 0.6  -> dim plum streak   (f32, 2900 ms center ~84,69,92)
  //   E ~ 3.0  -> vivid magenta     (f44, 4030 ms top 165,67,250)
  //   E ~ 9.0  -> full-frame WHITE  (f57-64, 5250-5900 ms, clips to 255)
  //   warning  -> E ~ 1.2 (top stays black via the vGrad falloff; the wave
  //               band lights the lower screen on its own)
  function smooth(u) { u = Math.max(0, Math.min(1, u)); return u * u * (3 - 2 * u); }
  function seg(t, a, b, va, vb) { return va + (vb - va) * smooth(bootRamp(t, a, b)); }

  // REAL boot background: BLACK during logo formation, then a SLOW, CONTINUOUS
  // fade up INTO the soft purple/lavender steady gradient. uBootExposure is a
  // 0..1 fade factor (0 = black, 1 = the full steady composited color); the
  // shader lerps top<->bottom by vUV.y (bootBgExposureBottom is the bottom).
  //
  // GRADIENT REVEAL timing (measured on real.mp4, top/bottom luminance vs the
  // real clock; mapped onto the web boot clock so the gradient STARTS ~0.3s
  // after the logo's left edge begins -> BOOT_LOGO_IN_START_MS + 300 = 2500):
  //   real t2.8 ~0/0   -> web 2500 ms   (start, in sync with logo swipe)
  //   real t3.4 4/9    -> web 3100 ms
  //   real t4.0 15/23  -> web 3700 ms
  //   real t5.0 36/49  -> web 4700 ms
  //   real t6.0 55/72  -> web 5700 ms
  //   real t7.0 64/84  -> web 6700 ms
  //   real t8.0 80/105 -> web 7700 ms
  //   real t8.4 85/112 -> web 8100 ms   (plateau)
  // The BOTTOM brightens BEFORE and FASTER than the TOP throughout (the bottom
  // is ~1.3x the top's raw luminance; part of that ratio is intrinsic to the
  // gradient color, part is a genuine bottom-LED reveal timing). The fade
  // factors below are each normalized to their own plateau (so both reach 1.0
  // at the steady hand-off); the bottom factor LEADS the top early on, exactly
  // as measured. The ramp runs ~5.6s (2500->8100), plateauing near the warning
  // end (warning in at 7800) -- it keeps brightening THROUGH the warning, it is
  // NOT finished by ~4s. This is the KEY sync detail.
  const BOOT_GRAD_REVEAL_START = BOOT_LOGO_IN_START_MS + 300;   // 2500 ms
  // Piecewise table: [ms, topFade, bottomFade] (normalized to own plateau).
  // The fade factors are pre-distorted to invert the HDR tonemap so the OUTPUT
  // luminance curve (sampled on screen) tracks the measured real normalized
  // curve; the bottom factor leads the top early (bottom-led reveal).
  // Output luminance == finalColor * fade (the boot branch multiplies the
  // steady composited color by this fade directly -- see FS_BG uBootBgActive
  // branch), so each fade factor IS the on-screen normalized luminance for that
  // strip. We therefore set the factors to the MEASURED real normalized curve
  // (each strip normalized to its own plateau at 8100 ms): a single smooth,
  // continuous ramp with the BOTTOM leading the TOP early, no mid-ramp shelf,
  // plateauing only near the warning end. Real numbers (top/85, bottom/112):
  //   2500 0.000/0.000  3100 0.047/0.080  3700 0.176/0.205  4700 0.424/0.438
  //   5700 0.647/0.643  6700 0.753/0.750  7700 0.941/0.938  8100 1.000/1.000
  const GRAD_REVEAL = [
    [2500, 0.000, 0.000],
    [3100, 0.047, 0.080],
    [3700, 0.176, 0.205],
    [4700, 0.424, 0.438],
    [5700, 0.647, 0.643],
    [6700, 0.753, 0.750],
    [7700, 0.941, 0.938],
    [8500, 1.000, 1.000],
  ];
  function gradReveal(t, col) {
    if (t <= GRAD_REVEAL[0][0]) return 0.0;
    if (t >= GRAD_REVEAL[GRAD_REVEAL.length - 1][0]) return 1.0;
    for (let i = 0; i < GRAD_REVEAL.length - 1; i++) {
      const a = GRAD_REVEAL[i], b = GRAD_REVEAL[i + 1];
      if (t >= a[0] && t <= b[0]) {
        const u = (t - a[0]) / (b[0] - a[0]);
        return a[col] + (b[col] - a[col]) * u;
      }
    }
    return 1.0;
  }
  void BOOT_GRAD_REVEAL_START;
  bootBgExposure       = gradReveal(elapsed, 1);   // TOP fade
  bootBgExposureBottom = gradReveal(elapsed, 2);   // BOTTOM fade (leads early)

  // LIT EXPOSURE ramp. The boot shows the SAME primary-color gradient as steady
  // (manual color if chosen, else the time-of-day/monthly gradient -- May purple),
  // just at an ELEVATED exposure (the coldboot scene is more brightly lit). This
  // factor is the boot brightness LIFT amount (1.0 = full lit, 0.0 = steady): hold
  // it fully (1.0) through the entire boot, then ramp to 0.0 over the settle window
  // [LIT_HANDOFF_START, BOOT_SEQ_END_MS] so the exposure NORMALIZES smoothly into
  // the steady primary-color gradient just as the XMB finishes settling. Same hue
  // throughout (never desaturated to white/grey). Smooth, no pop.
  // MEASURED on the real dump (hw_dump/frames + real.mp4 @30fps): the background
  // gradient ramps up from black and reaches its STABLE (lit-off) time-of-day
  // plateau EARLY IN the warning window, NOT after the warning is dismissed. The
  // warning text is on screen real f231..f377 (t 7.67s..12.53s); the bg brightness
  // (top/bottom luminance away from logo/text/wave) reaches its flat steady value
  // (top~80, bot~108 in real.mp4) at f251 (t~8.33s, ~665 ms after warning-in) and
  // stays flat from there through dismissal and beyond. So the lit->stable settle
  // must COMPLETE during the warning, ~8.3s, well before the warning out at 12.53s.
  // The lit LIFT (bootLitScene) therefore ramps 1.0->0 ending at ~8300 ms (during
  // the warning), not at the XMB hand-off. Start the fade well before warning-in so
  // it is smooth (no pop) and lands fully stable inside the warning, matching the
  // measured real settle. By the time the warning dismisses the gradient is already
  // the steady time-of-day gradient.
  const LIT_HANDOFF_START = 5500;            // begin lit->stable cross-fade pre-warning
  const LIT_HANDOFF_END   = 8300;            // fully on the steady gradient (during warning)
  bootLitScene = 1.0 - smooth(bootRamp(elapsed, LIT_HANDOFF_START, LIT_HANDOFF_END));

  // MANUAL COLOR REVEAL: the user's chosen Color theme must NOT appear during the
  // logo or the warning -- the entire boot is the DEFAULT PLUM gradient. The manual
  // hue blends in ONLY at the XMB settle hand-off, after the warning is dismissed
  // (real-blue.mp4: plum through logo+warning, blue appears ~12s once XMB settles).
  // Ramp 0 -> 1 over [warning-out, XMB UI-in] so the hue switch lands as the XMB
  // takes over, well after the warning. Before that it is 0 (forced plum).
  manualColorReveal = smooth(bootRamp(elapsed, BOOT_WARN_OUT_MS, BOOT_UI_IN_MS));

  // LEFT-FIRST SWEEP phase. The coldboot background+wave come alive from the
  // LEFT edge and sweep to the RIGHT, giving real.mp4 its L->R reveal feel
  // while the LOGO itself fades UNIFORMLY (logo_firmware_forensics.md). The
  // front starts slightly before the global fade-up and finishes a touch after,
  // so the left of the scene brightens before the right. It reaches full (whole
  // frame lit, sweepMask==1 in the shader) by ~4200 ms, well before the UI
  // hand-off, so steady rendering is unaffected.
  // Tie the L->R sweep to the LOGO swipe window (left leads right) and finish it
  // by the time the logo completes (~3300 ms) plus a short tail, so the sweep is
  // a brief L->R "come alive" at boot and does NOT distort the slow vertical
  // gradient reveal that continues through the warning. Completed well before
  // the gradient plateau, so it never modulates the measured 4700-6700 ramp.
  bootSweep = smooth(bootRamp(elapsed, BOOT_LOGO_IN_START_MS, BOOT_LOGO_FULL_MS + 600));

  // All the old bloom/whiteout machinery is permanently disabled.
  bootTopLift = 0.0;
  bootWhiteout = 0.0;
  bootRadial = 0.0;
  bootWaveGain = 0.0;
  bootBandBloom = 0.0;
  bootGradientBrightness = 1.0;

  // WAVE alpha (uFade gate). The thin silvery ribbon emerges early on the black
  // scene and stays present throughout. It is the same steady mesh ribbon.
  bootWaveBrightness = smooth(bootRamp(elapsed, BOOT_WAVE_EMERGE_MS, 2600));
  // GEOMETRY progress: evolve the captured boot keyframes (streak->swell->settled)
  // at CONSTANT velocity (LINEAR, not smoothed -- smoothing made the swell speed up
  // then slow down). Timing measured from real.mp4: the wave appears ~1.6s and the
  // geometry settles ~4.2s. Once settled the steady loop flows on continuously at a
  // matched velocity (no jump). Linear keeps the swell speed uniform.
  bootWaveGeom = bootRamp(elapsed, 1300, 4200);

  // Perturbation: flat/calm AND blurred during the warning (coldboot1: flat,
  // no ripple, dim), then the wave SWELLS/sharpens to the full rippling steady
  // wave (coldboot2) after the warning is dismissed, over the same post-dismiss
  // window as the icon cascade. Holds flat through the warning, then ramps up.
  bootWavePerturb = seg(elapsed, BOOT_WARN_OUT_MS, BOOT_WARN_OUT_MS + 1400,
                        BOOT_WAVE_PT_FROM, BOOT_WAVE_PT_TO);
  // The steady wave already sits at the right crest; no boot position offset.
  bootWaveYOffset = 0.0;

  // ---- BACKGROUND BLUR gated to the warning ----
  // Blur engages with the warning text (BOOT_WARN_IN_MS), holds while the
  // warning is on screen, then releases / re-sharpens as the warning dismisses
  // and the wave swells to steady. Scaled to the live canvas height so it is
  // resolution independent.
  // GROUND TRUTH (direct inspection of real.mp4): during the warning the
  // background wave is clearly BLURRED/SOFT - faint, fuzzy, low-contrast
  // filaments behind the sharp white warning text. After the warning dismisses
  // the wave SHARPENS to crisp silvery filaments by steady state. A prior agent
  // disabled this blur based on a single-frame edge-sharpness metric run on the
  // moving wave; that metric is unreliable (it sampled a moving wave and read it
  // as "sharper during warning", which is backwards). The blur is re-enabled.
  // ~6.5 px at 1080p reference matches real's warning-phase softness.
  const BOOT_BG_BLUR_MAX = 6.5;          // px at 1080p reference (warning softness)
  // The blurred/dimmed background BRACKETS the warning text -- it engages a beat
  // BEFORE the text (with its drop shadow) cuts in, and releases a beat AFTER the
  // text is gone -- so the white text never sits over, or vanishes from, a crisp
  // wave. Measured on boot.mp4: the warning text clears ~300 ms BEFORE the wave
  // re-sharpens (text gone ~11.35 s, wave crisp ~11.65 s), and the soft
  // background is already established when the text cuts in. The text itself is a
  // hard cut at BOOT_WARN_IN/OUT_MS (drawn below); only this background blur
  // ramps, with the leads/holds below placing it around the text window.
  const BLUR_IN_LEAD = 250;    // blur fully up this long BEFORE the text cuts in
  const BLUR_IN_RAMP = 300;    // ...ramping in over this long
  const BLUR_OUT_HOLD = 120;   // blur holds full this long AFTER the text is gone
  const BLUR_OUT_RAMP = 220;   // ...then re-sharpens over this long (gone ~+340 ms)
  let blurT = smooth(bootRamp(elapsed,
                BOOT_WARN_IN_MS - BLUR_IN_LEAD - BLUR_IN_RAMP,
                BOOT_WARN_IN_MS - BLUR_IN_LEAD));
  blurT *= (1.0 - smooth(bootRamp(elapsed,
                BOOT_WARN_OUT_MS + BLUR_OUT_HOLD,
                BOOT_WARN_OUT_MS + BLUR_OUT_HOLD + BLUR_OUT_RAMP)));
  bootBgBlurPx = BOOT_BG_BLUR_MAX * blurT * (bootCanvas.height / 1080);

  // ---- STAGED XMB UI REVEAL after the warning dismisses ----
  // 0 until the warning is gone, then ramps to 1 across the post-dismiss
  // window. drawXMB reads bootUIReveal: the category LABEL fades in first (lead
  // portion), then the icon row CASCADES/fades up (staggered) over ~0.5 s. No
  // sudden pop. The wave sharpens (above) over the same window.
  bootUIReveal = bootRamp(elapsed, BOOT_UI_IN_MS, BOOT_SEQ_END_MS);
  // Staged sub-reveals: the category LABEL leads (fades in over the first
  // ~45% of the window), then the icon row CASCADES up over the latter ~75%.
  // smooth() eases both. These reproduce the measured "label first (~f150),
  // icons cascade ~f160-190" ordering. drawXMB reads bootLabelReveal /
  // bootIconReveal; per-icon stagger is applied there.
  bootLabelReveal = smooth(bootRamp(elapsed, BOOT_UI_IN_MS, BOOT_UI_IN_MS + 0.45 * (BOOT_SEQ_END_MS - BOOT_UI_IN_MS)));
  bootIconReveal  = smooth(bootRamp(elapsed, BOOT_UI_IN_MS + 0.10 * (BOOT_SEQ_END_MS - BOOT_UI_IN_MS), BOOT_SEQ_END_MS));

  // ---- Logo / footer / blur overlay ----
  bootResize();
  const c = bootCtx;
  const cW = bootCanvas.width;
  const cH = bootCanvas.height;
  c.save();
  c.setTransform(1, 0, 0, 1, 0, 0);
  c.clearRect(0, 0, cW, cH);

  // LOGO + FOOTER: pure WHITE, SECONDARY element on the right (boot_TRUE_spec).
  // Faint from ~1200 ms, full by ~4600 ms, carried through the bloom, gone by
  // ~6000 ms. No gold phase, no blur plate, no logo glow -- the bloom comes
  // from over-exposing the live scene, not from the logo.
  //   mainA : logo+footer alpha. Ramps in 1200->4600, then fades out by 6000.
  // REAL logo timing: white "PS3" + footer fade in ~2.0s, fully visible
  // ~2.4..4.0s, fade out ~4.5s as the purple background comes up.
  // During the reveal window (IN_START..FULL) the logo's visibility is driven
  // ENTIRELY by the L->R wipe mask (below), so mainA is held at 1.0 there --
  // the revealed (left) portion is full brightness while the right is still
  // masked off, matching real.mp4's per-third contrast. mainA only ramps for
  // the hold/fade-out tail.
  // During the reveal the logo BRIGHTENS as it wipes L->R -- it is NOT full
  // white the instant it is unmasked. Real.mp4 logo mean luma ramps
  //   2.2s~0  2.5s~0.12  3.0s~0.29  3.6s~0.65  4.0s~0.86  4.5s~1.0
  // i.e. a gentle ease-in over the whole 2.2..4.0s reveal, reaching full only
  // at the hold. We drive mainA with that brightness envelope so the early
  // logo reads as a dim forming glyph, matching real (web previously snapped to
  // full white the moment the wipe front passed, ~0.7s too early/too bright).
  let mainA = 0;
  if (elapsed < BOOT_LOGO_IN_START_MS) {
    mainA = 0.0;
  } else if (elapsed < BOOT_LOGO_FULL_MS) {
    const u = bootRamp(elapsed, BOOT_LOGO_IN_START_MS, BOOT_LOGO_FULL_MS);
    mainA = u * u;   // ease-in: dim early, ramping to full at FULL_MS
  } else if (elapsed < BOOT_LOGO_FADE_START_MS) {
    mainA = 1.0;
  } else {
    mainA = 1.0 - smooth(bootRamp(elapsed, BOOT_LOGO_FADE_START_MS, BOOT_LOGO_OUT_MS));
  }

  // --- Draw the logo + footer (white, right side) ---
  // Resolution-independent layout: center at (0.734 W, 0.532 H), width 0.365 W,
  // native texture aspect preserved.
  const allReady = bootAssetsReady >= BOOT_ASSET_COUNT;
  if (allReady && mainA > 0.001) {
    const tW = 700, tH = 350;             // native texture dims (HD)
    const dW = 0.365 * cW;
    const dH = dW * (tH / tW);
    const cx = 0.734 * cW;
    const cy = 0.532 * cH;
    const dx = cx - dW / 2, dy = cy - dH / 2;

    // ---- LEFT-TO-RIGHT REVEAL WIPE ----
    // Measured on real.mp4 (per-third glyph contrast): during the reveal the
    // LEFT third of the logo (the PS sphere) is fully bright while the RIGHT
    // third ("3") is still dark, equalizing only at the end:
    //   t=2.4 L/R~180, t=3.0 L/R~3.0, t=3.4 L/R~1.55, t=3.6 L/R~0.94.
    // So a soft reveal FRONT sweeps L->R across the logo over the reveal window
    // (IN_START..FULL). Outside that window the logo is fully present and fades
    // out uniformly. Implemented by drawing the (white) logo+footer into an
    // offscreen buffer and masking with a horizontal alpha gradient via
    // destination-in, then compositing the result at the overall fade alpha.
    const inReveal = elapsed < BOOT_LOGO_FULL_MS;
    if (inReveal) {
      // Reveal front position in [0,1] across the logo box, with a soft edge.
      // revealU advances 0->1 over the reveal window. The gradient is fully
      // opaque behind the front and transparent ahead of it, with a soft
      // EDGE_W-wide ramp. Front travels slightly past 1 so the right edge
      // completes (and a margin before so the left starts already lit).
      // Wide SOFT reveal front. The whole logo brightens gently L->R: with a
      // wide soft edge the LEFT third reaches full ~0.25s before the RIGHT
      // third, and both peak together at BOOT_LOGO_FULL_MS, matching real.mp4
      // (left leads right by ~0.25s over the ~1.1s sweep).
      const EDGE_W = 1.6;                  // soft edge width (fraction of box)
      const revealU = bootRamp(elapsed, BOOT_LOGO_IN_START_MS, BOOT_LOGO_FULL_MS);
      const front = revealU * (1.0 + EDGE_W) ; // 0 -> 1+EDGE_W
      if (bootLogoBuf.width !== cW || bootLogoBuf.height !== cH) {
        bootLogoBuf.width = cW; bootLogoBuf.height = cH;
      }
      const b = bootLogoBufCtx;
      b.setTransform(1, 0, 0, 1, 0, 0);
      b.globalCompositeOperation = 'source-over';
      b.clearRect(0, 0, cW, cH);
      b.globalAlpha = 1;
      b.drawImage(BOOT_LOGO_WHITE, dx, dy, dW, dH);
      b.drawImage(BOOT_FOOTER_WHITE, dx, dy, dW, dH);
      // Horizontal reveal mask: opaque to the left of the front, fading to
      // transparent over EDGE_W to the right of it. Spans the logo box width.
      const g = b.createLinearGradient(dx, 0, dx + dW, 0);
      const lit = Math.max(0, Math.min(1, front - EDGE_W));
      const dark = Math.max(0, Math.min(1, front));
      g.addColorStop(0, 'rgba(0,0,0,1)');
      g.addColorStop(lit, 'rgba(0,0,0,1)');
      if (dark > lit) g.addColorStop(dark, 'rgba(0,0,0,0)');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      b.globalCompositeOperation = 'destination-in';
      b.fillStyle = g;
      b.fillRect(dx, dy, dW, dH);
      b.globalCompositeOperation = 'source-over';
      // Composite the masked logo onto bootCanvas at the overall fade alpha.
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = mainA;
      c.drawImage(bootLogoBuf, 0, 0);
      c.globalAlpha = 1;
    } else {
      // Fully revealed: uniform alpha (hold, then fade out as the bg comes up).
      c.globalCompositeOperation = 'source-over';
      c.globalAlpha = mainA;
      c.drawImage(BOOT_LOGO_WHITE, dx, dy, dW, dH);
      c.drawImage(BOOT_FOOTER_WHITE, dx, dy, dW, dH);
      c.globalAlpha = 1;
    }
  }

  // ---- Photosensitivity / epilepsy WARNING screen ----
  // Hard-cut in at 6090 ms, hold, hard-cut out at 8720 ms. Composited over the
  // dimmed LOW live wave + gradient (already rendered underneath -- NOT a black
  // plate, NOT a blur plate). White text, left-aligned block, no dividers/icon/
  // footer. warning_screen_spec.md sections 2, 3, 6.
  if (elapsed >= BOOT_WARN_IN_MS && elapsed < BOOT_WARN_OUT_MS) {
    // The warning TEXT LAYOUT is unchanged from the firmware reference -- same
    // per-axis scaling, font, pitch and left-aligned wrap (title + 3 body lines)
    // as before -- only its POSITION changes: the whole block is centred in the
    // frame (by its actual text extent, both axes) so it stays centred for any
    // aspect ratio, orientation or simulated resolution. The old code pinned the
    // block to a fixed left edge (x=320 ref) which drifted off-centre in
    // portrait / non-16:9 frames.
    const sx = cW / 1920, sy = cH / 1080;
    const fontPx  = Math.round(24 * sy);
    const pitch   = 34 * sy;
    const blockW  = 1280 * sx;     // wrap width (= the reference 320..1600 block)
    c.save();
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.globalCompositeOperation = 'source-over';
    // Pure opaque WHITE (#FFFFFF), 100% opacity, HARD CUT in/out (the fade is on
    // the BACKGROUND, not the text). Soft dark shadow for legibility.
    c.globalAlpha = 1.0;
    c.fillStyle = '#FFFFFF';
    c.shadowColor = 'rgba(0,0,0,0.55)';
    c.shadowBlur = 4 * sy;
    c.shadowOffsetX = 0;
    c.shadowOffsetY = 2 * sy;
    c.textAlign = 'left';
    c.textBaseline = 'alphabetic';
    const warnFont = fontPx + "px 'SCE-PS3 Rodin','Rodin',sans-serif";
    c.font = warnFont;
    // Word-wrap the body to the block width (same break points as the firmware).
    const lines = [BOOT_WARN_TITLE];
    const words = BOOT_WARN_BODY.split(' ');
    let line = '';
    for (let i = 0; i < words.length; i++) {
      const test = line ? line + ' ' + words[i] : words[i];
      if (c.measureText(test).width > blockW && line) { lines.push(line); line = words[i]; }
      else line = test;
    }
    if (line) lines.push(line);
    // Centre the block by its ACTUAL text extent (longest line), keeping the
    // text left-aligned within. Vertically centre the block too.
    let maxW = 0;
    for (let i = 0; i < lines.length; i++) maxW = Math.max(maxW, c.measureText(lines[i]).width);
    const blockX = (cW - maxW) / 2;
    let baseY = (cH - lines.length * pitch) / 2 + fontPx;
    for (let i = 0; i < lines.length; i++) { c.fillText(lines[i], blockX, baseY); baseY += pitch; }
    c.restore();
  }

  c.restore();

  // Suppress the XMB UI (icons/menu/clock) until the post-warning hand-off.
  // The wave and gradient ARE rendered throughout (drawBG runs every frame).
  // The XMB UI is allowed in only once the warning is gone (the wave/gradient are
  // already at full steady level by 6000, so the hand-off is seamless).
  // Real capture: XMB icons appear ~f130 (12190 ms); suppress UI until then.
  return elapsed < BOOT_UI_IN_MS;
}

// Apply a SEAMLESS background blur to the #bg + #wave canvases. A raw CSS
// filter:blur darkens the screen EDGES, because the blur kernel samples the
// transparent area outside the canvas -> a dark border the real XMB does not
// have (epilepsy warning, System Update, submenus). Compensate by scaling the
// canvases up so the blurred dark edge is pushed just off-screen, giving a blur
// that reads seamless to all four edges. px <= 0 clears both filter + transform.
function applyBgBlur(px) {
  const f = px > 0.05 ? ('blur(' + px.toFixed(2) + 'px)') : '';
  // Overscan ~2x the blur radius on each edge; uniform scale keyed to the
  // shorter half-dimension (1080/2 = 540) so BOTH axes are fully covered.
  const t = px > 0.05 ? ('scale(' + (1 + (px * 2.0) / 540).toFixed(4) + ')') : '';
  for (let ci = 0; ci < 2; ci++) {
    const c = ci === 0 ? bgCanvas : waveCanvas;
    if (!c) continue;
    if (c.style.filter !== f) c.style.filter = f;
    if (c.style.transform !== t) c.style.transform = t;
  }
}

function frame(now) {
  if (!lastT) lastT = now;
  const dt = Math.min(now - lastT, 50); // cap delta to avoid jumps
  lastT = now;
  processKeyRepeat(now);

  // BOOT INTRO: the firmware-derived coldboot animation. The logo/footer/blur
  // draw on the dedicated z-index-3 overlay (bootCanvas); the wave + gradient
  // render on their own #bg/#wave canvases UNDERNEATH, modulated by the boot
  // phase globals (bootGradientBrightness / bootWave*), so the wave swells
  // visibly beneath the fading logo. Only the XMB UI (icons/menu/clock) is
  // suppressed until the hand-off. ?noboot skips the intro entirely.
  let bootSuppressUI = false;
  if (BOOT_SKIP_VIA_PARAM) {
    if (!bootIntroDone) {
      bootIntroDone = true; bootCanvas.style.display = 'none';
      bootBgBlurPx = 0.0;
      // ?noboot never runs drawBootIntro (which clears the canvas filters), so
      // clear any blur here too -- the wave/bg must never be left soft.
      applyBgBlur(0);
    }
  } else {
    bootSuppressUI = drawBootIntro(now);
  }

  drawBG(dt);

  // ---- BOOT WARNING BACKGROUND BLUR ----
  // Apply the warning-gated gaussian blur (bootBgBlurPx, set in drawBootIntro)
  // to the #bg + #wave background canvases via a CSS filter. The warning text
  // (bootCanvas, z3) and the XMB UI (#xmb) stay SHARP. Only touch the style
  // when the value changes to avoid redundant style recalcs. Cleared to '' at
  // boot-done. drawBootIntro leaves bootBgBlurPx at 0 outside the warning.
  if (!bootIntroDone) {
    applyBgBlur(bootBgBlurPx > 0.05 ? bootBgBlurPx : 0);
  } else {
    // SYSTEM UPDATE (live-wave dialog) BACKDROP BLUR.
    // The real PS3 blurs the WHOLE live gradient + wave behind the System
    // Update dialog (the purple gradient still reads through, but the wave
    // detail is gaussian-soft). Because the wave/gradient live on their own
    // canvases (#bg z0, #wave z1) BEHIND the dialog layer (#xmb z2), the only
    // way to soften them is a CSS filter on those canvases. Ramp the blur with
    // the same transition progress that drives the dialog fade + chrome
    // zoom-out so the sharpen/soften stays perfectly synced:
    //   ENTER : blur 0 -> BACKDROP_BLUR_PX as the dialog fades in.
    //   EXIT  : blur BACKDROP_BLUR_PX -> 0 as the dialog fades out (sharpens).
    // Outside any live-wave dialog the filter is forced back to '' so the
    // steady wave is always crisp.
    const BACKDROP_BLUR_PX = 9;
    let blurProg = 0;
    if (dialogState && isLiveWaveDlg(dialogState.template)) {
      const a = dialogState.anim;
      blurProg = a ? Math.min(1, (now - a.start) / a.dur) : 1;
    } else if (dialogClosing && isLiveWaveDlg(dialogClosing.template)) {
      blurProg = 1 - Math.min(1, (now - dialogClosing.start) / dialogClosing.dur);
    }
    // SUBMENU depth-of-field blur: the real XMB blurs the bg + wave when you
    // descend into a submenu and sharpens it again on exit (verified in
    // /work/submenu.mp4). Ramp with the submenu enter/exit animation; hold full
    // while settled in a submenu. Take the max with any dialog blur so an open
    // dialog inside a submenu doesn't un-blur the backdrop.
    {
      let submenuBlur = 0;
      const inSub = (typeof stack !== 'undefined') && stack.length > 0;
      if (submenuAnim) {
        const sp = Math.min(1, (now - submenuAnim.start) / submenuAnim.dur);
        submenuBlur = (submenuAnim.dir === 1) ? sp : (1 - sp);
      } else if (inSub) {
        submenuBlur = 1;
      }
      blurProg = Math.max(blurProg, submenuBlur);
    }
    // Seamless blur (scales the canvases to hide the CSS-blur dark edge). px=0
    // clears it. Idempotent, so a closed dialog / exited submenu sharpens fully.
    applyBgBlur(blurProg > 0.001 ? (blurProg * BACKDROP_BLUR_PX) : 0);
  }

  // While the boot intro still owns the screen, render only the wave/gradient
  // (done above) and the boot overlay; keep the XMB UI hidden until hand-off.
  if (bootSuppressUI) {
    requestAnimationFrame(frame);
    return;
  }

  // Bump the icon-glass frame counter so the next renderGlassIconWebGL call
  // re-uploads the freshly-drawn waveCanvas as the refraction source.
  newGlassFrame();

  const blend = shouldBlendInterframe();

  // Snapshot the prior xmbCanvas BEFORE drawXMB clears it. The snapshot is
  // re-composited onto the freshly cleared canvas at alpha=0.2 as the
  // BASE layer, then drawXMB's new geometry draws on top at full alpha.
  // Where the new geometry covers, the new pixels dominate; where the new
  // geometry leaves transparency (e.g. an icon moved away from its prior
  // position) the prior pixel persists at 20% intensity. This matches the
  // PS3 RTT pipeline (see V.BLEND_PREV_ALPHA docstring).
  if (blend && xmbPrevValid) {
    // Device-pixel-sized 1:1 snapshot of the visible XMB layer.
    xmbPrevCtx.setTransform(1, 0, 0, 1, 0, 0);
    xmbPrevCtx.globalCompositeOperation = 'copy';
    xmbPrevCtx.drawImage(xmbCanvas, 0, 0);
    xmbPrevCtx.globalCompositeOperation = 'source-over';
  }

  drawXMB(now);

  if (blend && xmbPrevValid) {
    // Composite the snapshot UNDER the freshly drawn XMB content. drawXMB
    // already cleared and drew new pixels; using destination-over lets the
    // prior snapshot fill only the now-transparent regions (areas where
    // the prior frame had content but the new frame does not), producing
    // the trailing ghost effect on icons/text that moved this frame.
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'destination-over';
    ctx.globalAlpha = V.BLEND_PREV_ALPHA;
    ctx.drawImage(xmbPrevCanvas, 0, 0);
    ctx.restore();
  }

  // Live-wave dialogs (System Update) fully replace the XMB cross-bar/Settings
  // column. During the enter cross-fade the chrome fades OUT as the dialog
  // fades IN; once settled the chrome is gone entirely. Likewise on exit the
  // chrome fades back in as the dialog fades out. We implement the chrome side
  // of the cross-fade by erasing the just-drawn XMB layer with a fade that
  // tracks the dialog's open progress.
  const lwDlg = (dialogState && isLiveWaveDlg(dialogState.template)) ||
                (dialogClosing && isLiveWaveDlg(dialogClosing.template));
  if (lwDlg) {
    // chromeGone runs 0->1 on ENTER (chrome present -> fully gone) and 1->0 on
    // EXIT (chrome absent -> fully back). The XMB chrome (icon row, clock,
    // Settings items) is the only content on xmbCanvas; the wave lives in a
    // separate canvas behind us, so xmbCanvas IS the chrome layer.
    let chromeGone;
    if (dialogClosing) {
      const p = Math.min(1, (now - dialogClosing.start) / dialogClosing.dur);
      chromeGone = 1 - p; // exit: chrome fading back in
    } else {
      const ds = dialogState;
      chromeGone = ds.anim ? Math.min(1, (now - ds.anim.start) / ds.anim.dur) : 1;
    }
    // Fix 3 - zoom + fade the chrome instead of a flat opacity erase.
    //   ENTER : as chromeGone 0->1 the chrome scales 1.00 -> ~1.09 (centered)
    //           while its opacity drops 1 -> 0.
    //   EXIT  : chromeGone 1->0 so the chrome scales ~1.09 -> 1.00 while its
    //           opacity rises 0 -> 1 (zoom-down + fade-in).
    // Both keyed to the same progress so they stay perfectly synced with the
    // dialog fade-in and the background blur ramp (drawDialog, `ap`).
    const ZOOM_MAX = 0.09; // 1.00 -> 1.09
    if (chromeGone <= 0.0005) {
      // Chrome fully present (settled / pre-enter): leave xmbCanvas untouched.
    } else if (chromeGone >= 0.9995) {
      // Chrome fully gone (settled inside dialog): clear it entirely.
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, xmbCanvas.width, xmbCanvas.height);
      ctx.restore();
    } else {
      const chromeOpacity = 1 - chromeGone;       // visible fraction
      const sc = 1 + ZOOM_MAX * chromeGone;        // scale factor
      const W = xmbCanvas.width, H = xmbCanvas.height;
      // Snapshot the freshly drawn chrome (1:1 device pixels).
      chromeXfadeCtx.setTransform(1, 0, 0, 1, 0, 0);
      chromeXfadeCtx.globalCompositeOperation = 'copy';
      chromeXfadeCtx.globalAlpha = 1;
      chromeXfadeCtx.drawImage(xmbCanvas, 0, 0);
      chromeXfadeCtx.globalCompositeOperation = 'source-over';
      // Clear the live canvas and redraw the snapshot scaled about the center
      // at reduced opacity. Scaling about center matches the reference where
      // the whole icon row + clock grow uniformly outward as they fade.
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = chromeOpacity;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.translate(W / 2, H / 2);
      ctx.scale(sc, sc);
      ctx.translate(-W / 2, -H / 2);
      ctx.drawImage(chromeXfadeCanvas, 0, 0);
      ctx.restore();
    }
  }

  // Modal overlays render last so they sit on top of the XMB. The landing
  // page is a full opaque replacement; the dialog is a translucent panel.
  if (landingState) drawLanding(ctx);
  if (wizState) { wizTick(now); }
  if (wizState) {
    drawWizard(ctx);
  } else if (dialogState) {
    drawDialog(ctx);
  } else if (dialogClosing) {
    // Exit cross-fade: keep drawing the (live-wave) dialog at decreasing
    // opacity until the close animation completes, then drop it.
    const p = Math.min(1, (now - dialogClosing.start) / dialogClosing.dur);
    drawDialogClosing(ctx, p);
    if (p >= 1) dialogClosing = null;
  }

  // Mark the just-drawn xmbCanvas as the valid "previous" for next frame.
  // Even outside active animations we keep this updated so the FIRST frame
  // of a new scroll has a valid baseline to blend against.
  xmbPrevValid = true;

  requestAnimationFrame(frame);
}

initWebGL();
initIconGlass();
resize();

// Wait for PS3 Rodin fonts to load before starting the render loop
// so the first frame uses Rodin instead of the sans-serif fallback.
if (document.fonts && document.fonts.load) {
  Promise.all([
    document.fonts.load("16px PS3"),
    document.fonts.load("bold 16px PS3"),
    document.fonts.load("300 16px PS3"),
  ]).then(() => requestAnimationFrame(frame))
    .catch(() => requestAnimationFrame(frame));
} else {
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
