    speed: 0.06 + l * 0.012,
    diagSlope: -0.04 + l * 0.006,
    brightness: 0.4 + (l % 3) * 0.12
  });
}

const canvasParticles = [];
for (let i = 0; i < 120; i++) {
  const nearWave = Math.random() < 0.7;
  canvasParticles.push({
    x: Math.random() * V.W,
    y: nearWave ? V.H * (0.38 + Math.random() * 0.3) : Math.random() * V.H,
    vx: (Math.random() - 0.5) * 0.15,
    vy: (Math.random() - 0.5) * 0.1,
    size: 0.8 + Math.random() * 1.5,
    phase: Math.random() * Math.PI * 2,
    brightness: nearWave ? 0.5 + Math.random() * 0.5 : 0.2 + Math.random() * 0.4
  });
}

function drawBGFallback(dt) {
  waveT += dt * 0.001 * 4 * 0.05;
  const w = V.W, h = V.H;
  bgCtx.clearRect(0, 0, w, h);
  bgCtx.fillStyle = '#000003';
  bgCtx.fillRect(0, 0, w, h);
  if (monthBgLoaded) {
    bgCtx.save();
    bgCtx.globalAlpha = 0.7;
    bgCtx.drawImage(monthBgImg, 0, 0, w, h);
    bgCtx.globalAlpha = 1;
    const darkOverlay = bgCtx.createLinearGradient(0, 0, 0, h);
    darkOverlay.addColorStop(0, 'rgba(0,0,3,1)');
    darkOverlay.addColorStop(0.3, 'rgba(0,0,3,0.97)');
    darkOverlay.addColorStop(0.5, 'rgba(0,0,3,0.65)');
    darkOverlay.addColorStop(0.7, 'rgba(0,0,3,0.2)');
    darkOverlay.addColorStop(1, 'rgba(0,0,3,0)');
    bgCtx.fillStyle = darkOverlay;
    bgCtx.fillRect(0, 0, w, h);
    bgCtx.restore();
  }
  for (let l = 0; l < canvasWaveLines.length; l++) {
    const wl = canvasWaveLines[l];
    const pts = wl.pts;
    const cpX = [], cpY = [];
    for (let p = 0; p < pts.length; p++) {
      const x = (p / (pts.length - 1)) * (w + 200) - 100;
      const yOff = Math.sin(waveT * wl.speed + pts[p].phase) * pts[p].amp
        + Math.sin(waveT * wl.speed * 0.5 + pts[p].phase * 1.3) * pts[p].amp * 0.3
        + Math.cos(waveT * wl.speed * 0.2 + pts[p].phase * 0.7 + l * 0.5) * pts[p].amp * 0.15;
      cpX.push(x);
      cpY.push(pts[p].baseY + yOff + x * wl.diagSlope);
    }
    function drawWavePath() {
      bgCtx.beginPath();
      bgCtx.moveTo(cpX[0], cpY[0]);
      for (let p = 0; p < cpX.length - 1; p++) {
        const x0 = cpX[p], y0 = cpY[p], x1 = cpX[p+1], y1 = cpY[p+1];
        const dx = (x1 - x0) * 0.33;
        const t0 = p > 0 ? (cpY[p+1] - cpY[p-1]) * 0.18 : (y1-y0) * 0.18;
        const t1 = p < cpX.length-2 ? (cpY[p+2] - cpY[p]) * 0.18 : (y1-y0) * 0.18;
        bgCtx.bezierCurveTo(x0+dx, y0+t0, x1-dx, y1-t1, x1, y1);
      }
    }
    const passes = [
      { w: 18, a: wl.brightness * 0.03 },
      { w: 8,  a: wl.brightness * 0.06 },
      { w: 3,  a: wl.brightness * 0.14 },
      { w: 1.2, a: wl.brightness * 0.22 },
    ];
    for (const pass of passes) {
      bgCtx.save();
      drawWavePath();
      bgCtx.strokeStyle = `rgba(200,196,210,${pass.a})`;
      bgCtx.lineWidth = pass.w;
      bgCtx.lineCap = 'round';
      bgCtx.lineJoin = 'round';
      bgCtx.stroke();
      bgCtx.restore();
    }
  }
  for (const p of canvasParticles) {
    p.x += p.vx * 0.3;
    p.y += p.vy * 0.3;
    p.phase += 0.002;
    if (p.x < -10) p.x = w + 10;
    if (p.x > w + 10) p.x = -10;
    if (p.y < -10) p.y = h + 10;
    if (p.y > h + 10) p.y = -10;
    const twinkle = 0.5 + 0.5 * Math.sin(waveT * 1.5 + p.phase);
    const alpha = p.brightness * twinkle * 0.6;
    if (alpha < 0.05) continue;
    bgCtx.save();
    bgCtx.globalAlpha = alpha;
    bgCtx.fillStyle = '#fff';
    bgCtx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size);
    bgCtx.restore();
  }
}

// Unified drawBG that dispatches to WebGL or canvas fallback
function drawBG(dt) {
  if (webglAvailable) {
    drawBGWebGL(dt);
  } else {
    drawBGFallback(dt);
  }
}

// =====================================================
// CINFO (HOVER) BACKGROUND
// =====================================================
// Returns the HOVER_BG-mapped url for the currently focused item, or null.
// We only show a hover bg in idle XMB state (no submenu slide, no modal).
function currentHoverBgUrl() {
  if (dialogState || landingState) return null;
  if (submenuAnim) return null;
  const items = curItems();
  if (!items || !items[ii]) return null;
  const name = items[ii].n;
  return HOVER_BG[name] || null;
}

// Advance the cinfo dwell/alpha state machine and draw the bg image. Called
// from drawXMB right after clearing the canvas, before items so the bg sits
// under the XMB UI but on top of the gradient/wave (XMB canvas is z-index 2,
// wave is z-index 1, bg is z-index 0; this draw is on the XMB canvas which is
// what the items render onto).
function updateCinfoBg(now) {
  const focusUrl = currentHoverBgUrl();
  // Use the item name as the focus key so distinct items with the same bg
  // (e.g. Sign Up and Account Management both use signup.jpg) still reset
  // the dwell timer when the user moves between them.
  const items = curItems();
  const focusKey = (focusUrl && items && items[ii]) ? items[ii].n : null;

  // Focus change: reset dwell + record new focus.
  if (focusKey !== cinfoBg.focusedKey) {
    cinfoBg.focusedKey = focusKey;
    cinfoBg.dwellStart = now;
  }

  // Decide target alpha for this frame.
  let targetAlpha = 0;
  let targetUrl = cinfoBg.currentUrl;
  if (focusKey && focusUrl) {
    const dwellElapsed = now - cinfoBg.dwellStart;
    if (dwellElapsed >= HOVER_BG_DWELL_MS) {
      // Past the dwell threshold: fade in.
      targetAlpha = HOVER_BG_MAX_ALPHA;
      targetUrl = focusUrl;
      // Kick off image load early.
      getCinfoBg(focusUrl);
    }
  }

  // dt-based alpha tween toward target.
  if (!cinfoBg.lastAlphaT) cinfoBg.lastAlphaT = now;
  const dt = Math.max(0, now - cinfoBg.lastAlphaT);
  cinfoBg.lastAlphaT = now;
  const dur = targetAlpha > cinfoBg.alpha ? HOVER_BG_FADE_IN_MS : HOVER_BG_FADE_OUT_MS;
  const step = dt / dur;
  if (targetAlpha > cinfoBg.alpha) {
    cinfoBg.currentUrl = targetUrl;  // commit url on fade-in
    cinfoBg.alpha = Math.min(targetAlpha, cinfoBg.alpha + step * HOVER_BG_MAX_ALPHA);
  } else if (targetAlpha < cinfoBg.alpha) {
    cinfoBg.alpha = Math.max(0, cinfoBg.alpha - step * HOVER_BG_MAX_ALPHA);
    if (cinfoBg.alpha <= 0.001) {
      cinfoBg.alpha = 0;
      cinfoBg.currentUrl = null;
    }
  }
}

function drawCinfoBg(ctx2) {
  if (cinfoBg.alpha <= 0.001 || !cinfoBg.currentUrl) return;
  const entry = getCinfoBg(cinfoBg.currentUrl);
  if (!entry.loaded) return;
  ctx2.save();
  ctx2.globalAlpha = cinfoBg.alpha;
  // COVER the full visible frame at the image's true aspect (crop, never
  // stretch). The frame width is XCF(V.W) (wider than V.W in 21:9), so a plain
  // 0..V.W draw would leave the right region uncovered.
  const fw = Math.max(V.W, XCF(V.W)), fh = frameHV(), im = entry.img;
  const ir = im.width / im.height, fr = fw / fh;
  let sw, sh, sx, sy;
  if (ir > fr) { sh = im.height; sw = sh * fr; sx = (im.width - sw) / 2; sy = 0; }
  else { sw = im.width; sh = sw / fr; sx = 0; sy = (im.height - sh) / 2; }
  ctx2.drawImage(im, sx, sy, sw, sh, 0, frameTopV(), fw, fh);
  ctx2.restore();
}

// =====================================================
// XMB RENDERING
// =====================================================
function drawXMB(now) {
  // Clear the FULL visible frame width. In wide aspect ratios (21:9) the frame
  // extends past V.W in virtual space (to V.W*LAYOUT_FIT), so a V.W-wide clear
  // would leave the right region uncleared -> smearing/artefacts on scroll.
  // Clear the FULL visible frame. Width extends past V.W in 21:9 (XCF). In
  // portrait the frame is taller than the 1080 design (LAYOUT_VFIT > 1) and is
  // shifted by LAYOUT_VOFF, so clear from the frame's true top for the full
  // frame height -- otherwise the head/foot bands keep stale content.
  ctx.clearRect(-2, -LAYOUT_VOFF - 2,
                Math.max(V.W, XCF(V.W)) + 4, V.H * LAYOUT_VFIT + 4);

  // Cinfo hover background (fades in after HOVER_BG_DWELL_MS dwell on a HOVER_BG-mapped item).
  // Drawn on the XMB canvas so it sits above the gradient/wave (z 0/1) but
  // below the rest of the XMB elements drawn below in this function.
  updateCinfoBg(now);
  drawCinfoBg(ctx);

  // Process animations (state already updated, just animate visual offset)
  let catOffset = 0;
  if (catAnim) {
    const r = animProgress(catAnim, now);
    catOffset = r.val;
    if (r.done) catAnim = null;
  }

  // itemAnim auto-clear: the actual interpolation is per-item inside
  // drawItemList (via fromIdx/eased progress); we only need to null it out
  // once duration has elapsed so navItem can fire again.
  if (itemAnim) {
    const elapsed = now - itemAnim.start;
    if (elapsed >= itemAnim.dur) itemAnim = null;
  }
  // itemDescAnim has a separate longer duration than itemAnim - clear it
  // independently so the description crossfade finishes after the slide.
  if (itemDescAnim && now - itemDescAnim.start >= itemDescAnim.dur) {
    itemDescAnim = null;
  }

  // Process submenu slide animation
  let slideProgress = null; // null = no animation, 0..1 = animating
  if (submenuAnim) {
    const elapsed = now - submenuAnim.start;
    const t = Math.min(elapsed / submenuAnim.dur, 1);
    // Per-anim ease override (e.g. Hermite-weighted from observation)
    slideProgress = submenuAnim.ease ? submenuAnim.ease(t) : ease(t);
    if (t >= 1) submenuAnim = null;
  }

  // Input-lock release: clear lock once all relevant anims have finished,
  // or once the deadline has elapsed (whichever comes first). This avoids
  // dead locks if an anim somehow lingers, and ensures queued input plays
  // back at the right moment.
  if (inputLock) {
    const anyAnim = !!(catAnim || itemAnim || submenuAnim);
    if (!anyAnim || now >= inputLockUntil) {
      releaseInputLock();
    }
  }

  // Snapshot the submenu state AFTER releasing the input lock: releaseInputLock()
  // may replay a queued enter()/back() that pushes or pops `stack`, so reading it
  // any earlier would leave inSubmenu out of sync with the stack and crash
  // drawParentLayer below (stack[len-1] would be undefined).
  const inSubmenu = stack.length > 0;

  // === DRAW CATEGORY ICONS ===
  // PS3 behavior: in submenu the category bar dims/shifts; only the active
  // category icon stays visible (others hidden), pulled up-left.
  // Smooth submenu factor subT (0 = full XMB, 1 = settled in submenu), ANIMATED
  // through the enter/exit slide so the category bar transition matches the real
  // XMB (verified /work/submenu.mp4): on enter the active category icon glides to
  // the top-left corner and enlarges while the OTHER category icons fade away; on
  // exit it reverses. Previously this was an instant boolean (others hard-hidden),
  // which skipped the whole category animation.
  let subT;
  if (submenuAnim) {
    const sp = (slideProgress != null) ? slideProgress : 0;
    subT = (submenuAnim.dir === 1) ? sp : (1 - sp);
  } else {
    subT = inSubmenu ? 1 : 0;
  }
  const catSubShift = -V.CAT_SUBMENU_SHIFT_X * subT;
  const catSubScale = 1 + (V.CAT_SUBMENU_SCALE - 1) * subT;
  const catSubAlpha = 1 + (V.CAT_SUBMENU_ALPHA - 1) * subT;
  const catSubYShift = V.CAT_SUBMENU_Y_SHIFT * subT;
  // Post-warning staged reveal (boot intro). bootLabelReveal/bootIconReveal are
  // 1.0 except during the [BOOT_UI_IN_MS, BOOT_SEQ_END_MS] window, when the
  // category LABEL fades in first, then the icon row CASCADES up. Per-icon
  // stagger is keyed to distance from the active icon (the active icon leads,
  // neighbours follow), and each icon rises a few px as it fades in. ITEM list
  // (right column) follows the icon reveal.
  const inBootReveal = bootIconReveal < 0.999 || bootLabelReveal < 0.999;
  for (let i = 0; i < DATA.length; i++) {
    const isActive = (i === ci);
    // Non-active categories FADE OUT as we descend into the submenu (and fade
    // back in on exit) instead of hard-hiding; the active one stays and moves to
    // the corner. nonActiveSubFade 1 -> 0 across the enter slide.
    const nonActiveSubFade = isActive ? 1 : (1 - subT);
    if (nonActiveSubFade <= 0.002) continue;

    const dx = (i - ci) * V.CAT_SPACING + catOffset;
    const baseSz = isActive ? V.CAT_ICON_ACTIVE : V.CAT_ICON_INACTIVE;
    const sz = baseSz * catSubScale;
    const x = V.CAT_X + dx + catSubShift;
    // Active icon center sits ~10px above inactive icons (firmware behavior captured
    // from RPCS3 reference). This creates the proper clearance for the label below.
    // Only applied in the normal XMB state (not submenu, where the active icon is
    // already shifted to its corner position with its own offset semantics).
    const activeYOffset = isActive ? V.CAT_Y_ACTIVE_OFFSET * (1 - subT) : 0;
    const y = V.CAT_Y + catSubYShift + activeYOffset;

    if (x < -120 || x > V.W + 120) continue;

    const catDist = Math.abs(i - ci);
    let alpha;
    if (isActive) alpha = 1.0;
    else if (catDist <= 2) alpha = V.CAT_INACTIVE_ALPHA;
    else alpha = V.CAT_FAR_ALPHA;
    alpha *= catSubAlpha * nonActiveSubFade;

    // Boot-reveal cascade: stagger each icon by its distance from the active
    // icon so the active leads and neighbours follow; fade + rise a few px.
    let revealA = 1.0, revealRise = 0.0;
    if (inBootReveal) {
      const stagger = Math.min(1, Math.abs(i - ci) * 0.18);
      // remap bootIconReveal through the per-icon stagger window [stagger, 1].
      let ir = (bootIconReveal - stagger) / Math.max(0.001, 1 - stagger);
      ir = Math.max(0, Math.min(1, ir));
      ir = ir * ir * (3 - 2 * ir);
      revealA = ir;
      revealRise = (1 - ir) * 14;   // rise from +14px up into place
    }

    const ic = getIcon(DATA[i].icon);
    ctx.globalAlpha = alpha * revealA;

    if (ic.loaded || ic.normalMapReady) {
      // Apply per-icon scale (PSN/PS Store icons have higher fill ratio and
      // need a smaller draw size to visually match the rest of the set).
      const csz = sz * iconScale(DATA[i].icon);
      // Drop shadow on the category icons (real XMB: the top-bar icons carry a
      // soft dark shadow for legibility over the wave, like the clock).
      ctx.shadowColor = 'rgba(0,0,0,0.40)';
      ctx.shadowBlur = 4;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 2;
      drawIconAt(ctx, ic, DATA[i].icon, XCL(x, csz / 2), y - csz / 2 + revealRise, csz, csz);
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
    }

    // Category label - on the active category. In the submenu the real XMB
    // keeps the category name (e.g. "Settings") under the breadcrumb icon at
    // reduced opacity (verified sub_system_real_top.png), so fade it toward a
    // faint level rather than to zero.
    if (isActive) {
      // 0.9 in the full XMB, easing down to ~0.4 once settled in the submenu.
      ctx.globalAlpha = 0.9 * bootLabelReveal * (1 - 0.55 * subT);
      ctx.fillStyle = 'rgb(225,210,235)';
      ctx.font = '300 ' + V.CAT_LABEL_SIZE + 'px PS3';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      ctx.fillText(DATA[i].name, XCP(x), V.CAT_LABEL_Y);
    }
  }

  ctx.globalAlpha = 1;

  // === Helper to draw an item list at a given x offset and alpha multiplier ===
  // PS3 carousel model:
  //   - Active: fixed at ITEM_FOCUS_Y (515).
  //   - Items below: stacked downward starting at FOCUS_Y + ACTIVE_PAD + SPACING,
  //     then SPACING between each.
  //   - Items above: NOT stacked relative to active (the active item is
  //     scaled up, so there's a large visual gap). Instead they sit ABOVE the
  //     category bar at fixed positions: item-above-1 at ITEM_ABOVE_BASE_Y,
  //     item-above-2 at ITEM_ABOVE_BASE_Y - SPACING, etc. They straddle the
  //     category bar at reduced alpha (ALPHA_INACTIVE), matching PS3 captures.
  //     Measured from settings_full_d05/d08/d10: item-above-1 center ~y=120.
  //
  // animFromIdx/animEase: if both provided, interpolate each item's Y between
  // its position in the previous-selectedIdx layout and the current layout, so
  // items above and below the cursor slide at independent (correct) rates.
  const ITEM_ABOVE_BASE_Y = 120;  // measured: item-above-1 center y in PS3 ref
  function itemSlotY(idx, sel) {
    if (idx === sel) return V.ITEM_FOCUS_Y;
    if (idx < sel) {
      const k = sel - idx;  // k=1 for item-above-1, k=2 for item-above-2, etc.
      return ITEM_ABOVE_BASE_Y - (k - 1) * V.ITEM_SPACING;
    }
    return V.ITEM_FOCUS_Y + V.ITEM_ACTIVE_PAD + (idx - sel) * V.ITEM_SPACING;
  }

  function drawItemList(items, selectedIdx, xShift, alphaMul, yOffset, animFromIdx, animEase, descFadeProgress, descFromIdx) {
    if (!items || !items.length) return;
    // A side-panel chooser (Theme/Color/Background) draws a lavender wash that
    // covers the right edge of the screen where item-value labels normally
    // sit. Suppress those labels so they don't ghost through the panel.
    const sidePanelActive = !!(dialogState && dialogState.template
                              && dialogState.template.panel === true);
    const useAnim = (animFromIdx !== undefined && animFromIdx !== null
                     && animEase !== undefined && animEase !== null
                     && animFromIdx !== selectedIdx);
    // Description crossfade: descFadeProgress runs 0..1 over ITEM_DESC_FADE_MS.
    // - NEW active (selectedIdx) renders its description at alpha = progress.
    // - OLD active (descFromIdx) renders its description at alpha = 1 - progress.
    // Note: descFromIdx is only meaningful when it differs from selectedIdx
    // and a description fade is in flight.
    const descFading = (descFadeProgress !== undefined && descFadeProgress !== null
                       && descFromIdx !== undefined && descFromIdx !== null
                       && descFromIdx !== selectedIdx);
    const descNewAlpha = descFading ? descFadeProgress : 1.0;
    const descOldAlpha = descFading ? (1.0 - descFadeProgress) : 0.0;
    // Active-item glow pulse. The firmware PAF system animates fo_lbl_alpha
    // (explore vaddr 0x248700) for the focused item. We translate that into
    // a sine-driven oscillation of the text glow's halo alpha, giving the
    // active item a subtle breathing quality. Pulse only applies to the
    // SETTLED active item - during item motion the glow stays at its base
    // brightness so the slide reads as motion, not as a pulse. (Cat slide
    // is allowed to keep pulsing because the active item is the SAME
    // semantically; only its container is translating.)
    const itemSettled = !useAnim;
    let pulseOuterA, pulseInnerA;
    if (itemSettled) {
      // 0..1 normalised phase, cos starts at 1 (peak) at the boundary so
      // there is no abrupt jump when the lock releases and the item settles.
      const phase = (now % V.PULSE_PERIOD_MS) / V.PULSE_PERIOD_MS;
      // sine returns -1..1, normalise to 0..1 then lerp between min and max.
      const s = 0.5 * (1 - Math.cos(phase * 2 * Math.PI));
      pulseOuterA = V.PULSE_ALPHA_MIN + (V.PULSE_ALPHA_MAX - V.PULSE_ALPHA_MIN) * s;
      pulseInnerA = V.PULSE_INNER_MIN + (V.PULSE_INNER_MAX - V.PULSE_INNER_MIN) * s;
    } else {
      // During motion, hold the glow at its midpoint to avoid stutter.
      pulseOuterA = 0.5 * (V.PULSE_ALPHA_MIN + V.PULSE_ALPHA_MAX);
      pulseInnerA = 0.5 * (V.PULSE_INNER_MIN + V.PULSE_INNER_MAX);
    }
    const glowOuterColor = 'rgba(255,255,255,' + pulseOuterA.toFixed(3) + ')';
    const glowInnerColor = 'rgba(255,255,255,' + pulseInnerA.toFixed(3) + ')';
    // Night legibility scrim: at night the bright bloomed wave band rides under
    // the sub-item column, so white item text needs a dark drop shadow to keep
    // contrast (the PS3 applies a soft text shadow). nightShadow ramps 0->1 with
    // the day/night blend; at day it stays 0 so the daytime look is unchanged.
    const nightShadow = (typeof currentNightDayBlend !== 'undefined') ? currentNightDayBlend : 0.0;
    for (let i = 0; i < items.length; i++) {
      const isActive = (i === selectedIdx);
      const isPrevActive = descFading && i === descFromIdx;

      // Compute Y position. With per-item animation (item nav), interpolate
      // between the previous slot and the current slot using the eased
      // progress. Otherwise use the single global yOffset (used by submenu
      // slide and idle).
      let y;
      if (useAnim) {
        const newY = itemSlotY(i, selectedIdx);
        const oldY = itemSlotY(i, animFromIdx);
        y = newY + (oldY - newY) * (1 - animEase);
      } else {
        y = itemSlotY(i, selectedIdx) + yOffset;
      }

      // Cull and edge-fade against the FULL visible frame (portrait extends well
      // past the 1080 band, so the list runs the height of the frame). In
      // landscape fTop=0 / fBot=V.H, so this is identical to the old behaviour.
      const fTop = frameTopV(), fBot = fTop + frameHV();
      if (y < fTop - 80 || y > fBot + 80) continue;

      let alpha;
      if (isActive) alpha = V.ALPHA_FOCUS;
      else alpha = V.ALPHA_INACTIVE; // both above and below use uniform inactive alpha

      if (y < fTop + 40) alpha *= Math.max(0, (y - fTop) / 40);
      if (y > fBot - 20) alpha *= Math.max(0, (fBot - y) / 20);
      alpha *= alphaMul;
      if (alpha <= 0.01) continue;

      const ic = getIcon(items[i].i);
      // Submenu items don't scale up on focus (PS3 firmware behavior - submenu items
      // keep small icon since visual emphasis is on text/description/value).
      const isz = inSubmenu
        ? V.ITEM_ICON_SIZE
        : (isActive ? V.ITEM_ICON_ACTIVE : V.ITEM_ICON_SIZE);
      ctx.globalAlpha = alpha;
      if (ic.loaded || ic.normalMapReady) {
        // Per-icon visual scale (PSN/PS Store have less transparent padding).
        const ciz = isz * iconScale(items[i].i);
        const iconX = XCL(V.ITEM_ICON_X + xShift, ciz / 2);
        const iconY = y - ciz / 2;
        drawIconAt(ctx, ic, items[i].i, iconX, iconY, ciz, ciz);
      }

      ctx.fillStyle = 'rgb(235,235,235)';
      // Day baseline shadow (0.4); at night deepen + widen it so inactive item
      // text stays readable over the bright wave band.
      ctx.shadowColor = 'rgba(0,0,0,' + (0.4 + 0.45 * nightShadow).toFixed(3) + ')';
      ctx.shadowBlur = 3 + 3 * nightShadow;
      ctx.shadowOffsetY = 1 + nightShadow;

      if (isActive) {
        // Active item text - bright white with soft white glow halo.
        // The PS3 XMB applies a gaussian-shaped halo (sigma~4.5px @ 1080p,
        // amp ~21% of stroke peak, white) to active item text only.
        // Measured from /work/ps3/xmb_dump/menu_traversal/sub_datetime_d03.png.
        // Inactive items have NO halo (verified at y=675 in same image).
        // Both top-level and submenu active items use ITEM_TEXT_ACTIVE_SIZE
        // (34 px = firmware vaddr 0x271120/0x2713A0/0x271AA0/etc. = 34.0).
        // Weight is Rodin REGULAR, not Bold: measured strokes in reference
        // screenshots are 3-4 px wide which matches Regular at this size
        // (Bold strokes would be 6-8 px). The visual emphasis on active
        // comes from the pure-white color (vs gray inactive) plus the halo.
        const activeSize = V.ITEM_TEXT_ACTIVE_SIZE;
        ctx.font = activeSize + 'px PS3';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';

        ctx.globalAlpha = alpha;
        // Pass 1: WIDE white glow halo. fillText draws both shadow and fill;
        // shadow alpha derives from the fill alpha so we use opaque white
        // text. The fill itself lands on top of any prior pass, then the
        // next pass over-paints it. (Canvas shadows require non-zero source
        // alpha to render -- transparent fill produces no shadow.)
        ctx.fillStyle = 'rgb(255,255,255)';
        ctx.shadowColor = glowOuterColor;
        ctx.shadowBlur = V.TEXT_GLOW_RADIUS;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        ctx.fillText(items[i].n, XCP(V.ITEM_TEXT_X + xShift), y - 1);
        // Pass 2: tighter inner halo (the steep near-text falloff: 89 -> 25
        // over 5 pixels). Same fill, smaller blur radius accumulates close
        // to the strokes without widening the existing outer halo. Both
        // halos breathe in sync via the pulseOuterA/pulseInnerA values
        // computed once per drawItemList call above.
        ctx.shadowColor = glowInnerColor;
        ctx.shadowBlur = V.TEXT_GLOW_INNER_RADIUS;
        ctx.fillText(items[i].n, XCP(V.ITEM_TEXT_X + xShift), y - 1);
        // Pass 3: final crisp text on top. By day there is no dark shadow (the
        // white halo provides ample contrast against the dark background and an
        // extra drop shadow would erode it). At night, the bright bloomed wave
        // band can sit right under the active item; a soft dark shadow that
        // ramps in with nightShadow keeps the white glyph legible without
        // killing the daytime halo (day: shadow alpha 0).
        ctx.shadowColor = 'rgba(0,0,0,' + (0.55 * nightShadow).toFixed(3) + ')';
        ctx.shadowBlur = 4 * nightShadow;
        ctx.shadowOffsetY = nightShadow;
        ctx.fillStyle = 'rgb(255,255,255)';
        ctx.fillText(items[i].n, XCP(V.ITEM_TEXT_X + xShift), y - 1);

        if (items[i].d) {
          // Fade in over ITEM_DESC_FADE_MS so the new active description
          // doesn't snap-in mid-slide.
          ctx.globalAlpha = 0.7 * alphaMul * descNewAlpha;
          const descSize = V.ITEM_DESC_SIZE * DESC_BOOST;
          ctx.font = '300 ' + descSize + 'px PS3';
          // Wrap the subtitle to the FULL available width -- from its start to the
          // frame's right edge (minus a small margin) -- so on narrow frames it
          // makes proper use of the space instead of scrunching into a tiny
          // column. The old 0.60-of-frame cap left only ~130px at 1:1.
          const descStartX = XCP(V.ITEM_TEXT_X + xShift);
          const maxWidth = (LAYOUT_FIT < 0.999)
            ? Math.max(180, XCF(V.W) - descStartX - 50)
            : (V.W - (V.ITEM_TEXT_X + xShift) - 200);
          drawWrappedText(ctx, items[i].d, descStartX,
                          y + V.ITEM_DESC_OFFSET + 4, maxWidth, descSize + 4, 3);
        }

        // NOTE: the real PS3 XMB shows NO '>' chevron after a submenu-parent
        // item's text (verified against /work/realxmb: the active "Date and Time"
        // item has only the left-pointing back-arrow before it, no trailing
        // arrow). Submenu depth is conveyed purely by the column slide. A former
        // '>' indicator here rendered in the MIDDLE of the name (its width was
        // measured at the wrong font) and was inauthentic regardless, so it is
        // removed entirely.

        // Submenu item value indicator (e.g. "Off") at far right.
        // Side-panel choosers (Theme/Color/Background) cover the right side of
        // the screen so this label sits behind the lavender wash. The PS3
        // firmware suppresses the value while the chooser is open; we do the
        // same so the wash doesn't have to be over-opaque to mask it.
        const vActive = resolveItemValue(items[i]);
        if (inSubmenu && vActive && !sidePanelActive) {
          ctx.globalAlpha = alpha;
          ctx.fillStyle = 'rgb(245,240,250)';
          ctx.font = V.ITEM_TEXT_SIZE + 'px PS3';
          ctx.textAlign = 'right';
          ctx.fillText(vActive, XCF(V.W) - V.ITEM_VALUE_RIGHT_PAD, y - 1);
        }
      } else {
        // PS3 inactive items use Rodin Regular weight (matches glyph thickness)
        ctx.font = V.ITEM_TEXT_SIZE + 'px PS3';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(items[i].n, XCP(V.ITEM_TEXT_X + xShift), y);
        // PS3 shows short status descriptions on inactive items (e.g. "8 Images",
        // "*User"), but NOT long help text (e.g. "Adjusts settings for games.").
        // Heuristic: only short status strings (< 20 chars).
        if (items[i].d && items[i].d.length < 20) {
          const prevAlpha = ctx.globalAlpha;
          ctx.globalAlpha = 0.6 * alpha;
          ctx.font = '300 ' + (V.ITEM_TEXT_SIZE - 8) + 'px PS3';
          ctx.fillText(items[i].d, XCP(V.ITEM_TEXT_X + xShift), y + 22);
          ctx.globalAlpha = prevAlpha;
        }
        // Inactive submenu items also show their value (suppressed while a
        // side-panel chooser sits over the right-side label column).
        const vInactive = resolveItemValue(items[i]);
        if (inSubmenu && vInactive && !sidePanelActive) {
          const prevAlpha = ctx.globalAlpha;
          ctx.globalAlpha = alpha;
          ctx.font = V.ITEM_TEXT_SIZE + 'px PS3';
          ctx.textAlign = 'right';
          ctx.fillText(vInactive, V.W - V.ITEM_VALUE_RIGHT_PAD, y);
          ctx.globalAlpha = prevAlpha;
        }
        // NOTE: the real PS3 XMB anchors the help/description text to the ACTIVE
        // row only -- it never renders a previous item's description at that
        // item's scrolled-away position. A former crossfade here drew the prior
        // active item's description at its (now moving) y, so the subtitle
        // appeared to linger above/below during navigation. Removed: only the
        // active item draws its description (fading in at the active row).
      }

      ctx.shadowBlur = 0;
      ctx.shadowOffsetY = 0;
      ctx.globalAlpha = 1;
    }
  }

  // === DRAW ITEMS with submenu slide animation ===
  // Real XMB submenu layout (measured sub_system_real_top.png): entering a
  // submenu does NOT leave the parent items in one linear list. Instead the
  // parent (category) item list COLLAPSES:
  //   - the SELECTED parent item slides left to the breadcrumb column
  //     (PARENT_COL_X 316, at the focus row) and stays a normal-size icon (the
  //     "cube"), its text fading away;
  //   - the OTHER (sibling) items gather into a faded uniform column at
  //     SIB_X (~455), 80px pitch centred on the selected slot (which is left
  //     empty because it was pulled to the breadcrumb), fading with distance;
  //   - the children slide in from the right and fade in at the item column.
  // The category icon (e.g. the Settings toolbox) is moved to the breadcrumb by
  // the category-bar code above. This replaces the old single-column render that
  // crammed every sibling into one bright linear list at x316.
  const SLIDE_DIST = V.ITEM_ICON_X - V.PARENT_COL_X; // 250px child slide-in distance
  const SIB_X = 455;                                 // faded sibling column (566 - 111)

  // Draw the parent layer at collapse factor t (0 = full bright list at the item
  // column, exactly as it looked before pressing X; 1 = settled breadcrumb +
  // faded sibling column). Used for both the live enter/exit animation and the
  // settled state, so the two are perfectly continuous (no snap).
  function drawParentLayer(pItems, pIdx, t) {
    const srcX = V.ITEM_ICON_X;
    for (let i = 0; i < pItems.length; i++) {
      const sel = (i === pIdx);
      // Y morphs from the full carousel layout to the uniform collapsed column.
      const ySrc = itemSlotY(i, pIdx);
      const yDst = V.ITEM_FOCUS_Y + (i - pIdx) * V.PARENT_SPACING;
      const y = ySrc + (yDst - ySrc) * t;
      if (y < frameTopV() - 40 || y > frameTopV() + frameHV() + 40) continue;
      // X slides to the breadcrumb (selected) or the faded sibling column.
      const dstX = sel ? V.PARENT_COL_X : SIB_X;
      const cx = srcX + (dstX - srcX) * t;
      // Alpha eases from the full-list value to the settled value (selected stays
      // bright as the breadcrumb cube; siblings fade, more so with distance).
      const dist = Math.abs(i - pIdx);
      const fullA = sel ? V.ALPHA_FOCUS : V.ALPHA_INACTIVE;
      const setA = sel ? 0.92 : Math.max(0.12, 0.42 - (dist - 1) * 0.05);
      let a = fullA + (setA - fullA) * t;
      if (y < 40) a *= Math.max(0, y / 40);
      if (y > V.H - 20) a *= Math.max(0, (V.H - y) / 20);
      const pic = getIcon(pItems[i].i);
      if (a > 0.01 && (pic.loaded || pic.normalMapReady)) {
        const psz = V.ITEM_ICON_SIZE * iconScale(pItems[i].i);
        ctx.globalAlpha = a;
        drawIconAt(ctx, pic, pItems[i].i, XCL(cx, psz / 2), y - psz / 2, psz, psz);
      }
      // Item TEXT only exists in the full list; it fades out as we collapse and
      // travels left with its icon so it reads as the same row sliding away.
      const textA = (1 - t) * (sel ? V.ALPHA_FOCUS : V.ALPHA_INACTIVE);
      if (textA > 0.02) {
        ctx.globalAlpha = textA;
        ctx.fillStyle = sel ? 'rgb(255,255,255)' : 'rgb(235,235,235)';
        ctx.font = (sel ? V.ITEM_TEXT_ACTIVE_SIZE : V.ITEM_TEXT_SIZE) + 'px PS3';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(pItems[i].n, XCP(V.ITEM_TEXT_X + (cx - srcX)), y);
      }
    }
    ctx.globalAlpha = 1;
  }

  // Back-chevron breadcrumb: solid left-pointing gradient triangle (~30px),
  // measured sub_system_real_d01.png (tip x~430,y~508; base x~462). alphaMul
  // fades it in/out with the collapse.
  function drawBackChevron(alphaMul) {
    if (alphaMul <= 0.02) return;
    const chCy = V.ITEM_FOCUS_Y, chH = 30, chTipX = XCP(430), chBaseX = XCP(462);
    const chGrad = ctx.createLinearGradient(0, chCy - chH / 2, 0, chCy + chH / 2);
    chGrad.addColorStop(0, 'rgb(206,206,208)');
    chGrad.addColorStop(1, 'rgb(120,120,124)');
    ctx.globalAlpha = 0.95 * alphaMul;
    ctx.fillStyle = chGrad;
    ctx.beginPath();
    ctx.moveTo(chTipX, chCy);
    ctx.lineTo(chBaseX, chCy - chH / 2);
    ctx.lineTo(chBaseX, chCy + chH / 2);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  if (submenuAnim && slideProgress !== null) {
    const p = slideProgress;
    // Collapse factor: 1 = fully settled in the submenu, 0 = full parent list.
    const t = (submenuAnim.dir === 1) ? p : (1 - p);
    drawParentLayer(submenuAnim.parentItems, submenuAnim.parentIdx, t);
    // Children slide in from the right and fade in as the parent collapses.
    const childShift = SLIDE_DIST * (1 - t);
    drawItemList(submenuAnim.childItems, 0, childShift, t, 0);
    drawBackChevron(t);
  } else {
    const parentFrame = stack.length ? stack[stack.length - 1] : null;
    if (inSubmenu && parentFrame) {
      drawParentLayer(parentFrame.items, parentFrame.pi, 1);
      drawBackChevron(1);
    }

    // Draw current items at the regular column. When an item-nav animation is
    // in flight, pass the previous selected index and eased progress so each
    // item interpolates between its old and new slot independently. Otherwise
    // pass null and the function uses static layout.
    let animFromIdx = null, animEase = null;
    if (itemAnim && itemAnim.fromIdx !== undefined) {
      const elapsed = now - itemAnim.start;
      const tt = Math.min(elapsed / itemAnim.dur, 1);
      animFromIdx = itemAnim.fromIdx;
      // Respect a per-anim ease override (RPCS3-observed Hermite); fall back
      // to default smoothstep if none.
      animEase = itemAnim.ease ? itemAnim.ease(tt) : ease(tt);
    }
    // Description crossfade progress: linear 0..1 over ITEM_DESC_FADE_MS.
    // Linear feels right for opacity blends; the Hermite ease used for the
    // slide motion would over-emphasize the endpoints in alpha space.
    let descFadeProgress = null, descFromIdx = null;
    if (itemDescAnim) {
      const elapsed = now - itemDescAnim.start;
      descFadeProgress = Math.min(elapsed / itemDescAnim.dur, 1);
      descFromIdx = itemDescAnim.fromIdx;
    }
    // Category-switch horizontal slide: when navCat is in flight (and we are
    // NOT inside a submenu), render BOTH the outgoing category's item list
    // sliding out and the incoming list sliding in from the opposite side.
    // This matches the PS3 XMB's "items move with the bar" feel - the cat
    // icon row and the items below are a single rail that translates together
    // on left/right press. Without it, the item list snaps to the new
    // category's contents at t=0 of the cat animation and the user only sees
    // the icon row move, breaking the rail illusion.
    if (catAnim && catAnim.oldItems && !inSubmenu) {
      // Drive the item list slide using the EXACT same screen-space delta as
      // the cat icon bar so the row of items reads as a single rail moving
      // together with the icon row.
      //
      // Cat bar offset(t) = catAnim.from * (1 - e) + catAnim.to * e
      //                   = (live + dir*CAT_SPACING) * (1 - e)
      // Δbar over the anim = -(live + dir*CAT_SPACING) [the bar slides this far].
      //
      // To keep items locked to the bar on chained presses (where live != 0
      // and the bar actually travels MORE than one CAT_SPACING in a single
      // animation), the item shift must use the SAME total distance as the
      // bar, NOT a fixed CAT_SPACING. Otherwise the bar finishes its visual
      // travel ahead of the items on every chained press, giving the
      // "category and submenu items not in sync" complaint.
      const tt = Math.min((now - catAnim.start) / catAnim.dur, 1);
      const p = catAnim.ease ? catAnim.ease(tt) : ease(tt);
      // Total signed distance the bar travels over THIS animation.
      // bar offset(t=0) = catAnim.from, bar offset(t=1) = catAnim.to = 0.
      // Bar's screen delta = catAnim.to - catAnim.from = -catAnim.from.
      // For chained presses catAnim.from = live + dir*SPACING (can exceed
      // a single CAT_SPACING), so using this directly keeps items locked
      // to the bar's actual visible travel.
      const barTravel = catAnim.from - catAnim.to;
      // Old items: start at 0, slide by -barTravel (same direction as the
      // bar's screen translation). New items: enter from +barTravel and
      // settle to 0. Both mirror the bar exactly.
      const oldShift = -barTravel * p;
      const newShift = barTravel * (1 - p);
      // Alpha curve: PS3 XMB reference (overview_0017..0021) shows old
      // items fading OUT fast, items area mostly blank in the middle,
      // new items fading IN over the back half. A symmetric crossfade
      // (oldAlpha = 1-p, newAlpha = p) overlapped both lists at 50%
      // intensity in the middle, producing the heavy text-pile that
      // read as a rubber-band smear. With the asymmetric curve below
      // the middle frames show only sparse residual content, matching
      // overview_0018 (items area near-empty mid-transition).
      const oldAlpha = Math.max(0, 1 - p / 0.4);
      const newAlpha = Math.max(0, (p - 0.5) / 0.5);
      drawItemList(catAnim.oldItems, catAnim.oldIi, oldShift, oldAlpha * bootIconReveal, 0);
      drawItemList(curItems(), ii, newShift, newAlpha * bootIconReveal, 0);
    } else {
      drawItemList(curItems(), ii, 0, 1 * bootIconReveal, 0, animFromIdx, animEase, descFadeProgress, descFromIdx);
    }
  }

  // === CLOCK ===
  // The clock fades in with the icon cascade during the boot reveal.
  drawClock(inBootReveal ? bootIconReveal : 1);
}

// One-shot clock-hand spin. The real XMB spins the analog hands a full
// revolution whenever the menu context changes -- entering/leaving a submenu
// (clock stays visible, hands cycle round and settle back on the time, verified
// /work/clock2.mp4) OR a fullscreen dialog / landing (where the clock also fades
// out via the chrome cross-fade, verified /work/clock.mp4). Side-panel choosers
// (Theme/Colour) are NOT a context change, so they don't trigger it. Returns the
// spin progress [0..1] of the most recent change; 1 (settled) leaves the hands
// exactly on the current time.
let _clkMenuSig = null, _clkSpinStart = -1e9;
const CLOCK_SPIN_MS = 620;        // duration of the hand cycle
// Per-spin revolutions for each hand. Both are integers so the hands always
// land back exactly on the current time, and they DIFFER by one so the minute
// hand laps the hour hand exactly once -- the two hands cross into a single
// overlapping line midway through the cycle (the real icon's "spin -> hands
// align into a line -> settle" detail).
const CLOCK_MIN_TURNS = 2;        // minute hand: two full revolutions
const CLOCK_HOUR_TURNS = 1;       // hour hand: one (laps -> one crossing)
function clockSpinProgress() {
  const now = performance.now();
  const sig = stack.length + '|'
            + ((dialogState && dialogState.template && dialogState.template.panel !== true) ? 'd' : '')
            + (dialogClosing ? 'c' : '')
            + (landingState ? 'l' : '');
  if (_clkMenuSig === null) { _clkMenuSig = sig; }    // first frame: no spin
  else if (sig !== _clkMenuSig) { _clkMenuSig = sig; _clkSpinStart = now; }
  return Math.min(1, Math.max(0, (now - _clkSpinStart) / CLOCK_SPIN_MS));
}

function drawClock(fadeMul) {
  if (fadeMul === undefined) fadeMul = 1;
  // window.PIN_TIME (epoch ms) pins the clock for frame-accurate comparison
  // against the captured real-XMB reference frames. Production uses live time.
  const d = (typeof window !== 'undefined' && window.PIN_TIME != null)
    ? new Date(window.PIN_TIME) : new Date();
  const day = d.getDate();
  const month = d.getMonth() + 1;
  const h = d.getHours();
  const minNum = d.getMinutes();
  const min = minNum.toString().padStart(2, '0');
  // Format matches RPCS3 reference: "DD/M H:MM" (day/month hour:minute, no leading zero on month/hour)
  const timeStr = day + '/' + month + ' ' + h + ':' + min;

  ctx.save();

  // 4:3: the clock is right-anchored. Shift the whole group left so its right
  // edge lands on the 4:3 frame edge, keeping its size (LAYOUT_XC-1 is 0 in 16:9).
  // PORTRAIT: the visible frame extends above the virtual design (frameTopV < 0),
  // leaving a big gap above the clock's normal y. Raise the clock toward the top
  // of the frame (its top edge ~40px below the frame top) so it doesn't float in
  // the middle. In landscape (frameTopV >= 0) the clock keeps its normal y.
  const clockTopY = 75;                                  // the clock frame's top y
  const clockDY = (frameTopV() < 0) ? (frameTopV() + 40 - clockTopY) : 0;
  ctx.translate(V.W * (LAYOUT_FIT - 1), clockDY);

  // ---- Drop shadow (whole clock group) ----
  // The real PS3 XMB renders the clock with a subtle dark drop shadow for
  // legibility over the animated wave. Measured from the real reference frames:
  // a soft dark shadow offset ~1px down with a small blur and ~0.5 alpha.
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = 3;
  ctx.shadowOffsetX = 0;
  ctx.shadowOffsetY = 1;

  // ---- Clock frame ----
  // Measured from RPCS3 1080p:
  //   Top line at y=75, bottom line at y=132, left line at x=1329 (single-pixel thin line)
  //   Frame extends past the right edge of the screen (open-right U-shape)
  //   Corner radius at top-left and bottom-left ~6px
  //   Border brightness ~90/255 with a soft inner glow extending ~6px into the frame
  const fx = V.CLOCK_FRAME_X;
  const fy = V.CLOCK_FRAME_Y;
  const fw = V.CLOCK_FRAME_W;
  const fh = V.CLOCK_FRAME_H;
  const fr = V.CLOCK_FRAME_CORNER;
  const xRight = fx + fw + 4;  // extend past screen edge so the frame is open on the right

  // ---- Background dim behind the clock frame ----
  // The real XMB darkens the area INSIDE the clock box so the white time/border
  // reads cleanly over bright backgrounds. It is most visible on the blue PSN
  // Sign Up screen (psn_signup_landing.png), where a faint translucent-dark
  // rounded panel sits behind the clock. Fill the open-right rounded rect with a
  // subtle dark wash, shadow disabled so the panel itself casts none.
  ctx.save();
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.globalAlpha = 0.18 * fadeMul;
  ctx.fillStyle = 'rgb(0,0,0)';
  ctx.beginPath();
  ctx.moveTo(xRight, fy);
  ctx.lineTo(fx + fr, fy);
  ctx.quadraticCurveTo(fx, fy, fx, fy + fr);
  ctx.lineTo(fx, fy + fh - fr);
  ctx.quadraticCurveTo(fx, fy + fh, fx + fr, fy + fh);
  ctx.lineTo(xRight, fy + fh);
  ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Inner soft glow (extends from the U-line inward into the frame interior).
  // Drawn as a clipped, slightly inset stroke pass with reduced alpha. The clip
  // restricts the glow to the frame's interior.
  ctx.save();
  ctx.shadowColor = 'transparent';
  ctx.shadowBlur = 0;
  ctx.shadowOffsetY = 0;
  ctx.beginPath();
  // Clip to the open-right rectangle minus the rounded corners
  ctx.moveTo(xRight, fy);
  ctx.lineTo(fx + fr, fy);
  ctx.quadraticCurveTo(fx, fy, fx, fy + fr);
  ctx.lineTo(fx, fy + fh - fr);
  ctx.quadraticCurveTo(fx, fy + fh, fx + fr, fy + fh);
  ctx.lineTo(xRight, fy + fh);
  ctx.closePath();
  ctx.clip();
  // Draw progressively dimmer 1-px strokes inset further into the frame to
  // simulate the inner glow seen in the reference (brightness 67, 48, 32, 19,
  // 10 at distances 1-5 from the border line). Each stroke is centered on a
  // half-pixel offset so it rasterizes as a single crisp pixel row.
  const glowSteps = [
    { inset: 1, alpha: 0.26 }, // 67/255
    { inset: 2, alpha: 0.19 }, // 48/255
    { inset: 3, alpha: 0.13 }, // 32/255
    { inset: 4, alpha: 0.07 }, // 19/255
    { inset: 5, alpha: 0.04 }, // 10/255
  ];
  ctx.strokeStyle = 'rgba(255,255,255,1)';
  ctx.lineWidth = 1;
  for (const g of glowSteps) {
    ctx.globalAlpha = g.alpha * fadeMul;
    ctx.beginPath();
    // Use half-pixel centers so 1px strokes rasterize on a single row/col
    const ix = fx + g.inset + 0.5, iy = fy + g.inset + 0.5;
    const iw = fw - g.inset, ih = fh - 2 * g.inset - 1;
    const ir = Math.max(0, fr - g.inset);
    ctx.moveTo(xRight, iy);
    ctx.lineTo(ix + ir, iy);
    ctx.quadraticCurveTo(ix, iy, ix, iy + ir);
    ctx.lineTo(ix, iy + ih - ir);
    ctx.quadraticCurveTo(ix, iy + ih, ix + ir, iy + ih);
    ctx.lineTo(xRight, iy + ih);
    ctx.stroke();
  }
  ctx.restore();

  // Main border line (the bright outline at the very edge)
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; // ~90/255 measured
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(xRight, fy + 0.5);
  ctx.lineTo(fx + fr, fy + 0.5);
  ctx.quadraticCurveTo(fx + 0.5, fy + 0.5, fx + 0.5, fy + fr);
  ctx.lineTo(fx + 0.5, fy + fh - fr);
  ctx.quadraticCurveTo(fx + 0.5, fy + fh - 0.5, fx + fr, fy + fh - 0.5);
  ctx.lineTo(xRight, fy + fh - 0.5);
  ctx.stroke();

  // ---- Clock icon ----
  // Measured: 32x32 bbox, centre (1789.5, 103.5), outer radius 16. An outline
  // RING with two analog HANDS (hour + minute), a white glow and a dark drop
  // shadow. Pixel-matched to the 4K RPCS3 capture; see drawClockFace below.
  const iconR = V.CLOCK_ICON_R;
  const iconX = V.CLOCK_ICON_CX;
  const iconY = fy + fh / 2;

  // Hour/minute hand angles (canvas angle space; -PI/2 == 12 o'clock / up).
  const TWO_PI = Math.PI * 2;
  const UP = -Math.PI / 2;
  // Both hands rotate rigidly by `spin`, which eases from 0 up through one full
  // revolution and back to 0 over the spin (CLOCK_SWEEP_TURNS is an integer, so
  // it lands exactly on 2*PI identity) -- the hands cycle all the way around and
  // settle back on the current time. The boot/XMB-load reveal (fadeMul 0->1) also
  // spins the hands in.
  const spinT = ease(Math.max(clockSpinProgress(), Math.max(0, 1 - fadeMul)));
  const spin = spinT * TWO_PI;
  const hourAngle = UP + (((h % 12) + minNum / 60) / 12) * TWO_PI + spin * CLOCK_HOUR_TURNS;
  const minAngle = UP + (minNum / 60) * TWO_PI + spin * CLOCK_MIN_TURNS;

  // ---- Clock FACE: ring + two hands (pixel-matched to the 4K RPCS3 capture) ----
  //   ring stroke ~2.6 px, hands ~4 px (iconR*0.25) uniform width, hour hand to
  //   0.47*R, minute hand to 0.69*R. Drawn in three passes for the real look:
  //   a dark DROP SHADOW (offset down), a soft white GLOW halo, then the crisp
  //   white face. The face is two distinct hands -- NOT a filled wedge.
  const HAND_W = Math.max(2.4, iconR * 0.25);
  const RING_W = Math.max(2, iconR * 0.16);
  const hourLen = iconR * 0.47, minLen = iconR * 0.69;
  function drawClockFace() {
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(255,255,255,0.96)';
    ctx.lineWidth = RING_W;                       // ring
    ctx.beginPath();
    ctx.arc(iconX, iconY, iconR - RING_W / 2 - 0.6, 0, TWO_PI);
    ctx.stroke();
    ctx.lineWidth = HAND_W;                        // hands
    ctx.beginPath();
    ctx.moveTo(iconX, iconY);
    ctx.lineTo(iconX + Math.cos(hourAngle) * hourLen, iconY + Math.sin(hourAngle) * hourLen);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(iconX, iconY);
    ctx.lineTo(iconX + Math.cos(minAngle) * minLen, iconY + Math.sin(minAngle) * minLen);
    ctx.stroke();
  }
  ctx.save();
  // 1. dark drop shadow (offset down), matching the dark halo under the real icon
  ctx.shadowColor = 'rgba(0,0,0,0.55)';
  ctx.shadowBlur = 3; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 2;
  drawClockFace();
  // 2. soft white glow halo (the icon's signature glow -- subtle, not a bloom)
  ctx.shadowColor = 'rgba(255,255,255,0.35)';
  ctx.shadowBlur = 3.5; ctx.shadowOffsetY = 0;
  drawClockFace();
  // 3. crisp face on top, no shadow
  ctx.shadowColor = 'transparent'; ctx.shadowBlur = 0;
  drawClockFace();
  ctx.restore();
  ctx.lineCap = 'butt';

  // ---- Time text ----
  // Measured from RPCS3: digits span y=94..115 (baseline near y=114), text right
  // edge at x=1756, icon left edge at x=1774 (gap ~18px). Use alphabetic baseline
  // with explicit y so we don't rely on font-dependent 'middle' interpretation.
  ctx.font = '300 ' + V.CLOCK_SIZE + 'px PS3';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(255,255,255,0.92)';
  ctx.globalAlpha = fadeMul;
  // Baseline at y=114 (digit bottoms at y=115 minus 1 for descenderless digits)
  ctx.fillText(timeStr, iconX - iconR - 18, fy + fh - 18);

  ctx.restore();
}

// =====================================================
// DIALOG / LANDING NAVIGATION HELPERS
// =====================================================
// Move the selection index inside an open dialog. For chooser dialogs the
// selection wraps within options[]. For confirm dialogs LEFT/RIGHT toggles
// between Yes (sel=0) and No (sel=1). For info dialogs there is only one
// button so we ignore the input.
function navDialog(dir) {
  if (!dialogState) return;
  const t = dialogState.template;
  if (t.type === 'chooser' || t.type === 'chooser_illust') {
    const n = (t.options || []).length;
    if (!n) return;
    dialogState.sel = (dialogState.sel + dir + n) % n;
    playCursor();
    // Immediate hover-preview: apply (without saving) so the user sees the
    // colour/theme/background change the instant they move onto it.
    if (t.themeKey) previewThemeSelection(t.themeKey, dialogState.sel);
  } else if (t.type === 'confirm') {
    dialogState.sel = dialogState.sel === 0 ? 1 : 0;
    playCursor();
  }
}

// Word-wrap helper for canvas 2D. Splits on whitespace and explicit newlines
// in the input string. Returns array of pre-wrapped lines.
function wrapLines(ctx2, text, maxWidth) {
  const out = [];
  const paras = (text || '').split('\n');
  for (const p of paras) {
    if (!p.length) { out.push(''); continue; }
    const words = p.split(' ');
    let line = '';
    for (const w of words) {
      const test = line ? line + ' ' + w : w;
      if (ctx2.measureText(test).width <= maxWidth) {
        line = test;
      } else {
        if (line) out.push(line);
        line = w;
      }
    }
    if (line) out.push(line);
  }
  return out;
}

// Rounded-rect path helper used by the dialog panel.
function roundRect(ctx2, x, y, w, h, r) {
  if (r > w / 2) r = w / 2;
  if (r > h / 2) r = h / 2;
  ctx2.beginPath();
  ctx2.moveTo(x + r, y);
  ctx2.lineTo(x + w - r, y);
  ctx2.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx2.lineTo(x + w, y + h - r);
  ctx2.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx2.lineTo(x + r, y + h);
  ctx2.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx2.lineTo(x, y + r);
  ctx2.quadraticCurveTo(x, y, x + r, y);
  ctx2.closePath();
}

// Draw the Cross (X) glyph used for OK button hints.
function drawCrossGlyph(ctx2, cx, cy, r) {
  ctx2.save();
  ctx2.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx2.lineWidth = 2;
  ctx2.beginPath();
  ctx2.arc(cx, cy, r, 0, Math.PI * 2);
  ctx2.stroke();
  const d = r * 0.45;
  ctx2.beginPath();
  ctx2.moveTo(cx - d, cy - d); ctx2.lineTo(cx + d, cy + d);
  ctx2.moveTo(cx + d, cy - d); ctx2.lineTo(cx - d, cy + d);
  ctx2.stroke();
  ctx2.restore();
}

// Draw the Circle glyph used for Cancel/Back button hints.
function drawCircleGlyph(ctx2, cx, cy, r) {
  ctx2.save();
  ctx2.strokeStyle = 'rgba(255,255,255,0.95)';
  ctx2.lineWidth = 2;
  ctx2.beginPath();
  ctx2.arc(cx, cy, r, 0, Math.PI * 2);
  ctx2.stroke();
  ctx2.restore();
}

// =====================================================
// DIALOG VECTOR ILLUSTRATIONS
// =====================================================
// When an illustration asset is missing, draw a stylised vector version. All
// illustrations render centred in the box (cx,cy) at the given approximate
// size sz. Matches the PS3 "diagram-style" black-on-white look.
function drawIllustration(ctx2, key, cx, cy, sz) {
  ctx2.save();
  if (key === 'hdmi_cable') {
    // Vertical HDMI cable: female receptacle + air gap + male plug + cable.
    // Measured against the PS3 firmware photograph at
    // /tmp/ref_hdmi_crop.png: total image 52w x 177h (ratio ~3.4:1).
    // Layout proportions (fractions of the total height h):
    //   receptacle:   0.000 - 0.085 (thin horizontal bar)
    //   gap:          0.085 - 0.190
    //   gold tongue:  0.190 - 0.310
    //   plastic body: 0.310 - 0.700
    //   strain sleeve:0.700 - 0.820
    //   cable:        0.820 - 1.000
    const h = sz;                  // total height of the diagram
    const w = h * 0.30;            // 52/177 ≈ 0.294
    const top = cy - h/2;
    // --- Receptacle (female HDMI port, horizontal pill) ---
    const rectW = w * 0.95, rectH = h * 0.060;
    const rx = cx - rectW/2, ry = top;
    ctx2.fillStyle = '#bbbbbb';
    ctx2.fillRect(rx - 2, ry, rectW + 4, rectH);
    // Black slot (the bunch of fine pins inside the HDMI port)
    ctx2.fillStyle = '#0a0a0a';
    ctx2.fillRect(rx + rectW*0.06, ry + rectH*0.18, rectW*0.88, rectH*0.55);
    // Small lighter pin slits inside the slot
    ctx2.fillStyle = '#9a9a9a';
    const pins = 5;
    for (let i = 0; i < pins; i++) {
      ctx2.fillRect(rx + rectW*0.12 + i*(rectW*0.76/pins), ry + rectH*0.25, 1.5, rectH*0.4);
    }
    // --- Gold tongue (connector inserts at top of male plug) ---
    const tongueW = w * 0.78, tongueH = h * 0.10;
    const tx = cx - tongueW/2, ty = top + h*0.190;
    const tongueGrad = ctx2.createLinearGradient(0, ty, 0, ty + tongueH);
    tongueGrad.addColorStop(0, '#e0b440');
    tongueGrad.addColorStop(0.5, '#caa430');
    tongueGrad.addColorStop(1, '#876010');
    ctx2.fillStyle = tongueGrad;
    // Trapezoid: wider at top, slightly narrower at bottom (matches HDMI plug shape)
    ctx2.beginPath();
    ctx2.moveTo(tx, ty);
    ctx2.lineTo(tx + tongueW, ty);
    ctx2.lineTo(tx + tongueW - 3, ty + tongueH);
    ctx2.lineTo(tx + 3, ty + tongueH);
    ctx2.closePath();
    ctx2.fill();
    // --- Black plastic body (the bulk of the plug) ---
    const bodyW = w, bodyH = h * 0.39;
    const bx = cx - bodyW/2, by = ty + tongueH;
    const bodyGrad = ctx2.createLinearGradient(bx, 0, bx + bodyW, 0);
    bodyGrad.addColorStop(0, '#1a1a1a');
    bodyGrad.addColorStop(0.5, '#3a3a3a');
    bodyGrad.addColorStop(1, '#0e0e0e');
    ctx2.fillStyle = bodyGrad;
    ctx2.beginPath();
    ctx2.moveTo(bx + 4, by);
    ctx2.lineTo(bx + bodyW - 4, by);
    ctx2.quadraticCurveTo(bx + bodyW, by, bx + bodyW, by + 4);
    ctx2.lineTo(bx + bodyW, by + bodyH - 6);
    ctx2.quadraticCurveTo(bx + bodyW, by + bodyH, bx + bodyW - 6, by + bodyH);
    ctx2.lineTo(bx + 6, by + bodyH);
    ctx2.quadraticCurveTo(bx, by + bodyH, bx, by + bodyH - 6);
    ctx2.lineTo(bx, by + 4);
    ctx2.quadraticCurveTo(bx, by, bx + 4, by);
    ctx2.closePath();
    ctx2.fill();
    // Subtle highlight strip down the centre
    ctx2.fillStyle = 'rgba(255,255,255,0.06)';
    ctx2.fillRect(bx + bodyW*0.45, by + 4, bodyW*0.10, bodyH - 8);
    // --- Strain-relief sleeve (cable enters here) ---
    const sw_ = bodyW * 0.55, sh_ = h * 0.12;
    const sx = cx - sw_/2, syy = by + bodyH;
    const sleeveGrad = ctx2.createLinearGradient(0, syy, 0, syy + sh_);
    sleeveGrad.addColorStop(0, '#1a1a1a');
    sleeveGrad.addColorStop(1, '#070707');
    ctx2.fillStyle = sleeveGrad;
    ctx2.beginPath();
    ctx2.moveTo(sx, syy);
    ctx2.lineTo(sx + sw_, syy);
    ctx2.lineTo(sx + sw_ - 6, syy + sh_);
    ctx2.lineTo(sx + 6, syy + sh_);
    ctx2.closePath();
    ctx2.fill();
    // --- Cable trailing down ---
    const cw = sw_ * 0.55, cy2 = syy + sh_;
    ctx2.fillStyle = '#070707';
    ctx2.fillRect(cx - cw/2, cy2, cw, h * 0.18);
  } else if (key === 'av_multi') {
    // Black & gold AV multi connector (PS3 proprietary)
    const w = sz * 0.45;
    const top = cy - sz/2;
    // Receptacle (white outline) at top
    ctx2.fillStyle = '#fff';
    ctx2.fillRect(cx - w*0.5, top, w, 4);
    ctx2.fillStyle = '#000';
    ctx2.fillRect(cx - w*0.45, top + 1, w*0.9, 2);
    // Gold pin row
    const pinY = top + 30;
    ctx2.fillStyle = '#d4a838';
    ctx2.fillRect(cx - w*0.4, pinY, w*0.8, 8);
    // Black body
    const bodyY = pinY + 10;
    ctx2.fillStyle = '#0a0a0a';
    ctx2.beginPath();
    ctx2.moveTo(cx - w*0.55, bodyY);
    ctx2.lineTo(cx + w*0.55, bodyY);
    ctx2.lineTo(cx + w*0.5, bodyY + sz*0.45);
    ctx2.lineTo(cx - w*0.5, bodyY + sz*0.45);
    ctx2.closePath();
    ctx2.fill();
    // Trailing cable
    ctx2.fillRect(cx - w*0.15, bodyY + sz*0.45, w*0.3, sz*0.25);
  } else if (key === 'hdd_warning') {
    // Stylized 3.5" hard disk drive with warning triangle overlay.
    // Drawn in a small isometric perspective for visual interest.
    const sw = sz * 0.72, sh = sz * 0.46;
    const dx = cx - sw/2, dy = cy - sh*0.55;
    // Top face (lighter)
    const tg = ctx2.createLinearGradient(0, dy, 0, dy + sh*0.18);
    tg.addColorStop(0, '#c8c8d2');
    tg.addColorStop(1, '#9a9aa6');
    ctx2.fillStyle = tg;
    const skew = sw * 0.08;
    ctx2.beginPath();
    ctx2.moveTo(dx + skew, dy);
    ctx2.lineTo(dx + sw + skew, dy);
    ctx2.lineTo(dx + sw, dy + sh*0.16);
    ctx2.lineTo(dx, dy + sh*0.16);
    ctx2.closePath();
    ctx2.fill();
    // Front face (darker)
    const fg = ctx2.createLinearGradient(0, dy + sh*0.16, 0, dy + sh);
    fg.addColorStop(0, '#5d6068');
    fg.addColorStop(1, '#2c2e34');
    ctx2.fillStyle = fg;
    ctx2.fillRect(dx, dy + sh*0.16, sw, sh*0.84);
    // Side face
    ctx2.fillStyle = '#3a3c42';
    ctx2.beginPath();
    ctx2.moveTo(dx + sw, dy + sh*0.16);
    ctx2.lineTo(dx + sw + skew, dy);
    ctx2.lineTo(dx + sw + skew, dy + sh*0.84);
    ctx2.lineTo(dx + sw, dy + sh);
    ctx2.closePath();
    ctx2.fill();
    // Mounting screws on front
    ctx2.fillStyle = '#1a1b1f';
    for (let sx = 0; sx < 4; sx++) {
      const px2 = dx + sw*0.08 + sx*sw*0.27;
      ctx2.beginPath(); ctx2.arc(px2, dy + sh*0.85, 3, 0, Math.PI*2); ctx2.fill();
    }
    // Label area
    ctx2.fillStyle = '#888a90';
    ctx2.fillRect(dx + sw*0.1, dy + sh*0.28, sw*0.65, sh*0.32);
    // Label lines
    ctx2.fillStyle = '#3a3c42';
    ctx2.fillRect(dx + sw*0.15, dy + sh*0.36, sw*0.45, 2);
    ctx2.fillRect(dx + sw*0.15, dy + sh*0.45, sw*0.35, 2);

    // Warning triangle overlay bottom-right
    const tr = sz * 0.20;
    const tcx = cx + sz*0.30, tcy = cy + sz*0.20;
    // Triangle fill
    const triGrad = ctx2.createLinearGradient(tcx, tcy - tr, tcx, tcy + tr);
    triGrad.addColorStop(0, '#fde04a');
    triGrad.addColorStop(1, '#e09812');
    ctx2.fillStyle = triGrad;
    ctx2.beginPath();
    ctx2.moveTo(tcx, tcy - tr);
    ctx2.lineTo(tcx + tr*0.92, tcy + tr*0.55);
    ctx2.lineTo(tcx - tr*0.92, tcy + tr*0.55);
    ctx2.closePath();
    ctx2.fill();
    ctx2.strokeStyle = '#1a1a1a';
    ctx2.lineWidth = 3;
    ctx2.stroke();
    // Exclamation
    ctx2.fillStyle = '#1a1a1a';
    ctx2.fillRect(tcx - 3, tcy - tr*0.45, 6, tr*0.65);
    ctx2.beginPath();
    ctx2.arc(tcx, tcy + tr*0.35, 4, 0, Math.PI*2);
    ctx2.fill();
  } else if (key === 'globe') {
    // Stylized globe with meridians (used for internet-related dialogs).
    const r = sz * 0.32;
    ctx2.strokeStyle = '#9bc4ff';
    ctx2.lineWidth = 2;
    // Outer circle
    ctx2.beginPath(); ctx2.arc(cx, cy, r, 0, Math.PI*2); ctx2.stroke();
    // Equator
    ctx2.beginPath();
    ctx2.ellipse(cx, cy, r, r*0.25, 0, 0, Math.PI*2);
    ctx2.stroke();
    // Meridians
    for (let i = 0; i < 3; i++) {
      ctx2.beginPath();
      ctx2.ellipse(cx, cy, r*(0.35 + i*0.32), r, 0, 0, Math.PI*2);
      ctx2.stroke();
    }
    // Soft fill for depth
    const gg = ctx2.createRadialGradient(cx - r*0.3, cy - r*0.3, r*0.1, cx, cy, r);
    gg.addColorStop(0, 'rgba(255,255,255,0.10)');
    gg.addColorStop(1, 'rgba(0,30,80,0.30)');
    ctx2.fillStyle = gg;
    ctx2.beginPath(); ctx2.arc(cx, cy, r-1, 0, Math.PI*2); ctx2.fill();
  } else if (key === 'controller') {
    // Stylized DualShock 3 silhouette (used for controller-related dialogs).
    // Aspect ~1.8:1 wide, drawn in soft grey to match the white-icon family.
    const w = sz * 0.85, h = w * 0.55;
    const x0 = cx - w/2, y0 = cy - h/2;
    // Main body: two rounded grip lobes joined by a wider center.
    const cg = ctx2.createLinearGradient(0, y0, 0, y0 + h);
    cg.addColorStop(0, '#cfd0d6');
    cg.addColorStop(1, '#6a6b72');
    ctx2.fillStyle = cg;
    ctx2.beginPath();
    // Top profile (a gentle dip in the middle for the PS button)
    ctx2.moveTo(x0 + w*0.18, y0 + h*0.08);
    ctx2.quadraticCurveTo(x0 + w*0.30, y0 - h*0.05, x0 + w*0.45, y0 + h*0.10);
    ctx2.quadraticCurveTo(x0 + w*0.50, y0 + h*0.18, x0 + w*0.55, y0 + h*0.10);
    ctx2.quadraticCurveTo(x0 + w*0.70, y0 - h*0.05, x0 + w*0.82, y0 + h*0.08);
    // Right grip lobe
    ctx2.quadraticCurveTo(x0 + w*1.00, y0 + h*0.20, x0 + w*0.96, y0 + h*0.75);
    ctx2.quadraticCurveTo(x0 + w*0.85, y0 + h*1.08, x0 + w*0.65, y0 + h*0.90);
    ctx2.quadraticCurveTo(x0 + w*0.55, y0 + h*0.75, x0 + w*0.45, y0 + h*0.75);
    ctx2.quadraticCurveTo(x0 + w*0.35, y0 + h*0.75, x0 + w*0.35, y0 + h*0.90);
    // Left grip lobe
    ctx2.quadraticCurveTo(x0 + w*0.15, y0 + h*1.08, x0 + w*0.04, y0 + h*0.75);
    ctx2.quadraticCurveTo(x0 + w*0.00, y0 + h*0.20, x0 + w*0.18, y0 + h*0.08);
    ctx2.closePath();
    ctx2.fill();
    // D-pad on the left
    ctx2.fillStyle = '#3a3b40';
    const dpx = x0 + w*0.22, dpy = y0 + h*0.42, dps = h*0.13;
    ctx2.fillRect(dpx - dps*0.18, dpy - dps*0.55, dps*0.36, dps*1.1);
    ctx2.fillRect(dpx - dps*0.55, dpy - dps*0.18, dps*1.1, dps*0.36);
    // Right shape buttons
    ctx2.strokeStyle = '#3a3b40';
    ctx2.lineWidth = 2;
    const rcx = x0 + w*0.78, rcy = y0 + h*0.42, rs = h*0.11;
    ctx2.beginPath(); ctx2.arc(rcx,        rcy - rs*0.9, rs*0.32, 0, Math.PI*2); ctx2.stroke();
    ctx2.beginPath(); ctx2.arc(rcx + rs*0.9, rcy,        rs*0.32, 0, Math.PI*2); ctx2.stroke();
    ctx2.beginPath(); ctx2.arc(rcx - rs*0.9, rcy,        rs*0.32, 0, Math.PI*2); ctx2.stroke();
    ctx2.beginPath(); ctx2.arc(rcx,        rcy + rs*0.9, rs*0.32, 0, Math.PI*2); ctx2.stroke();
    // Twin analog sticks
    ctx2.fillStyle = '#1b1c20';
    ctx2.beginPath(); ctx2.arc(x0 + w*0.36, y0 + h*0.70, h*0.10, 0, Math.PI*2); ctx2.fill();
    ctx2.beginPath(); ctx2.arc(x0 + w*0.64, y0 + h*0.70, h*0.10, 0, Math.PI*2); ctx2.fill();
    // Center PS button
    ctx2.fillStyle = '#3a3b40';
    ctx2.beginPath(); ctx2.arc(cx, y0 + h*0.62, h*0.06, 0, Math.PI*2); ctx2.fill();
  } else if (key === 'bd_remote') {
    // Vertical BD remote control (used for the BD remote registration dialog).
    // Plain rounded-rectangle silhouette with a button grid and prominent
    // START + ENTER buttons highlighted at the bottom.
    const w = sz * 0.32, h = sz * 0.95;
    const x0 = cx - w/2, y0 = cy - h/2;
    // Body
    const bg = ctx2.createLinearGradient(0, y0, 0, y0 + h);
    bg.addColorStop(0, '#d4d4d8');
    bg.addColorStop(1, '#7a7a82');
    ctx2.fillStyle = bg;
    const r = w * 0.18;
    ctx2.beginPath();
    ctx2.moveTo(x0 + r, y0);
    ctx2.lineTo(x0 + w - r, y0);
    ctx2.quadraticCurveTo(x0 + w, y0, x0 + w, y0 + r);
    ctx2.lineTo(x0 + w, y0 + h - r);
    ctx2.quadraticCurveTo(x0 + w, y0 + h, x0 + w - r, y0 + h);
    ctx2.lineTo(x0 + r, y0 + h);
    ctx2.quadraticCurveTo(x0, y0 + h, x0, y0 + h - r);
    ctx2.lineTo(x0, y0 + r);
    ctx2.quadraticCurveTo(x0, y0, x0 + r, y0);
    ctx2.closePath();
    ctx2.fill();
    // IR window at top
    ctx2.fillStyle = '#1a1a1f';
    ctx2.fillRect(x0 + w*0.30, y0 + h*0.03, w*0.40, h*0.04);
    // Directional pad (large round, upper-mid)
    ctx2.fillStyle = '#9d9da4';
    ctx2.beginPath(); ctx2.arc(cx, y0 + h*0.18, w*0.34, 0, Math.PI*2); ctx2.fill();
    ctx2.fillStyle = '#3a3b40';
    ctx2.beginPath(); ctx2.arc(cx, y0 + h*0.18, w*0.18, 0, Math.PI*2); ctx2.fill();
    // Generic button grid (3x4)
    ctx2.fillStyle = '#3a3b40';
    for (let row = 0; row < 4; row++) {
      for (let col = 0; col < 3; col++) {
        ctx2.beginPath();
        ctx2.arc(x0 + w*(0.22 + col*0.28), y0 + h*(0.36 + row*0.10), w*0.07, 0, Math.PI*2);
        ctx2.fill();
      }
    }
    // START + ENTER highlight bar
    ctx2.fillStyle = '#fde04a';
    ctx2.fillRect(x0 + w*0.10, y0 + h*0.82, w*0.35, h*0.07);
    ctx2.fillRect(x0 + w*0.55, y0 + h*0.82, w*0.35, h*0.07);
    ctx2.fillStyle = '#1a1a1f';
    ctx2.font = (Math.round(h*0.045)) + 'px PS3';
    ctx2.textAlign = 'center';
    ctx2.textBaseline = 'middle';
    ctx2.fillText('START', x0 + w*0.275, y0 + h*0.855);
    ctx2.fillText('ENTER', x0 + w*0.725, y0 + h*0.855);
  }
  ctx2.restore();
}

// =====================================================
// DIALOG OVERLAY (fullscreen, PS3-style)
// =====================================================
// drawDialog renders a fullscreen dialog with a blurred wave backdrop that
// replaces the XMB. Geometry was measured against the firmware captures:
//   /work/ps3/xmb_dump/sysupdate_loaded.png       (chooser, no illustration)
//   /work/ps3/xmb_dump/menu_traversal/dialog_sound_settings.png
//                                                  (chooser_illust with HDMI cable)
// Both show 1920x1080 frames with:
//   - Top divider line at y=199, bottom divider at y=880.
//   - Title icon+text at y~173-185 starting at x~122 (left edge ~120).
//   - Body text at y~300, centered.
//   - Option list centered (chooser) or right-side (chooser_illust).
//   - Button hints at y~905 centered: "X Enter" left, "O Cancel" right.
//
// The backdrop is the live wave canvas, downsampled to a small offscreen and
// then composited back onto the main 2D canvas with ctx.filter='blur(...)'.
// A darkening overlay restores legibility for the white dialog text.
function drawDialog(ctx2) {
  if (!dialogState) return;
  const ds = dialogState;
  const t = ds.template;
  const now = performance.now();
  const ap = ds.anim ? Math.min(1, (now - ds.anim.start) / ds.anim.dur) : 1;

  // Side-panel choosers (Theme/Color/Background and other simple lists) keep
  // the XMB fully visible behind the panel, matching real PS3 firmware. The
  // fullscreen blurred-backdrop branch below is skipped in this case.
  if (t.panel === true && (t.type === 'chooser' || t.type === 'chooser_illust')) {
    drawSidePanel(ctx2, ds, ap);
    return;
  }

  ctx2.save();

  // -----------------------------------------------------------------------
  // Blurred wave backdrop. The wave canvas (id=#wave) holds the live WebGL
  // composite of the XMB background. We:
  //   1. Downsample it into dialogBlurCanvas (DIALOG_BLUR_W x DIALOG_BLUR_H).
  //   2. Draw the offscreen back at full V.W x V.H with ctx.filter='blur(...)'.
  //      The blur kernel works on a tiny image (cheap) but at high enough
  //      radius that the upscale + blur read as a single soft wash.
  //   3. Lay a translucent black on top to darken further for legibility.
  // Opacity ramps with ap (the existing fade-in progress), so the dialog
  // smoothly cross-fades from the live XMB to the blurred backdrop.
  // -----------------------------------------------------------------------
  ctx2.setTransform(1, 0, 0, 1, 0, 0); // device-pixel space for backdrop draw
  const cw = xmbCanvas.width;
  const ch = xmbCanvas.height;

  // -----------------------------------------------------------------------
  // Live-wave dialogs (System Update): the wave + plum gradient keep
  // rendering live behind the dialog (they are already on the canvas under
  // us, the wave was NOT faded out). We only overlay a dark vignette:
  // near-pure black above the header divider, fading to a ~45% dark tint
  // over the body. Matches the RPCS3 capture (top = (0,0,0), body gradient
  // darkened to ~(65,44,71)). The foreground chrome (header/options/footer)
  // cross-fades in/out via `ap`.
  // -----------------------------------------------------------------------
  if (isLiveWaveDlg(t)) {
    // System Update: the real PS3 keeps the LIVE XMB gradient + wave showing
    // through, but BLURRED and DIMMED (a translucent dark wash, NOT opaque
    // black). Reference frames (xmb-ref/sysupdate/frames_enter, settled):
    // mid-body ~(56,44,63), bottom ~(81,56,88), top near-black -- so the
    // purple gradient clearly reads through a dim, blurred backdrop. Its body
    // laplacian variance (~260) is well below the crisp live wave (~350),
    // confirming the blur.
    //
    // Blur path: the live #bg + #wave canvases BEHIND this dialog layer are
    // gaussian-blurred via a CSS filter (ramped with the transition progress in
    // the frame loop), so the purple gradient + wave already read through
    // softened. We do NOT re-draw a blurred wave copy on the dialog layer here
    // (that would double the wave and, because the behind canvases stayed
    // sharp, used to let crisp wave lines bleed through the translucent dim).
    // The dialog layer only lays the darkening overlay on top of the (now
    // blurred) live backdrop.

    // Translucent dim overlay (NOT opaque, and UNIFORM - no black top).
    // The live XMB gradient (per-month Original color) is already blurred by
    // the CSS filter on the #bg/#wave canvases behind us; here we only lay a
    // single uniform translucent darkening so that the per-month color (e.g.
    // May teal) stays clearly visible THROUGH the dim across the whole frame,
    // including at the very top. Previously this was a near-opaque black at
    // the top (0.93) which both produced a black band and washed the color
    // out of the upper region; a flat ~0.4 wash dims for text legibility while
    // preserving the gradient chroma everywhere.
    ctx2.globalAlpha = ap;
    ctx2.fillStyle = 'rgba(0,0,0,0.40)';
    ctx2.fillRect(0, 0, cw, ch);
  } else if (waveCanvas && waveCanvas.width > 0 && waveCanvas.height > 0) {
    // Downsample wave into the small blur canvas (cheap copy).
    dialogBlurCtx.setTransform(1, 0, 0, 1, 0, 0);
    dialogBlurCtx.globalAlpha = 1;
    dialogBlurCtx.globalCompositeOperation = 'copy';
    dialogBlurCtx.imageSmoothingEnabled = true;
    dialogBlurCtx.imageSmoothingQuality = 'low';
    try {
      dialogBlurCtx.drawImage(waveCanvas, 0, 0, DIALOG_BLUR_W, DIALOG_BLUR_H);
    } catch (e) {
      // If the waveCanvas read fails for any reason (e.g. context loss),
      // skip the blur and fall back to the dark backdrop.
    }
    dialogBlurCtx.globalCompositeOperation = 'source-over';
  } else {
    // No wave canvas yet (still booting). Fill with a soft dark tone so the
    // dialog still has a visible backdrop.
    dialogBlurCtx.setTransform(1, 0, 0, 1, 0, 0);
    dialogBlurCtx.fillStyle = '#101018';
    dialogBlurCtx.fillRect(0, 0, DIALOG_BLUR_W, DIALOG_BLUR_H);
  }

  if (!isLiveWaveDlg(t)) {
    // Crossfade: leave the XMB visible (already on the canvas) and fade the
    // blurred backdrop in over it. Once ap reaches 1 the backdrop is fully
    // opaque, so the XMB content underneath no longer affects the result.
    ctx2.globalAlpha = ap;
    // CSS-filter blur is applied to the upscale draw. 18px of blur on the
    // upscaled image (with the source already heavily downsampled) gives a
    // soft, smoothly varying wash with no recognisable wave detail.
    ctx2.filter = 'blur(18px)';
    ctx2.imageSmoothingEnabled = true;
    ctx2.imageSmoothingQuality = 'high';
    ctx2.drawImage(dialogBlurCanvas, 0, 0, DIALOG_BLUR_W, DIALOG_BLUR_H,
                                      0, 0, cw, ch);
    ctx2.filter = 'none';

    // Darken overlay so the white dialog text/glyphs retain enough contrast
    // against the bright XMB wave gradient. 0.4 at full ap leaves enough
    // chroma to read as "blurred wave" rather than "solid dark panel".
    ctx2.fillStyle = 'rgba(0,0,0,' + (0.40 * ap).toFixed(3) + ')';
    ctx2.fillRect(0, 0, cw, ch);
  }

  // Restore the virtual-pixel transform for the dialog chrome, CENTRED in the
  // visible frame (frameCenterTY is 0 in 16:9; in portrait / zoomed frames it
  // shifts the 1080 design so the dialog sits centred instead of stuck at the
  // top of a tall frame).
  ctx2.setTransform(dpr * scaleX, 0, 0, dpr * scaleY, 0, frameCenterTY());
  ctx2.globalAlpha = ap;

  // ---- Dialog text drop shadow ----
  // The real XMB renders the dialog title / prompt / footer text with a subtle
  // dark drop shadow so they read cleanly over the blurred wave/gradient (same
  // legibility shadow used on the XMB menu labels). Measured: ~1px down, small
  // blur, ~0.5 alpha. Set here so the title, body prompt and footer hints all
  // inherit it; drawDialogOption applies its own (selected halo / per-option
  // shadow) inside an isolated save/restore, and the hairline dividers are
  // explicitly cleared of it below.
  ctx2.shadowColor = 'rgba(0,0,0,' + (0.5 * ap).toFixed(3) + ')';
  ctx2.shadowBlur = 3;
  ctx2.shadowOffsetX = 0;
  ctx2.shadowOffsetY = 1;

  // -----------------------------------------------------------------------
  // Header strip: small item icon + title text, divider below.
  // -----------------------------------------------------------------------
  const HEADER_DIV_Y = 199;          // measured: divider line y in 1920x1080 frame
  const FOOTER_DIV_Y = 880;          // measured: footer divider y
  const TITLE_BASELINE = 187;        // measured: title text baseline ~y=187
  const TITLE_X = 160;               // measured: title text starts ~x=160 (icon ~120)
  const ICON_CX = 130;
  const ICON_CY = 175;
  const ICON_SZ = 36;

  // Item icon (small, white-rendered)
  const ic = ds.iconId ? getIcon(ds.iconId) : null;
  if (ic && (ic.loaded || ic.normalMapReady)) {
    drawIconAt(ctx2, ic, ds.iconId, ICON_CX - ICON_SZ/2, ICON_CY - ICON_SZ/2, ICON_SZ, ICON_SZ);
  }

  // Title
  ctx2.fillStyle = '#fff';
  ctx2.textAlign = 'left';
  ctx2.textBaseline = 'alphabetic';
  ctx2.font = '28px PS3';
  ctx2.fillText(t.title || '', TITLE_X, TITLE_BASELINE);

  // Top & bottom divider lines (1px white-ish hairline). Clear the text drop
  // shadow first so the hairlines rasterize crisp, then restore it for the body.
  ctx2.save();
  ctx2.shadowColor = 'rgba(0,0,0,0)';
  ctx2.shadowBlur = 0;
  ctx2.shadowOffsetY = 0;
  ctx2.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx2.lineWidth = 1;
  ctx2.beginPath();
  ctx2.moveTo(0, HEADER_DIV_Y);  ctx2.lineTo(XCF(V.W), HEADER_DIV_Y);
  ctx2.moveTo(0, FOOTER_DIV_Y);  ctx2.lineTo(XCF(V.W), FOOTER_DIV_Y);
  ctx2.stroke();
  ctx2.restore();

  // -----------------------------------------------------------------------
  // Body / options layout
  // -----------------------------------------------------------------------
  // Each branch lays out its own content within the band y=HEADER_DIV_Y..FOOTER_DIV_Y.
  const innerTop = HEADER_DIV_Y;
  const innerBot = FOOTER_DIV_Y;

  if (t.type === 'info') {
    // Info: title above, body text centered. Optional illustration in the
    // upper-middle of the band, then the body lines below it.
    let centerCY = (innerTop + innerBot) / 2;
    if (t.illustration) {
      drawIllustration(ctx2, t.illustration, XCF(V.W/2), innerTop + 230, 280);
      centerCY = innerTop + 460;
    }
    ctx2.font = '26px PS3';
    ctx2.fillStyle = 'rgba(255,255,255,0.95)';
    ctx2.textAlign = 'center';
    const lines = wrapLines(ctx2, t.body || '', (V.W - 400) * LAYOUT_FIT);
    const lh = 36;
    let ty = centerCY - (lines.length - 1) * lh / 2;
    for (const ln of lines) { ctx2.fillText(ln, XCF(V.W/2), ty); ty += lh; }
  } else if (t.type === 'chooser') {
    // Chooser (no illustration): body centered near upper third, then
    // option list centered below it. PS3 ref measurement (sysupdate):
    //   body at y=300 (h=13), options at y=510-568 (sel option taller).
    ctx2.font = '24px PS3';
    ctx2.fillStyle = 'rgba(255,255,255,0.95)';
    ctx2.textAlign = 'center';
    const bodyLines = wrapLines(ctx2, t.body || '', (V.W - 400) * LAYOUT_FIT);
    let ty = innerTop + 105;
    for (const ln of bodyLines) { ctx2.fillText(ln, XCF(V.W/2), ty); ty += 32; }
    // Options. For long lists (>9 items, e.g. Color chooser with 15 colors)
    // we window the visible slice around ds.sel so the focused item is
    // always centered/visible. PS3 firmware similarly scrolls long option
    // lists in the Photo timeline picker and other chooser dialogs.
    const opts = t.options || [];
    const optTop = innerTop + 305;
    const optSpacing = 46;
    // Visible area between optTop and the FOOTER_DIV_Y (880) reserving
    // ~40px for the optional bottom arrow indicator.
    const availH = 880 - optTop - 40;
    const visibleCount = Math.max(3, Math.floor(availH / optSpacing));
    let firstVisible = 0;
    let lastVisible = opts.length - 1;
    if (opts.length > visibleCount) {
      // Centre the selection in the visible window when possible.
      firstVisible = Math.max(0, Math.min(
        opts.length - visibleCount,
        ds.sel - Math.floor(visibleCount / 2)
      ));
      lastVisible = firstVisible + visibleCount - 1;
    }
    for (let i = firstVisible; i <= lastVisible; i++) {
      const sel = (i === ds.sel);
      const optY = optTop + (i - firstVisible) * optSpacing;
      drawDialogOption(ctx2, opts[i], XCF(V.W/2), optY, sel, 'center');
    }
    // Up/down arrow hints if the list is windowed.
    if (firstVisible > 0) {
      ctx2.fillStyle = 'rgba(255,255,255,0.5)';
      ctx2.font = '20px PS3';
      ctx2.fillText('\u25B2', XCF(V.W/2), optTop - 18);
    }
    if (lastVisible < opts.length - 1) {
      ctx2.fillStyle = 'rgba(255,255,255,0.5)';
      ctx2.font = '20px PS3';
      ctx2.fillText('\u25BC', XCF(V.W/2), optTop + visibleCount * optSpacing + 6);
    }
  } else if (t.type === 'chooser_illust') {
    // Body text centered upper. Options centered upper. Illustration centered
    // mid. Notice text just above the footer divider.
    //
    // PS3 ref measurement (audio_output):
    //   body at y~315 (centered, full body line ~x=632-1286)
    //   HDMI option at y~420, Optical at y~462, Audio Input at y~500 (left-aligned at x~709)
    //   HDMI cable illustration centered around y~610..830
    //   "Turn on the power..." notice at y~860 centered
    ctx2.font = '24px PS3';
    ctx2.fillStyle = 'rgba(255,255,255,0.95)';
    ctx2.textAlign = 'center';
    const bodyLines = wrapLines(ctx2, t.body || '', (V.W - 400) * LAYOUT_FIT);
    let by = innerTop + 115;
    for (const ln of bodyLines) { ctx2.fillText(ln, XCF(V.W/2), by); by += 32; }
    // Options - left-aligned around x = V.W*0.37 (matches PS3 ref ~x=709/1920)
    const opts = t.options || [];
    const OPT_X = Math.round(XCF(V.W * 0.37));
    const optTop = innerTop + 220;
    const optSpacing = 42;
    for (let i = 0; i < opts.length; i++) {
      const sel = (i === ds.sel);
      const optY = optTop + i * optSpacing;
      drawDialogOption(ctx2, opts[i], OPT_X, optY, sel, 'left');
